# Local dev override (untracked). Purposes:
#
# 1. Bake the deployed model's token budget into settings.json via the
#    entrypoint. MINDER_MODEL (Qwen3.5-35B-A3B-FP8) has a 30000-token window and
#    is NOT in the models.dev registry, so Minder cannot auto-derive it and
#    defaults to max_context_tokens=100000 / max_tokens=16384 — which overflows
#    the real window. We write the correct values (from .env) instead.
#
# 2. host.docker.internal parity for the module_template services, so the module
#    can optionally point at a host service (e.g. LM Studio) with no other change.
services:
  minder:
    environment:
      # Real token budget for the deployed model's 30000-token window.
      - MINDER_MAX_CONTEXT_TOKENS=${MINDER_MAX_CONTEXT_TOKENS:-24000}
      - MINDER_MAX_TOKENS=${MINDER_MAX_TOKENS:-4096}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /home/minder/.minder
        : "$${MINDER_MODEL:?MINDER_MODEL must be set (add it to .env)}"
        : "$${MINDER_API_BASE_URL:?MINDER_API_BASE_URL must be set (add it to .env)}"
        printf '{"model":"%s","api_base_url":"%s","max_tokens":%s,"max_context_tokens":%s}\n' "$${MINDER_MODEL}" "$${MINDER_API_BASE_URL}" "$${MINDER_MAX_TOKENS:-4096}" "$${MINDER_MAX_CONTEXT_TOKENS:-24000}" > /home/minder/.minder/settings.json
        exec minder --host 0.0.0.0 --port 8080

  minder-worker:
    environment:
      - MINDER_MAX_CONTEXT_TOKENS=${MINDER_MAX_CONTEXT_TOKENS:-24000}
      - MINDER_MAX_TOKENS=${MINDER_MAX_TOKENS:-4096}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /home/minder/.minder
        : "$${MINDER_MODEL:?MINDER_MODEL must be set (add it to .env)}"
        : "$${MINDER_API_BASE_URL:?MINDER_API_BASE_URL must be set (add it to .env)}"
        printf '{"model":"%s","api_base_url":"%s","max_tokens":%s,"max_context_tokens":%s}\n' "$${MINDER_MODEL}" "$${MINDER_API_BASE_URL}" "$${MINDER_MAX_TOKENS:-4096}" "$${MINDER_MAX_CONTEXT_TOKENS:-24000}" > /home/minder/.minder/settings.json
        exec taskiq worker minder.core.tasks.broker:broker minder.core.tasks.tasks

  # module_template full-stack services — reach in-compose db/redis/minio/minder/
  # keycloak only; host.docker.internal added for parity.
  module-template-web:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  module-template-worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
