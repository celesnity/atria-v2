# Local dev override (untracked). Purposes:
#
# 1. Bake the deployed model's token budget into settings.json via the
#    entrypoint. ATRIA_MODEL (Qwen3.5-35B-A3B-FP8) has a 30000-token window and
#    is NOT in the models.dev registry, so Atria cannot auto-derive it and
#    defaults to max_context_tokens=100000 / max_tokens=16384 — which overflows
#    the real window. We write the correct values (from .env) instead.
#
# 2. host.docker.internal parity for the module_template services, so the module
#    can optionally point at a host service (e.g. LM Studio) with no other change.
services:
  atria:
    environment:
      # Real token budget for the deployed model's 30000-token window.
      - ATRIA_MAX_CONTEXT_TOKENS=${ATRIA_MAX_CONTEXT_TOKENS:-24000}
      - ATRIA_MAX_TOKENS=${ATRIA_MAX_TOKENS:-4096}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /home/atria/.atria
        : "$${ATRIA_MODEL:?ATRIA_MODEL must be set (add it to .env)}"
        : "$${ATRIA_API_BASE_URL:?ATRIA_API_BASE_URL must be set (add it to .env)}"
        printf '{"model":"%s","api_base_url":"%s","max_tokens":%s,"max_context_tokens":%s}\n' "$${ATRIA_MODEL}" "$${ATRIA_API_BASE_URL}" "$${ATRIA_MAX_TOKENS:-4096}" "$${ATRIA_MAX_CONTEXT_TOKENS:-24000}" > /home/atria/.atria/settings.json
        exec atria --host 0.0.0.0 --port 8080

  atria-worker:
    environment:
      - ATRIA_MAX_CONTEXT_TOKENS=${ATRIA_MAX_CONTEXT_TOKENS:-24000}
      - ATRIA_MAX_TOKENS=${ATRIA_MAX_TOKENS:-4096}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /home/atria/.atria
        : "$${ATRIA_MODEL:?ATRIA_MODEL must be set (add it to .env)}"
        : "$${ATRIA_API_BASE_URL:?ATRIA_API_BASE_URL must be set (add it to .env)}"
        printf '{"model":"%s","api_base_url":"%s","max_tokens":%s,"max_context_tokens":%s}\n' "$${ATRIA_MODEL}" "$${ATRIA_API_BASE_URL}" "$${ATRIA_MAX_TOKENS:-4096}" "$${ATRIA_MAX_CONTEXT_TOKENS:-24000}" > /home/atria/.atria/settings.json
        exec taskiq worker atria.core.tasks.broker:broker atria.core.tasks.tasks

  # module_template full-stack services — reach in-compose db/redis/minio/atria/
  # keycloak only; host.docker.internal added for parity.
  module-template-web:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  module-template-worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
