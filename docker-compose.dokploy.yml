# Core deploy for Dokploy — minder + the produce module in ONE compose so they
# share a network and reach each other by service DNS (minder:8080 /
# produce-web:9310). Cross-compose over published ports hairpin-fails on this
# host, so co-locating them is the reliable path. Postgres/Redis/Keycloak are the
# REMOTE services from env. Secrets/model come from Dokploy env ( ${...} ).
services:
  minder:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - MINDER_API_BASE_URL=${MINDER_API_BASE_URL}
      - MINDER_MODEL=${MINDER_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL}
      - MINDER_REDIS_URL=${MINDER_REDIS_URL}
      - AUTH_MODE=keycloak
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL}
      - KEYCLOAK_REALM=minder
      - KEYCLOAK_BACKEND_CLIENT_ID=minder-backend
      - KEYCLOAK_BACKEND_CLIENT_SECRET=${KEYCLOAK_BACKEND_CLIENT_SECRET}
      - MINDER_MODULE_CLIENT_SECRET=${MINDER_MODULE_CLIENT_SECRET:-}
      - QDRANT_URL=${QDRANT_URL:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - EK_QDRANT_URL=${EK_QDRANT_URL:-}
      - EK_QDRANT_API_KEY=${EK_QDRANT_API_KEY:-}
      - MINDER_DISABLED_MODULES=${MINDER_DISABLED_MODULES:-}
    volumes:
      - minder_data:/home/minder/.minder
      - ./modules:/app/modules

  produce-web:
    build:
      context: .
      dockerfile: modules/produce/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - minder
    ports:
      - "9310:9310"
    environment:
      - PR_DATABASE_URL=${PR_DATABASE_URL}
      - PR_REDIS_URL=${PR_REDIS_URL}
      - PR_PUBLIC_BASE=http://14.225.206.18:9310
      - PR_S3_ENDPOINT=${PR_S3_ENDPOINT:-http://14.225.206.18:9000}
      - PR_S3_BUCKET=produce
      - PR_S3_ACCESS_KEY=${MT_S3_ACCESS_KEY:-minioadmin}
      - PR_S3_SECRET_KEY=${MT_S3_SECRET_KEY:-minioadmin}
      - PR_AGENT_ENABLED=1
      # Same compose network → reach minder + advertise self by service DNS.
      - MINDER_URL=http://minder:8080
      - MINDER_MODULE_CONNECTOR_URL=http://produce-web:9310
      # The BROWSER loads the microfrontend, so this stays the public URL.
      - MINDER_MODULE_REMOTE_ENTRY=http://14.225.206.18:9310/dashboard/remoteEntry.js
      - MINDER_DEFAULT_AUTONOMY=medium
      - KEYCLOAK_TOKEN_URL=https://iam-keycloak-2bc632-14-225-206-18.sslip.io/realms/minder/protocol/openid-connect/token
      - MINDER_MODULE_CLIENT_ID=minder-module
      - MINDER_MODULE_CLIENT_SECRET=${MINDER_MODULE_CLIENT_SECRET}
      - MINDER_MODULE_HEARTBEAT_SEC=10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9310/connector/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  produce-worker:
    build:
      context: .
      dockerfile: modules/produce/worker/Dockerfile
    restart: unless-stopped
    environment:
      - PR_DATABASE_URL=${PR_DATABASE_URL}
      - PR_REDIS_URL=${PR_REDIS_URL}

volumes:
  minder_data:
