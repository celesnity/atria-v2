# Self-contained core stack for Dokploy (single compose file, built from Git).
# Dokploy clones the repo and runs `docker compose -f docker-compose.dokploy.yml
# up --build`, so this file merges what `make core` gets from base + local into
# one file, minus the localhost-only bits:
#   - real Keycloak (dev H2, imports the realm) instead of the parked nginx block
#   - public/issuer URLs pinned to the server IP (matches the realm redirect URIs)
#   - minder on host 8090, keycloak 8082, minio 9001/9002; redis + db internal
# Secrets + model/endpoint come from Dokploy's env for this service ( ${...} ).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=minder
      - POSTGRES_USER=minder
      - POSTGRES_PASSWORD=minder
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minder -d minder"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME=http://14.225.206.18:8082
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=false
      - MINDER_MODULE_CLIENT_SECRET=${MINDER_MODULE_CLIENT_SECRET:-CHANGE-ME-IN-ENV}
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/realm-minder-local.json:/opt/keycloak/data/import/realm.json:ro

  minder:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MINDER_API_BASE_URL=${MINDER_API_BASE_URL}
      - MINDER_MODEL=${MINDER_MODEL}
      - DATABASE_URL=postgresql://minder:minder@db:5432/minder
      - MINDER_REDIS_URL=redis://redis:6379/0
      - MINDER_DISABLED_MODULES=${MINDER_DISABLED_MODULES:-}
      - MINDER_ASR_BASE_URL=http://asr:9000/v1
      - AUTH_MODE=keycloak
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_PUBLIC_URL=http://14.225.206.18:8082
      - KEYCLOAK_REALM=minder
      - KEYCLOAK_BACKEND_CLIENT_ID=minder-backend
      - KEYCLOAK_BACKEND_CLIENT_SECRET=${KEYCLOAK_BACKEND_CLIENT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - minder_data:/home/minder/.minder
      - ./modules:/app/modules

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MT_S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MT_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - module_template_media:/data

volumes:
  minder_data:
  postgres_data:
  module_template_media:
