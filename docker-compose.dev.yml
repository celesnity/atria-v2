services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=minder
      - POSTGRES_USER=minder
      - POSTGRES_PASSWORD=minder
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minder -d minder"]
      interval: 5s
      timeout: 5s
      retries: 5

  blackboard-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=blackboard
      - POSTGRES_USER=blackboard
      - POSTGRES_PASSWORD=blackboard
    volumes:
      - blackboard_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackboard -d blackboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  # agent-blackboard's own MCP-tool-exposing server (../agent-blackboard, sibling repo).
  # Built from its own Dockerfile, unmodified. main_agent talks to it over /mcp — see
  # .mcp.json and MINDER.md's "Master Agent" section for the client side of this.
  blackboard-server:
    build:
      context: ../agent-blackboard
    restart: unless-stopped
    depends_on:
      blackboard-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://blackboard:blackboard@blackboard-db:5432/blackboard
      # Dev convenience only — seeds a fixed dev tenant + this key on boot
      # (see seed_dev_tenant in agent-blackboard's infrastructure-postgres crate).
      - DEV_API_KEY=${BLACKBOARD_API_KEY:-dev-key}
      # Host header allowlist (DNS-rebinding protection) — must include the compose
      # service name main_agent will call it as.
      - MCP_ALLOWED_HOSTS=blackboard-server
      - RUST_LOG=info
    ports:
      - "${BLACKBOARD_HOST_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
      - ADMINER_DEFAULT_DB=minder
      - ADMINER_DEFAULT_USERNAME=minder
      - ADMINER_DEFAULT_PASSWORD=minder
      - ADMINER_DESIGN=pepa-linha

  minder:
    build: .
    ports:
      - "${MINDER_HOST_PORT:-8080}:8080"
    environment:
      - MINDER_ASR_BASE_URL=http://asr:9000/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - MINDER_API_BASE_URL=${MINDER_API_BASE_URL}
      - MINDER_MODEL=${MINDER_MODEL}
      - DATABASE_URL=${DATABASE_URL:-postgresql://minder:minder@db:5432/minder}
      - MINDER_REDIS_URL=${MINDER_REDIS_URL:-redis://redis:6379/0}
      - MINDER_DISABLED_MODULES=${MINDER_DISABLED_MODULES:-}
      - BLACKBOARD_MCP_URL=${BLACKBOARD_MCP_URL:-http://blackboard-server:8080/mcp}
      - BLACKBOARD_API_KEY=${BLACKBOARD_API_KEY:-dev-key}
      - BLACKBOARD_PROJECT_ID=${BLACKBOARD_PROJECT_ID:-}
      - BLACKBOARD_ID=${BLACKBOARD_ID:-}
      # - MC_INDEX_EMBED_BASE_URL=http://tei:80/v1
      # - MC_CHUNK_EMBED_BASE_URL=http://tei:80/v1
      # - MC_SYNTHESIS_BASE_URL=${MC_SYNTHESIS_BASE_URL:-http://copilot-llm:8000/v1}
      # - MC_KG_EXTRACT_BASE_URL=${MC_KG_EXTRACT_BASE_URL:-http://copilot-llm:8000/v1}
      # Knowledge base — all backing services run locally in this compose:
      - QDRANT_URL=http://qdrant:6333
      - KNOWLEDGE_NEO4J_URI=bolt://neo4j:7687
      - KNOWLEDGE_NEO4J_USER=neo4j
      - KNOWLEDGE_NEO4J_PASSWORD=minder-neo4j
      - KNOWLEDGE_GRAPH_ENABLED=1
      - KNOWLEDGE_SEED_DIR=/knowledge
      - KNOWLEDGE_DEV_TENANT=dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - minder_data:/home/minder/.minder
      # Mount Python source for hot reload — no rebuild needed on code change
      - ./minder:/app/minder
      # Mount modules so new/edited modules appear without rebuilding the image
      - ./modules:/app/modules
      # Knowledge seed dir: drop <tenant_id>/<category>/<files> here — auto-ingested
      # on startup and on `POST /knowledge/rescan`.
      - ./knowledge:/knowledge
    command: >
      /bin/sh -c "
        mkdir -p /home/minder/.minder &&
        : \"$${MINDER_MODEL:?MINDER_MODEL must be set (add it to .env)}\" &&
        : \"$${MINDER_API_BASE_URL:?MINDER_API_BASE_URL must be set (add it to .env)}\" &&
        printf '{\"model\":\"%s\",\"api_base_url\":\"%s\"}\n'
          \"$${MINDER_MODEL}\"
          \"$${MINDER_API_BASE_URL}\"
          > /home/minder/.minder/settings.json &&
        exec uvicorn minder.web.server:create_app --factory
          --host 0.0.0.0 --port 8080
          --reload --reload-dir /app/minder
          --reload-delay 0.25
          --log-level info
      "

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Qdrant vector store — local for dev (dense knowledge search).
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/minder-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  minder_data:
  postgres_data:
  neo4j_data:
  qdrant_data:
  blackboard_db_data:
