# Single-entry reverse proxy for Minder.
#
# The whole stack is reachable through this one port. The browser only ever
# talks to the Minder web app, which uses same-origin paths:
#   - static UI + REST under  /api
#   - WebSockets under         /ws  and  /ws/transcribe
# so proxying everything to the `minder` service is transparent — no frontend
# changes needed. Keycloak (if enabled) is hosted externally and the browser
# reaches it directly, so it is intentionally NOT proxied here.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Streaming agent responses and file uploads: don't cap size, don't buffer.
    client_max_body_size 0;

    # Map the Upgrade header so WebSocket upgrades pass through correctly while
    # plain HTTP keep-alive still works.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream minder_backend {
        server minder:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # WebSocket endpoints — chat stream and speech-to-text.
        location /ws {
            proxy_pass http://minder_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            # Long-lived sockets: keep them open across idle agent turns.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # Everything else — static UI + REST /api (streaming responses included).
        location / {
            proxy_pass http://minder_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stream server-sent chunks straight through without buffering.
            proxy_buffering off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }
    }
}
