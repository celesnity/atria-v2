<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>Minder — Your AI Co-Worker</title>
    <meta
      name="description"
      content="Minder is an AI co-worker that helps you think, plan, research, and get work done. A live web workspace for AI-driven chat, brainstorming, writing, and analysis."
    />
    <meta name="keywords" content="Minder, AI co-worker, AI assistant, AI thought partner, brainstorming assistant, research assistant, AI productivity" />
    <meta name="author" content="Minder" />
    <meta name="application-name" content="Minder" />
    <meta name="theme-color" content="#05060F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#2563EB" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Canonical: replace with your deployed origin -->
    <link rel="canonical" href="https://minder.dev/" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Minder" />
    <meta property="og:title" content="Minder — Your AI Co-Worker" />
    <meta
      property="og:description"
      content="An AI co-worker that helps you think, plan, research, and get work done — with a live web workspace for chat, brainstorming, and analysis."
    />
    <meta property="og:url" content="https://minder.dev/" />
    <meta property="og:image" content="https://minder.dev/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Minder — your AI co-worker" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Minder — Your AI Co-Worker" />
    <meta
      name="twitter:description"
      content="An AI co-worker that helps you think, plan, research, and get work done — with a live web workspace for chat, brainstorming, and analysis."
    />
    <meta name="twitter:image" content="https://minder.dev/og-image.svg" />
    <meta name="twitter:image:alt" content="Minder — your AI co-worker" />

    <!-- Robots: this is an authenticated app shell; keep it out of search indexes.
         Change to "index, follow" if you deploy a public marketing page here. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Perf: warm up font hosts used by the app -->
    <link rel="preconnect" href="https://rsms.me" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Minder",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web, macOS, Linux, Windows",
        "description": "Minder is an AI co-worker that helps you think, plan, research, and get work done, with a live web workspace for chat, brainstorming, and analysis.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Minder requires JavaScript. Please enable it to use the app.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
