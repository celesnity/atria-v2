    <path d="M60 0 C64.2 37.8 84.2 61.8 122 66 C84.2 70.2 64.2 94.2 60 132 C55.8 94.2 35.8 70.2 -2 66 C35.8 61.8 55.8 37.8 60 0 Z" fill="url(#brand)"/>
