      <stop offset="0" stop-color="#1E50D8"/>
      <stop offset="0.52" stop-color="#2E6BF6"/>
      <stop offset="1" stop-color="#5AA6FF"/>
    </linearGradient>
    <radialGradient id="wash" cx="230" cy="150" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12245C"/>
      <stop offset="0.45" stop-color="#0A1030"/>
