# Local-dev override — run the whole stack on localhost without touching the
# cloud-pointed .env. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build <services>
#
# - Minder uses the local `db` container (fresh schema.sql), not the remote prod
#   Postgres in .env. Redis is already hardcoded to redis:6379 in the base file.
# - A local Keycloak (dev mode, in-memory H2) imports the `minder` realm from
#   keycloak/realm-minder-local.json so service modules can self-register:
#     * users log in via Keycloak (public `minder-web` client, PKCE)
#     * module-template fetches a service token (minder-module client) and
#       announces to Minder → connector goes live (health 200, tools, push).
#   Issuer is pinned to http://localhost:8082 (KC_HOSTNAME) so a token minted
#   over the in-compose backchannel (keycloak:8080) still validates against
#   Minder's KEYCLOAK_PUBLIC_URL. Minder reaches Keycloak internally at keycloak:8080
#   for JWKS/token; the browser reaches it at localhost:8082.
# - nginx is parked behind an unused profile: it's the broken "move kc to cloud"
#   block (nginx image running Keycloak's start-dev command) and would crash; we
#   don't need it because Minder publishes host :8080 directly.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_HTTP_ENABLED=true
      # Pin the public/issuer URL so backchannel-minted tokens (keycloak:8080)
      # carry issuer http://localhost:8082/realms/minder — matches Minder's
      # KEYCLOAK_PUBLIC_URL. Backchannel is non-dynamic so it uses the same.
      - KC_HOSTNAME=http://localhost:8082
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=false
      # Substituted into realm-minder-local.json's ${MINDER_MODULE_CLIENT_SECRET}
      # at --import-realm; must match module-template's MINDER_MODULE_CLIENT_SECRET.
      - MINDER_MODULE_CLIENT_SECRET=${MINDER_MODULE_CLIENT_SECRET:-CHANGE-ME-IN-ENV}
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/realm-minder-local.json:/opt/keycloak/data/import/realm.json:ro
    restart: unless-stopped

  minder:
    environment:
      # TEMP: per-phase TTFT profiler — logs elapsed-since-query at each setup
      # boundary + the action-LLM dispatch offset. Remove when done.
      MINDER_TTFT_PROFILE: "1"
      DATABASE_URL: postgresql://minder:minder@db:5432/minder
      AUTH_MODE: keycloak
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8082
      KEYCLOAK_REALM: minder
      KEYCLOAK_BACKEND_CLIENT_ID: minder-backend
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:-O5Fc8ZjN8uMeDC7l-fz0eocWplZZStrjzTjU6TRaMlA}
    depends_on:
      keycloak:
        condition: service_started

  nginx:
    profiles: ["donotstart"]
