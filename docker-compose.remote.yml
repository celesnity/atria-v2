# Remote override — run the self-contained core stack on the remote box
# (14.225.206.18), reachable by server IP + port. Layer on base + local:
#   MINDER_HOST_PORT=8090 REDIS_HOST_PORT=6380 docker compose --env-file .env \
#     -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.remote.yml \
#     up -d --build
#
# The box already uses host 8080/8081/6379, so ports move via env (MINDER_HOST_PORT
# 8090, REDIS_HOST_PORT 6380 loopback-only) and adminer is off. Keycloak stays on
# 8082 with its public/issuer URL repointed from localhost to the server IP so
# browser login + token issuer line up (must match the realm redirect URIs).
# minio keeps 9001/9002 (free on the box). Env maps merge by key — no list clashes.
services:
  minder:
    environment:
      KEYCLOAK_PUBLIC_URL: http://14.225.206.18:8082

  keycloak:
    environment:
      KC_HOSTNAME: http://14.225.206.18:8082
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"

  adminer:
    profiles: ["donotstart"]
