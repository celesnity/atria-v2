services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=atria
      - POSTGRES_USER=atria
      - POSTGRES_PASSWORD=atria
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atria -d atria"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dedicated PostGIS + pgvector Postgres for the tasco_jarvis_map module
  # (GeoRAG hybrid retrieval). Separate from the core `db` so the app database
  # stays on the plain postgres image. Host port 5433.
  map-db:
    build: ./modules/tasco_jarvis_map/db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=atria_map
      - POSTGRES_USER=atria_map
      - POSTGRES_PASSWORD=atria_map
    ports:
      - "5433:5432"
    volumes:
      - map_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atria_map -d atria_map"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
      - ADMINER_DEFAULT_DB=atria
      - ADMINER_DEFAULT_USERNAME=atria
      - ADMINER_DEFAULT_PASSWORD=atria
      - ADMINER_DESIGN=pepa-linha
    depends_on:
      db:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/keycloak
      - KC_DB_USERNAME=atria
      - KC_DB_PASSWORD=atria
      - KC_HOSTNAME=localhost
      - KC_HTTP_ENABLED=true
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; printf 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  atria:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ATRIA_API_BASE_URL=${ATRIA_API_BASE_URL}
      - ATRIA_MODEL=${ATRIA_MODEL}
      # vetc_copilot (VETC Auto-Pilot) Brain — override in .env
      - VA_BRAIN_PROVIDER=${VA_BRAIN_PROVIDER:-openrouter}
      - VA_BRAIN_MODEL=${VA_BRAIN_MODEL:-openai/gpt-4o-mini}
      - VA_BRAIN_BASE_URL=${VA_BRAIN_BASE_URL:-https://openrouter.ai/api/v1}
      # vetc_copilot real VETC Mini App integration (credentials from .env)
      - VETC_ENV=${VETC_ENV:-uat}
      - VETC_CLIENT_ID=${VETC_CLIENT_ID:-}
      - VETC_CLIENT_SECRET=${VETC_CLIENT_SECRET:-}
      - VETC_TERMINAL_ID=${VETC_TERMINAL_ID:-com.vetc.charging}
      - VETC_MINI_APP_ID=${VETC_MINI_APP_ID:-}
      - VETC_BASE_URL=${VETC_BASE_URL:-http://vetc-sandbox:9099/partner-gateway/v1}
      - VETC_IPN_URL=${VETC_IPN_URL:-http://vetc-copilot:8770/ipn}
      - VETC_IPN_SECRET=${VETC_IPN_SECRET:-sandbox-hmac-secret}
      - DATABASE_URL=${DATABASE_URL:-postgresql://atria:atria@db:5432/atria}
      - MAP_DATABASE_URL=${MAP_DATABASE_URL_DOCKER:-postgresql://atria_map:atria_map@map-db:5432/atria_map}
      - ATRIA_MAP_BACKEND=${ATRIA_MAP_BACKEND:-db}
      - ATRIA_REDIS_URL=redis://redis:6379/0
      - ATRIA_DISABLED_MODULES=${ATRIA_DISABLED_MODULES:-}
      - MC_INDEX_EMBED_BASE_URL=http://tei:80/v1
      - MC_CHUNK_EMBED_BASE_URL=http://tei:80/v1
      - MC_SYNTHESIS_BASE_URL=${MC_SYNTHESIS_BASE_URL:-http://copilot-llm:8000/v1}
      - MC_KG_EXTRACT_BASE_URL=${MC_KG_EXTRACT_BASE_URL:-http://copilot-llm:8000/v1}
      - MC_QDRANT_URL=http://qdrant:6333
      - MC_NEO4J_URI=bolt://neo4j:7687
      - MC_NEO4J_USER=neo4j
      - MC_NEO4J_PASSWORD=atria-neo4j
      # enterprise_knowledge (EK) module — OpenRouter embeddings + gpt-4o-mini
      # synthesis; Qdrant on the compose network (override models in .env).
      - EK_INDEX_EMBED_BASE_URL=${EK_INDEX_EMBED_BASE_URL:-https://openrouter.ai/api/v1}
      - EK_INDEX_EMBED_MODEL=${EK_INDEX_EMBED_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      - EK_SYNTHESIS_BASE_URL=${EK_SYNTHESIS_BASE_URL:-https://openrouter.ai/api/v1}
      - EK_SYNTHESIS_MODEL=${EK_SYNTHESIS_MODEL:-openai/gpt-4o-mini}
      - EK_EMBED_DIM=${EK_EMBED_DIM:-2048}
      - EK_QDRANT_URL=http://qdrant:6333
      # enterprise_knowledge knowledge graph — reuse the shared neo4j service.
      - EK_NEO4J_URI=${EK_NEO4J_URI:-bolt://neo4j:7687}
      - EK_NEO4J_USER=${EK_NEO4J_USER:-neo4j}
      - EK_NEO4J_PASSWORD=${EK_NEO4J_PASSWORD:-atria-neo4j}
      - EK_GRAPH_ENABLED=${EK_GRAPH_ENABLED:-0}
      - EK_GRAPH_EXTRACT=${EK_GRAPH_EXTRACT:-0}
      - EK_GRAPH_HOPS=${EK_GRAPH_HOPS:-1}
      - EK_GRAPH_MAX_NEIGHBORS=${EK_GRAPH_MAX_NEIGHBORS:-20}
      - EK_KG_EXTRACT_BASE_URL=${EK_KG_EXTRACT_BASE_URL:-https://openrouter.ai/api/v1}
      - EK_KG_EXTRACT_MODEL=${EK_KG_EXTRACT_MODEL:-openai/gpt-4o-mini}
      - EK_SEARCH_MODE=${EK_SEARCH_MODE:-hybrid}
      - EK_BM25_K1=${EK_BM25_K1:-1.5}
      - EK_BM25_B=${EK_BM25_B:-0.75}
      # Speech-to-text backend (voice input). Hard-coded to the internal `asr`
      # sidecar so it is correct regardless of the host-oriented value in .env.
      - ATRIA_ASR_BASE_URL=http://asr:9000/v1
      - AUTH_MODE=${AUTH_MODE:-keycloak}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-http://localhost:8082}
      - KEYCLOAK_REALM=atria
      - KEYCLOAK_BACKEND_CLIENT_ID=atria-backend
      - KEYCLOAK_BACKEND_CLIENT_SECRET=${KEYCLOAK_BACKEND_CLIENT_SECRET:-CHANGE-ME-IN-ENV}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - atria_data:/home/atria/.atria
      # Mount modules so new/edited modules appear without rebuilding the image
      - ./modules:/app/modules
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started

  # Redis — backs the TaskIQ broker, job state, blackboard, and message bus.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # CPU speech-to-text sidecar — nvidia/nemotron-3.5-asr-streaming-0.6b via HF
  # transformers, exposing an OpenAI-compatible /v1/audio/transcriptions. No GPU
  # needed (push-to-talk latency ~2-6s per short clip). Swap ATRIA_ASR_BASE_URL
  # to a managed/GPU endpoint to replace it with zero code change. Not gated by a
  # profile, so it starts with the normal `docker compose up`.
  asr:
    build: ./services/asr
    ports:
      - "9000:9000"
    volumes:
      - asr_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  maintenance-copilot:
    build:
      context: ./modules/maintenance_copilot
      dockerfile: backend/Dockerfile
    ports:
      - "9200:9200"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MC_INDEX_EMBED_BASE_URL=http://tei:80/v1
      - MC_CHUNK_EMBED_BASE_URL=http://tei:80/v1
      - MC_SYNTHESIS_BASE_URL=${MC_SYNTHESIS_BASE_URL:-http://copilot-llm:8000/v1}
      - MC_KG_EXTRACT_BASE_URL=${MC_KG_EXTRACT_BASE_URL:-http://copilot-llm:8000/v1}
      - MC_QDRANT_URL=http://qdrant:6333
      - MC_NEO4J_URI=bolt://neo4j:7687
      - MC_NEO4J_USER=neo4j
      - MC_NEO4J_PASSWORD=atria-neo4j
      - MC_PUBLIC_BASE=http://localhost:9200
      - MC_AUDIT_LOG=/app/data/audit.log.jsonl
    volumes:
      - mc_audit:/app/data
    depends_on:
      - qdrant
      - neo4j
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/connector/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # TaskIQ worker — consumes dispatched subagent tasks (the `solve` tool:
  # divide + parallel). Shares modules + ~/.atria with the web service so
  # dispatched work and the dashboard read/write the same data.
  atria-worker:
    build: .
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ATRIA_API_BASE_URL=${ATRIA_API_BASE_URL}
      - ATRIA_MODEL=${ATRIA_MODEL}
      # vetc_copilot (VETC Auto-Pilot) Brain — override in .env
      - VA_BRAIN_PROVIDER=${VA_BRAIN_PROVIDER:-openrouter}
      - VA_BRAIN_MODEL=${VA_BRAIN_MODEL:-openai/gpt-4o-mini}
      - VA_BRAIN_BASE_URL=${VA_BRAIN_BASE_URL:-https://openrouter.ai/api/v1}
      # vetc_copilot real VETC Mini App integration (credentials from .env)
      - VETC_ENV=${VETC_ENV:-uat}
      - VETC_CLIENT_ID=${VETC_CLIENT_ID:-}
      - VETC_CLIENT_SECRET=${VETC_CLIENT_SECRET:-}
      - VETC_TERMINAL_ID=${VETC_TERMINAL_ID:-com.vetc.charging}
      - VETC_MINI_APP_ID=${VETC_MINI_APP_ID:-}
      - VETC_BASE_URL=${VETC_BASE_URL:-http://vetc-sandbox:9099/partner-gateway/v1}
      - VETC_IPN_URL=${VETC_IPN_URL:-http://vetc-copilot:8770/ipn}
      - VETC_IPN_SECRET=${VETC_IPN_SECRET:-sandbox-hmac-secret}
      - DATABASE_URL=${DATABASE_URL:-postgresql://atria:atria@db:5432/atria}
      - MAP_DATABASE_URL=${MAP_DATABASE_URL_DOCKER:-postgresql://atria_map:atria_map@map-db:5432/atria_map}
      - ATRIA_MAP_BACKEND=${ATRIA_MAP_BACKEND:-db}
      - ATRIA_REDIS_URL=redis://redis:6379/0
      - ATRIA_DISABLED_MODULES=${ATRIA_DISABLED_MODULES:-}
      - MC_INDEX_EMBED_BASE_URL=http://tei:80/v1
      - MC_CHUNK_EMBED_BASE_URL=http://tei:80/v1
      - MC_SYNTHESIS_BASE_URL=${MC_SYNTHESIS_BASE_URL:-http://copilot-llm:8000/v1}
      - MC_KG_EXTRACT_BASE_URL=${MC_KG_EXTRACT_BASE_URL:-http://copilot-llm:8000/v1}
      - MC_QDRANT_URL=http://qdrant:6333
      - MC_NEO4J_URI=bolt://neo4j:7687
      - MC_NEO4J_USER=neo4j
      - MC_NEO4J_PASSWORD=atria-neo4j
      # enterprise_knowledge (EK) module — OpenRouter embeddings + gpt-4o-mini
      # synthesis; Qdrant on the compose network (override models in .env).
      - EK_INDEX_EMBED_BASE_URL=${EK_INDEX_EMBED_BASE_URL:-https://openrouter.ai/api/v1}
      - EK_INDEX_EMBED_MODEL=${EK_INDEX_EMBED_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      - EK_SYNTHESIS_BASE_URL=${EK_SYNTHESIS_BASE_URL:-https://openrouter.ai/api/v1}
      - EK_SYNTHESIS_MODEL=${EK_SYNTHESIS_MODEL:-openai/gpt-4o-mini}
      - EK_EMBED_DIM=${EK_EMBED_DIM:-2048}
      - EK_QDRANT_URL=http://qdrant:6333
      # enterprise_knowledge knowledge graph — reuse the shared neo4j service.
      - EK_NEO4J_URI=${EK_NEO4J_URI:-bolt://neo4j:7687}
      - EK_NEO4J_USER=${EK_NEO4J_USER:-neo4j}
      - EK_NEO4J_PASSWORD=${EK_NEO4J_PASSWORD:-atria-neo4j}
      - EK_GRAPH_ENABLED=${EK_GRAPH_ENABLED:-0}
      - EK_GRAPH_EXTRACT=${EK_GRAPH_EXTRACT:-0}
      - EK_GRAPH_HOPS=${EK_GRAPH_HOPS:-1}
      - EK_GRAPH_MAX_NEIGHBORS=${EK_GRAPH_MAX_NEIGHBORS:-20}
      - EK_KG_EXTRACT_BASE_URL=${EK_KG_EXTRACT_BASE_URL:-https://openrouter.ai/api/v1}
      - EK_KG_EXTRACT_MODEL=${EK_KG_EXTRACT_MODEL:-openai/gpt-4o-mini}
      - EK_SEARCH_MODE=${EK_SEARCH_MODE:-hybrid}
      - EK_BM25_K1=${EK_BM25_K1:-1.5}
      - EK_BM25_B=${EK_BM25_B:-0.75}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - atria_data:/home/atria/.atria
      - ./modules:/app/modules
    entrypoint:
      - /bin/sh
      - -c
      - >
        mkdir -p /home/atria/.atria &&
        : "$${ATRIA_MODEL:?ATRIA_MODEL must be set (add it to .env)}" &&
        : "$${ATRIA_API_BASE_URL:?ATRIA_API_BASE_URL must be set (add it to .env)}" &&
        printf '{"model":"%s","api_base_url":"%s"}\n'
          "$${ATRIA_MODEL}"
          "$${ATRIA_API_BASE_URL}"
          > /home/atria/.atria/settings.json &&
        exec taskiq worker atria.core.tasks.broker:broker atria.core.tasks.tasks
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started

  # Local, spec-faithful VETC partner-gateway simulator (VMA Auth + Payment).
  # Lets vetc_copilot's real vetc_client run end-to-end without VETC creds.
  vetc-sandbox:
    build: .
    entrypoint: []
    command: ["python", "modules/vetc_copilot/tools/vetc_sandbox.py"]
    environment:
      - SANDBOX_CLIENT_ID=${SANDBOX_CLIENT_ID:-sandbox-client}
      - SANDBOX_CLIENT_SECRET=${SANDBOX_CLIENT_SECRET:-sandbox-secret}
      - SANDBOX_HMAC_SECRET=${SANDBOX_HMAC_SECRET:-sandbox-hmac-secret}
      - SANDBOX_AUTOCOMPLETE_SECONDS=${SANDBOX_AUTOCOMPLETE_SECONDS:-2}
      - SANDBOX_PORT=9099
    expose:
      - "9099"
    volumes:
      - ./modules:/app/modules

  # vetc_copilot module `serve`, run persistently as the /ipn receiver so the
  # sandbox can push signed payment-completion callbacks back to the module.
  vetc-copilot:
    build: .
    entrypoint: []
    command: ["python", "modules/vetc_copilot/scripts/autopilot.py", "serve", "--port", "8770"]
    environment:
      - VETC_IPN_SECRET=${SANDBOX_HMAC_SECRET:-sandbox-hmac-secret}
      - VA_BRAIN_MODEL=${VA_BRAIN_MODEL:-openai/gpt-4o-mini}
      - VA_BRAIN_BASE_URL=${VA_BRAIN_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    expose:
      - "8770"
    volumes:
      - ./modules:/app/modules

  # Local, spec-faithful VETC partner-gateway simulator (VMA Auth + Payment).
  # Lets vetc_copilot's real vetc_client run end-to-end without VETC creds.
  vetc-sandbox:
    build: .
    entrypoint: []
    command: ["python", "modules/vetc_copilot/tools/vetc_sandbox.py"]
    environment:
      - SANDBOX_CLIENT_ID=${SANDBOX_CLIENT_ID:-sandbox-client}
      - SANDBOX_CLIENT_SECRET=${SANDBOX_CLIENT_SECRET:-sandbox-secret}
      - SANDBOX_HMAC_SECRET=${SANDBOX_HMAC_SECRET:-sandbox-hmac-secret}
      - SANDBOX_AUTOCOMPLETE_SECONDS=${SANDBOX_AUTOCOMPLETE_SECONDS:-2}
      - SANDBOX_PORT=9099
    expose:
      - "9099"
    volumes:
      - ./modules:/app/modules

  # vetc_copilot module `serve`, run persistently as the /ipn receiver so the
  # sandbox can push signed payment-completion callbacks back to the module.
  vetc-copilot:
    build: .
    entrypoint: []
    command: ["python", "modules/vetc_copilot/scripts/autopilot.py", "serve", "--port", "8770"]
    environment:
      - VETC_IPN_SECRET=${SANDBOX_HMAC_SECRET:-sandbox-hmac-secret}
      - VA_BRAIN_MODEL=${VA_BRAIN_MODEL:-openai/gpt-4o-mini}
      - VA_BRAIN_BASE_URL=${VA_BRAIN_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    expose:
      - "8770"
    volumes:
      - ./modules:/app/modules

  # Opt-in only (profile "embed-tei"). Embeddings default to an external
  # OpenAI-compatible endpoint via MC_*_EMBED_BASE_URL (e.g. LM Studio). Start
  # this local embedder explicitly with `--profile embed-tei` when wanted. Note
  # cpu-1.9 has no arm64 image, so on Apple Silicon it runs under emulation.
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "Qwen/Qwen3-Embedding-0.6B"]
    profiles: ["embed-tei"]
    ports:
      - "8083:80"
    volumes:
      - tei_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Shared knowledge-graph store for maintenance_copilot AND enterprise_knowledge.
  # Community edition = a single database, so the two modules co-tenant here.
  # enterprise_knowledge namespaces every node with an :EKNode label and scopes
  # all its reads/writes/reset to it. WARNING: maintenance_copilot's own graph
  # `reset` is an UNSCOPED `MATCH (n) DETACH DELETE n` — running it wipes the
  # enterprise_knowledge graph too. Rebuild EK afterwards (`knowledge.py graph
  # build`). Tracked follow-up: namespace maintenance_copilot's graph as well.
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/atria-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # GPU-dependent. On a no-GPU host, do NOT start this service; instead point
  # MC_SYNTHESIS_BASE_URL / MC_KG_EXTRACT_BASE_URL at an external endpoint.
  copilot-llm:
    image: vllm/vllm-openai:latest
    command: ["--model", "Qwen/Qwen2.5-1.5B-Instruct", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    profiles: ["gpu"]

volumes:
  atria_data:
  postgres_data:
  map_postgres_data:
  tei_data:
  qdrant_data:
  neo4j_data:
  hf_cache:
  asr_models:
  mc_audit:
