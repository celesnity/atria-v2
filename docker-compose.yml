services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=atria
      - POSTGRES_USER=atria
      - POSTGRES_PASSWORD=atria
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atria -d atria"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
      - ADMINER_DEFAULT_DB=atria
      - ADMINER_DEFAULT_USERNAME=atria
      - ADMINER_DEFAULT_PASSWORD=atria
      - ADMINER_DESIGN=pepa-linha
    depends_on:
      db:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/keycloak
      - KC_DB_USERNAME=atria
      - KC_DB_PASSWORD=atria
      # Full URL fixes the token issuer to http://localhost:8082/realms/atria for
      # ALL clients (browser AND in-compose backchannel), so it matches what Atria
      # validates (KEYCLOAK_PUBLIC_URL). Without a fixed hostname, a token fetched
      # via keycloak:8080 gets issuer localhost:8080 → issuer-mismatch 401.
      - KC_HOSTNAME=http://localhost:8082
      - KC_HTTP_ENABLED=true
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Substituted into realm-export.json's atria-module client secret at
      # --import-realm (Keycloak replaces ${VAR} via System.getenv by default).
      # Must match ATRIA_MODULE_CLIENT_SECRET on module-template-web/worker.
      - ATRIA_MODULE_CLIENT_SECRET=${ATRIA_MODULE_CLIENT_SECRET:-CHANGE-ME-IN-ENV}
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; printf 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  atria:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ATRIA_API_BASE_URL=${ATRIA_API_BASE_URL}
      - ATRIA_MODEL=${ATRIA_MODEL}
      - DATABASE_URL=${DATABASE_URL:-postgresql://atria:atria@db:5432/atria}
      - ATRIA_REDIS_URL=redis://redis:6379/0
      - ATRIA_DISABLED_MODULES=${ATRIA_DISABLED_MODULES:-}
      # Speech-to-text backend (voice input). Hard-coded to the internal `asr`
      # sidecar so it is correct regardless of the host-oriented value in .env.
      - ATRIA_ASR_BASE_URL=http://asr:9000/v1
      - AUTH_MODE=${AUTH_MODE:-keycloak}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-http://localhost:8082}
      - KEYCLOAK_REALM=atria
      - KEYCLOAK_BACKEND_CLIENT_ID=atria-backend
      - KEYCLOAK_BACKEND_CLIENT_SECRET=${KEYCLOAK_BACKEND_CLIENT_SECRET:-CHANGE-ME-IN-ENV}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - atria_data:/home/atria/.atria
      # Mount modules so new/edited modules appear without rebuilding the image
      - ./modules:/app/modules
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Redis — backs the TaskIQ broker, job state, blackboard, and message bus.
  # Loopback-published so a HOST-run backend (uvicorn on the host, not in-compose)
  # can reach it at localhost:6379. In-compose services use redis:6379.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # CPU speech-to-text sidecar — nvidia/nemotron-3.5-asr-streaming-0.6b via HF
  # transformers, exposing an OpenAI-compatible /v1/audio/transcriptions. No GPU
  # needed (push-to-talk latency ~2-6s per short clip). Swap ATRIA_ASR_BASE_URL
  # to a managed/GPU endpoint to replace it with zero code change. Not gated by a
  # profile, so it starts with the normal `docker compose up`.
  asr:
    build: ./services/asr
    ports:
      - "9000:9000"
    volumes:
      - asr_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # TaskIQ worker — consumes dispatched subagent tasks (the `solve` tool:
  # divide + parallel). Shares modules + ~/.atria with the web service so
  # dispatched work and the dashboard read/write the same data.
  atria-worker:
    build: .
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ATRIA_API_BASE_URL=${ATRIA_API_BASE_URL}
      - ATRIA_MODEL=${ATRIA_MODEL}
      - DATABASE_URL=${DATABASE_URL:-postgresql://atria:atria@db:5432/atria}
      - ATRIA_REDIS_URL=redis://redis:6379/0
      - ATRIA_DISABLED_MODULES=${ATRIA_DISABLED_MODULES:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - atria_data:/home/atria/.atria
      - ./modules:/app/modules
    entrypoint:
      - /bin/sh
      - -c
      - >
        mkdir -p /home/atria/.atria &&
        : "$${ATRIA_MODEL:?ATRIA_MODEL must be set (add it to .env)}" &&
        : "$${ATRIA_API_BASE_URL:?ATRIA_API_BASE_URL must be set (add it to .env)}" &&
        printf '{"model":"%s","api_base_url":"%s"}\n'
          "$${ATRIA_MODEL}"
          "$${ATRIA_API_BASE_URL}"
          > /home/atria/.atria/settings.json &&
        exec taskiq worker atria.core.tasks.broker:broker atria.core.tasks.tasks
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- module_template (full-stack SDK reference) -------------------------
  # MinIO — S3-compatible media store for module_template (own bucket).
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${MT_S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MT_S3_SECRET_KEY:-minioadmin}
    ports:
      # Host 9002 → container 9000 (S3 API); asr already uses host 9000. In-compose
      # services still reach MinIO at minio:9000. Console on 9001.
      - "9002:9000"
      - "9001:9001"
    volumes:
      - module_template_media:/data
    restart: unless-stopped

  # module_template connector (web). Reuses the shared `db` (own mt_* tables +
  # read-only Atria reads), `redis` (DB index /2), and `minio`. Announces to
  # Atria on :8080 and reverse-pushes via the atria-module Keycloak client.
  module-template-web:
    build:
      context: .
      dockerfile: modules/module_template/backend/Dockerfile
    ports:
      - "9300:9300"
    environment:
      - ATRIA_URL=http://atria:8080
      - ATRIA_MODULE_CONNECTOR_URL=http://module-template-web:9300
      - ATRIA_MODULE_REMOTE_ENTRY=http://localhost:9300/dashboard/remoteEntry.js
      - MT_PUBLIC_BASE=http://localhost:9300
      - MT_DATABASE_URL=postgresql://atria:atria@db:5432/atria
      - MT_REDIS_URL=redis://redis:6379/2
      - MT_S3_ENDPOINT=http://minio:9000
      - MT_S3_BUCKET=module-template
      - MT_S3_ACCESS_KEY=${MT_S3_ACCESS_KEY:-minioadmin}
      - MT_S3_SECRET_KEY=${MT_S3_SECRET_KEY:-minioadmin}
      - KEYCLOAK_TOKEN_URL=http://keycloak:8080/realms/atria/protocol/openid-connect/token
      - ATRIA_MODULE_CLIENT_ID=atria-module
      - ATRIA_MODULE_CLIENT_SECRET=${ATRIA_MODULE_CLIENT_SECRET:-CHANGE-ME-IN-ENV}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9300/connector/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # module_template Celery worker — runs background jobs; reverse-pushes live
  # progress blocks + artifacts. Same DB/Redis/S3 + announce creds as the web.
  module-template-worker:
    build:
      context: .
      dockerfile: modules/module_template/worker/Dockerfile
    environment:
      - MT_DATABASE_URL=postgresql://atria:atria@db:5432/atria
      - MT_REDIS_URL=redis://redis:6379/2
      - MT_S3_ENDPOINT=http://minio:9000
      - MT_S3_BUCKET=module-template
      - MT_S3_ACCESS_KEY=${MT_S3_ACCESS_KEY:-minioadmin}
      - MT_S3_SECRET_KEY=${MT_S3_SECRET_KEY:-minioadmin}
      - ATRIA_URL=http://atria:8080
      - ATRIA_MODULE_CONNECTOR_URL=http://module-template-web:9300
      - ATRIA_MODULE_REMOTE_ENTRY=http://localhost:9300/dashboard/remoteEntry.js
      - KEYCLOAK_TOKEN_URL=http://keycloak:8080/realms/atria/protocol/openid-connect/token
      - ATRIA_MODULE_CLIENT_ID=atria-module
      - ATRIA_MODULE_CLIENT_SECRET=${ATRIA_MODULE_CLIENT_SECRET:-CHANGE-ME-IN-ENV}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  atria_data:
  postgres_data:
  asr_models:
  module_template_media:
