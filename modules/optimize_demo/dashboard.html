<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Optimize · Decision Engine</title>
<!-- Optimize Console — a self-contained manufacturing decision-engine demo.
     Ported from the "Optimize Console" Claude Design (modernist system). Runs
     standalone (all decision math is client-side) and inside Atria via the
     AtriaDash bridge, which persists decision history + audit events by calling
     scripts/optimize.py. The bridge is OPTIONAL: with it absent the demo still
     runs fully from in-memory state. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap');

  :root {
    --color-bg:#f3f2f2; --color-surface:#eae9e9; --color-text:#201e1d;
    --color-accent:#ec3013; --color-accent-2:#e15b47;
    --color-divider: color-mix(in srgb, #201e1d 40%, transparent);
    --color-neutral-100:#f8f4f4; --color-neutral-200:#eae7e7; --color-neutral-300:#d7d3d3;
    --color-neutral-400:#bab6b6; --color-neutral-500:#9b9797; --color-neutral-600:#7d7979;
    --color-neutral-700:#605d5d; --color-neutral-800:#444141; --color-neutral-900:#2d2b2b;
    --color-accent-100:#fff2ef; --color-accent-200:#ffe0d9; --color-accent-300:#ffc4b8;
    --color-accent-400:#ff9783; --color-accent-500:#ff563c; --color-accent-600:#dd2b0f;
    --color-accent-700:#ae1800; --color-accent-800:#7c1405; --color-accent-900:#4d170e;
    --font-heading:"Archivo", system-ui, sans-serif; --font-body:"Archivo", system-ui, sans-serif;
    --font-heading-weight:800;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
    --radius-sm:0px; --radius-md:0px; --radius-lg:0px;
    --shadow-sm:0 1px 2px color-mix(in srgb,#2d2b2b 14%,transparent);
    --shadow-md:0 3px 10px color-mix(in srgb,#2d2b2b 16%,transparent);
    --shadow-lg:0 12px 32px color-mix(in srgb,#2d2b2b 22%,transparent);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin:0; }
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body);
    font-size:15px; line-height:1.55; font-weight:400; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4,h5,h6 { font-family: var(--font-heading); font-weight: var(--font-heading-weight);
    line-height:1.12; letter-spacing:-0.015em; margin:0; }
  p { margin:0 0 var(--space-3); }
  a { color: var(--color-accent); text-underline-offset:3px; }
  :focus { outline:none; }
  :focus-visible { outline:2px solid var(--color-accent); outline-offset:2px; }
  ::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

  /* buttons */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;
    text-decoration:none; font-family:var(--font-heading); font-weight:var(--font-heading-weight);
    font-size:13px; line-height:1.2; color:var(--color-text); background:transparent;
    border:1px solid transparent; padding:calc(var(--space-2)*0.85) var(--space-3); border-radius:var(--radius-md); }
  .btn svg { display:block; }
  .btn:disabled { opacity:0.45; cursor:not-allowed; }
  .btn-primary { background:var(--color-accent); color:var(--color-bg); }
  .btn-primary:hover:not(:disabled) { background:var(--color-accent-600); }
  .btn-primary:active:not(:disabled) { background:var(--color-accent-700); }
  .btn-secondary { border-color:var(--color-divider); }
  .btn-secondary:hover:not(:disabled) { background:color-mix(in srgb,var(--color-text) 7%,transparent); }
  .btn-ghost { color:var(--color-accent); padding-inline:var(--space-1); }
  .btn-ghost:hover:not(:disabled) { background:color-mix(in srgb,var(--color-accent) 10%,transparent); }
  .btn-icon { width:34px; height:34px; padding:0; }

  /* inputs */
  .input { width:100%; min-height:36px; padding:6px 10px; font:inherit; font-size:14px;
    color:var(--color-text); caret-color:var(--color-accent); background:var(--color-surface);
    border:1px solid var(--color-divider); border-radius:var(--radius-md); }
  .input:focus-visible { border-color:var(--color-accent); outline-offset:0; }

  /* tags */
  .tag { display:inline-flex; align-items:center; font-size:11px; letter-spacing:0.02em;
    padding:3px 10px; border-radius:0; }
  .tag-accent { background:var(--color-accent-100); color:var(--color-accent-800); }
  .tag-neutral { background:var(--color-neutral-100); color:var(--color-neutral-800); }
  .tag-outline { border:1px solid var(--color-accent); color:var(--color-accent); }

  /* tables */
  .table { width:100%; border-collapse:collapse; font-size:14px; }
  .table th { text-align:left; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:color-mix(in srgb,var(--color-text) 60%,transparent); padding:var(--space-2);
    border-bottom:2px solid var(--color-divider); }
  .table td { padding:var(--space-2); border-bottom:1px solid var(--color-divider); }
  .table tbody tr:hover { background:color-mix(in srgb,var(--color-text) 4%,transparent); }

  /* design helpers */
  .oc-tab { font:700 12px/1 var(--font-heading); letter-spacing:.02em; padding:8px 12px; cursor:pointer;
    color:color-mix(in srgb,var(--color-text) 55%,transparent); border:0; background:transparent; }
  .oc-tab:hover { color:var(--color-text); }
  .oc-tab[data-on="1"] { color:var(--color-bg); background:var(--color-text); }
  [data-danger="1"] { background:var(--color-accent); color:var(--color-bg); }
  [data-danger="0"] { border:1px solid var(--color-divider); color:var(--color-text); }
  .p-hd { display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:12px 16px; border-bottom:2px solid var(--color-divider); }
  .p-hd h4 { margin:0; font:800 13px/1 var(--font-heading); letter-spacing:.045em; text-transform:uppercase; }
  .p-hd .meta, .meta { font:600 10px/1 var(--font-body); letter-spacing:.09em; text-transform:uppercase;
    color:color-mix(in srgb,var(--color-text) 48%,transparent); }
  .lbl { font:700 10px/1 var(--font-body); letter-spacing:.1em; text-transform:uppercase;
    color:color-mix(in srgb,var(--color-text) 52%,transparent); }
  .num { font-family:var(--font-heading); font-weight:800; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .altrow { cursor:pointer; }
  pre { margin:0; font:12px/1.55 ui-monospace,"SF Mono",Menlo,monospace; white-space:pre; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:color-mix(in srgb,var(--color-text) 22%,transparent); }

  /* ── responsive layer (design mockup is fixed-width; this makes it fluid) ── */
  .oc-kpi { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    border-bottom:2px solid var(--color-divider); }
  .oc-2col { display:grid; grid-template-columns:var(--cols, 1.5fr 1fr); }
  .oc-ncol { display:grid; grid-template-columns:repeat(var(--n,3),1fr); }
  /* grid items default to min-width:auto (=min-content); that stops a wide
     table's track from shrinking so .oc-tablewrap's overflow-x never engages.
     min-width:0 lets tracks shrink and the table scroll inside its own box. */
  .oc-2col > *, .oc-ncol > * { min-width:0; }
  .oc-tablewrap { width:100%; overflow-x:auto; }
  .oc-nav { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
  .oc-nav::-webkit-scrollbar { display:none; }

  @media (max-width: 880px) {
    .oc-2col { grid-template-columns:1fr !important; }
    .oc-2col > * { border-right:0 !important; }
    .oc-2col > *:not(:last-child) { border-bottom:2px solid var(--color-divider) !important; }
    .oc-ncol { grid-template-columns:1fr 1fr !important; }
  }
  @media (max-width: 560px) {
    .oc-ncol { grid-template-columns:1fr !important; }
    .oc-ncol > * { border-right:0 !important; border-bottom:1px solid var(--color-divider) !important; }
    .oc-drawer { width:100vw !important; }
    .oc-headmeta { width:100%; margin-left:0 !important; }
  }
  @media (pointer: coarse) {
    .btn, .oc-tab { min-height:44px; }
    .btn-icon { width:44px; height:44px; }
  }
</style>
</head>

      + '<div><div class="p-hd"><h4>Alternatives considered</h4><span class="meta">ranked</span></div><div class="oc-tablewrap"><table class="table" style="font-size:13px"><tbody>' + comp + '</tbody></table></div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--color-divider)"><div style="padding:12px 16px;border-right:1px solid var(--color-divider)"><div class="lbl" style="font-size:9px">Lifecycle status</div><div style="margin-top:6px"><span class="tag ' + V.recStatusClass + '">' + V.recStatusText + '</span></div></div><div style="padding:12px 16px"><div class="lbl" style="font-size:9px">Valid until</div><div class="num" style="font-size:15px;margin-top:6px">' + V.validUntil + '</div></div></div>'
      + '<div style="display:flex;gap:14px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--color-divider);font:500 10px/1.4 var(--font-body);letter-spacing:.04em;text-transform:uppercase;color:' + mixT(45) + '"><span>forecast 0.1</span><span>impact 0.1</span><span>ruleset 0.1</span><span>optimizer 0.1</span></div></div></div>';
    var actions = '<div style="display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;border-top:2px solid var(--color-divider);align-items:center">'
      + '<button type="button" class="btn btn-primary" data-act="approve"' + (V.approveDisabled ? ' disabled' : '') + '>' + V.approveLabel + '</button>'
      + '<button type="button" class="btn btn-secondary" data-act="reject"' + (V.rejectDisabled ? ' disabled' : '') + '>Reject</button>'
      + '<button type="button" class="btn btn-secondary" data-act="recalc">Request recalculation</button>'
      + '<span style="flex:1"></span>'
      + '<button type="button" class="btn btn-secondary" data-act="dispatch"' + (V.dispatchDisabled ? ' disabled' : '') + '>' + V.dispatchLabel + '</button>'
      + '<button type="button" class="btn btn-ghost" data-act="open-json" data-tab="decision">View decision JSON</button></div>';
    return '<div style="padding:24px 26px 40px">' + loop + '<div style="border:2px solid var(--color-divider)">' + hero + grid + actions + '</div></div>';
  }
  function tHistory(V) {
    var rows = V.historyRows.map(function (h) { return '<tr style="' + h.rowStyle + '"><td style="font-weight:700;font-variant-numeric:tabular-nums">' + h.id + '</td><td style="font-variant-numeric:tabular-nums;color:' + mixT(60) + '">v' + h.ver + '</td><td>' + h.action + '</td><td><span class="tag ' + h.statusClass + '">' + h.statusText + '</span></td><td style="text-align:right;font-variant-numeric:tabular-nums;color:' + mixT(60) + '">' + h.time + '</td></tr>'; }).join('');
    return '<div style="padding:24px 26px 40px;max-width:1000px"><div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px"><h2 style="margin:0;font:800 26px/1.1 var(--font-heading);letter-spacing:-.02em">Decision history</h2><span class="meta">Versioned · auditable</span></div>'
      + '<p style="margin:8px 0 20px;font:400 13.5px/1.5 var(--font-body);max-width:66ch;color:' + mixT(72) + '">Every recommendation and lifecycle change is recorded. Statuses move Draft → Proposed → Approved → Dispatched → Executing → Completed, or Rejected / Superseded / Expired.</p>'
      + '<div style="border:2px solid var(--color-divider)"><div class="oc-tablewrap"><table class="table" style="font-size:13.5px"><thead><tr><th>Recommendation</th><th>Ver</th><th>Action</th><th>Status</th><th style="text-align:right">Time</th></tr></thead><tbody>' + rows + '</tbody></table></div></div></div>';
  }
  function tDrawer(V) {
    if (!V.jsonOpen) return '';
    return '<div class="oc-backdrop" style="position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:color-mix(in srgb,var(--color-neutral-900) 42%,transparent)">'
      + '<div class="oc-drawer" style="width:min(560px,94vw);height:100%;background:var(--color-bg);border-left:2px solid var(--color-text);display:flex;flex-direction:column">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:2px solid var(--color-divider)"><div><div class="lbl" style="color:var(--color-accent)">Decision API</div><div style="font:800 16px/1.1 var(--font-heading);margin-top:4px">' + V.recId + ' · v' + V.recVersion + '</div></div><button type="button" class="btn btn-secondary btn-icon" data-act="close-json" title="Close">✕</button></div>'
      + '<div style="display:flex;gap:2px;padding:8px 18px;border-bottom:2px solid var(--color-divider);flex-wrap:wrap">' + V.jsonTabs.map(function (t) { return '<button type="button" class="oc-tab" data-on="' + t.on + '" data-act="json-tab" data-tab="' + t.key + '">' + t.label + '</button>'; }).join('') + '</div>'
      + '<div style="flex:1;overflow:auto;padding:16px 18px;background:color-mix(in srgb,var(--color-text) 3%,transparent)"><pre>' + escapeHtml(V.jsonText) + '</pre></div></div></div>';
  }
  function tToast(V) {
    if (!V.toast) return '';
    return '<div style="position:fixed;left:22px;bottom:22px;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--color-text);color:var(--color-bg);box-shadow:var(--shadow-lg);max-width:440px"><span style="width:8px;height:8px;background:var(--color-accent);flex:none"></span><span style="font:600 13px/1.4 var(--font-body)">' + escapeHtml(V.toast) + '</span></div>';
  }
  function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function screen(V) {
    if (V.isOverview) return tOverview(V);
    if (V.isTimeline) return tTimeline(V);
    if (V.isLoss) return tLoss(V);
    if (V.isForecast) return tForecast(V);
    if (V.isAlternatives) return tAlternatives(V);
    if (V.isRecommendation) return tRecommendation(V);
    if (V.isHistory) return tHistory(V);
    return '';
  }

  // ── RENDER LOOP ──────────────────────────────────────────────────────────
  var app = document.getElementById('app');
  var _measuring = false;
  function render() {
    var V = renderVals();
    app.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text)">'
      + tHeader(V) + tControlBar(V) + '<main style="flex:1">' + screen(V) + '</main></div>' + tDrawer(V) + tToast(V);
    measureCharts();
  }
  function measureCharts() {
    if (_measuring) return;
    var changed = false;
    var nodes = app.querySelectorAll('[data-chartw]');
    for (var i = 0; i < nodes.length; i++) {
      var key = nodes[i].getAttribute('data-chartw');
      var w = Math.round(nodes[i].clientWidth);
      if (w > 0 && chartW[key] !== w) { chartW[key] = w; changed = true; }
    }
    if (changed) { _measuring = true; render(); _measuring = false; }
  }

  // ── EVENTS ───────────────────────────────────────────────────────────────
  function onClick(e) {
    var t = e.target;
    if (t.classList && t.classList.contains('oc-backdrop')) { setState({ jsonOpen: false }); return; }
    var el = t.closest ? t.closest('[data-act]') : null;
    if (!el) return;
    var a = el.getAttribute('data-act');
    if (a === 'view') setView(el.getAttribute('data-view'));
    else if (a === 'main') action().fn();
    else if (a === 'reset') reset();
    else if (a === 'recalc') recalc();
    else if (a === 'open-json') setState({ jsonOpen: true, jsonTab: el.getAttribute('data-tab') || 'decision' });
    else if (a === 'close-json') setState({ jsonOpen: false });
    else if (a === 'sel-alt') setState({ selectedAltId: el.getAttribute('data-id') });
    else if (a === 'approve') approve();
    else if (a === 'reject') reject();
    else if (a === 'dispatch') doDispatch();
    else if (a === 'json-tab') setState({ jsonTab: el.getAttribute('data-tab') });
  }
  function onChange(e) {
    var el = e.target.closest ? e.target.closest('[data-act="scenario"]') : null;
    if (el) loadScenario(el.value);
  }
  app.addEventListener('click', onClick);
  app.addEventListener('change', onChange);

  var _rz = null;
  window.addEventListener('resize', function () {
    clearTimeout(_rz);
    _rz = setTimeout(function () { for (var k in chartW) delete chartW[k]; render(); }, 120);
  });

  // ── BRIDGE INIT + MOUNT ──────────────────────────────────────────────────
  if (bridge) {
    try { bridge.ready(); } catch (e) {}
    if (bridge.onTheme) bridge.onTheme(function () {});
    if (bridge.resize) { try { bridge.resize(900); } catch (e) {} }
  }
  loadScenario(props.startScenario);
})();
</script>
</body>
</html>
