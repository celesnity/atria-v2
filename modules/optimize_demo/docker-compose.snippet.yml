# Add to docker-compose.yml (same network as `minder`). Then rebuild:
#   docker compose up -d --build optimize
#
# Backend-only this pass (the tile stays the vanilla blocks/guided.html served by Core). The connector
# self-registers to Core via the SDK's announce() using the MINDER_* env below; for local dev without
# containers, prefer `minder-module dev optimize_demo`.
  optimize:
    build:
      context: .
      dockerfile: modules/optimize_demo/backend/Dockerfile
    ports:
      - "9320:9320"
    environment:
      - OPTIMIZE_PUBLIC_BASE=http://localhost:9320
      - MINDER_URL=http://minder:8080
      - MINDER_MODULE_CONNECTOR_URL=http://optimize:9320
      - KEYCLOAK_TOKEN_URL=http://keycloak:8080/realms/minder/protocol/openid-connect/token
      - MINDER_MODULE_CLIENT_ID=minder-module
      - MINDER_MODULE_CLIENT_SECRET=${MINDER_MODULE_CLIENT_SECRET:-CHANGE-ME-IN-ENV}
      - MINDER_MODULE_EMIT_EVENTS=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MINDER_MODEL=${MINDER_MODEL:-gpt-5.4-mini}
      - IIOT_FLEET_URL=${IIOT_FLEET_URL:-http://host.docker.internal:5050}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9320/connector/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
