<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minder Optimize — Guided</title>
<!--
  Minder Optimize - Guided - a guided operational-decision experience.
  Ported from the "Minder Optimize - Guided" Claude Design (project
  73b8309d-b935-460e-816a-12b69de9435b, file "Minder Optimize - Guided.dc.html");
  the prototype + its brief are kept alongside in ../design/ and remain the source
  of truth for layout and copy.

  Faithful vanilla-JS port of the DCLogic component - same move as dashboard.html
  (Optimize Console V2). The DC runtime is deliberately NOT used: its support.js
  pulls React + ReactDOM + @babel/standalone from unpkg.com, which fails in the
  sandboxed iframe and offline (see report/PROOF-OF-DONE-optimize-console-v2.md).
  So sc-if/sc-for/{{ }} become plain conditionals + map(), and the React.createElement
  charts are redrawn through the same string-serializing hyperscript h() used by V2.

  This is NOT a dashboard. The recommended decision is the hero; monitoring is
  secondary. Progressive disclosure is the core rule:
    L1 default -> L2 "How did Minder reach this?" -> L3 evidence & audit drawer.

  DATA IS SIMULATED. Every value lives in the single SCENARIO object below, shaped
  like scripts/pipeline.py's standard_response() so that wiring it to the real
  6-stage pipeline (measure -> explain -> predict -> evaluate -> recommend ->
  replan) is a swap of that one seam. See design/GUIDED_DESIGN_BRIEF.md section 7
  for what real integration must replace. The Simulation banner stays until then.
  The prototype's "Prototype states" bar is demo scaffolding and is NOT shipped.

  Served at /api/modules/optimize_demo/blocks/guided.html inside a sandboxed
  iframe. Note ../__bridge.js - from blocks/ the bridge lives one level up. The
  bridge is OPTIONAL and used only to follow the host's light/dark theme.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,400..700&display=swap');

/* ---- Celesnity "Gradient — two skies" tokens (resolved from the design system's
     tokens/colors.css: :root = Cosmos/dark, [data-theme="light"] = Daybreak/light). One
     cobalt->violet->magenta accent spine shared across both. ---- */
:root{
  --bg-0:#05060F; --bg-1:#0B0A1E; --bg-2:#121030; --bg-3:#1A0E4D;
  --surf:rgba(255,255,255,.04); --surf-2:rgba(255,255,255,.07);
  --line:rgba(201,206,232,.12); --line-2:rgba(201,206,232,.20);
  --text:#F8F9FE; --text-dim:#C9CEE8; --text-mute:rgba(201,206,232,.62); --text-faint:rgba(201,206,232,.34);
  --accent:#2D44E0; --accent-hi:#9E7BEA; --accent-lo:#2436B8; --accent-2:#6E1FC6; --accent-3:#B14FD0;
  --danger:#F87171; --ok:#4ADE80; --warn:#FBBF24;
  --glow:rgba(45,68,224,.42); --glow-soft:rgba(45,68,224,.18); --grid-line:rgba(201,206,232,.08);
  --ease:cubic-bezier(.2,.7,.2,1);
}
:root[data-theme="light"]{
  --bg-0:#F8F9FE; --bg-1:#FFFFFF; --bg-2:#EEECF8; --bg-3:#E6E3F4;
  --surf:rgba(28,34,64,.03); --surf-2:rgba(28,34,64,.06);
  --line:rgba(28,34,64,.10); --line-2:rgba(28,34,64,.16);
  --text:#1C2240; --text-dim:rgba(28,34,64,.72); --text-mute:rgba(28,34,64,.52); --text-faint:rgba(28,34,64,.32);
  --accent:#2D44E0; --accent-hi:#8739E0; --accent-lo:#2436B8; --accent-2:#8739E0; --accent-3:#BC67D5;
  --danger:#DC2626; --ok:#16A34A; --warn:#D97706;
  --glow:rgba(45,68,224,.28); --glow-soft:rgba(45,68,224,.15); --grid-line:rgba(28,34,64,.06);
}
/* Fonts are language-conditional: English adopts the new single-typeface Inter; Vietnamese keeps
   Be Vietnam Pro / Newsreader / JetBrains Mono (proper diacritics + the serif hinge word).
   Driven by data-lang on <html>, mirroring data-theme. */
:root, :root[data-lang="vi"]{
  --serif:"Newsreader","Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro","Inter","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"Cascadia Code",Menlo,Consolas,monospace;
}
:root[data-lang="en"]{
  --sans:"Inter",system-ui,"Segoe UI",sans-serif;
  --serif:"Inter",system-ui,sans-serif;
  --mono:"Inter",ui-monospace,SFMono-Regular,monospace;
}

/* ---- Scoped styles (verbatim from the design's helmet <style>) ---- */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg-0);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.55}
a{color:var(--accent-hi);text-decoration:none;cursor:pointer}
a:hover{color:var(--accent)}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:14px 28px;background:color-mix(in srgb,var(--text) 4%,var(--bg-0));border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;font:600 15px var(--mono);letter-spacing:.11em;color:var(--text)}
.sq{width:15px;height:15px;background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo));border-radius:4px;box-shadow:0 0 12px var(--glow-soft)}
.nav{display:flex;gap:4px;margin-left:14px}
.nav-t{background:none;border:none;border-radius:9px;color:var(--text-mute);font:500 14px var(--sans);padding:8px 15px;cursor:pointer;transition:all .16s var(--ease)}
.nav-t:hover{color:var(--text-dim);background:var(--surf)}
.nav-t[data-on="1"]{color:var(--text);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px;position:relative}
.who{font:500 13px var(--sans);color:var(--text-dim)}
.clock{font:500 13px var(--mono);color:var(--text-mute);min-width:64px;text-align:right}
/* Chrome the prototype does not have: Demo/Live + a settings popover. Kept deliberately quiet so
   the topbar still reads as the design's sparse bar (brief: minimal chrome, few nested borders). */
.mseg-w{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surf)}
.mseg{appearance:none;border:0;background:transparent;cursor:pointer;padding:5px 11px;font:600 11px var(--sans);letter-spacing:.02em;color:var(--text-mute);transition:background .15s,color .15s}
.mseg:hover{color:var(--text-dim)}
.mseg[data-on="1"]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text)}
.gear{appearance:none;border:0;background:transparent;cursor:pointer;color:var(--text-mute);padding:4px;border-radius:7px;display:inline-flex;align-items:center;transition:color .15s,background .15s}
.gear:hover{color:var(--text);background:var(--surf)}
.pop{position:absolute;top:calc(100% + 10px);right:0;z-index:40;min-width:170px;display:flex;flex-direction:column;gap:7px;padding:12px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.pop-s{font:600 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}
.pop-s:not(:first-child){margin-top:5px}
.scroll{flex:1;overflow-y:auto}
.stage{max-width:760px;margin:0 auto;padding:26px 24px 80px;display:flex;flex-direction:column;gap:22px}
.wide{max-width:960px}
.simline{display:flex;align-items:center;gap:9px;font:500 12px var(--sans);color:var(--text-mute);padding:9px 14px;background:color-mix(in srgb,var(--warn) 8%,transparent);border:1px solid color-mix(in srgb,var(--warn) 26%,transparent);border-radius:10px}
.sim-dot{width:7px;height:7px;border-radius:999px;background:var(--warn);flex:none}
/* Honesty affordances: quiet notes that say what a number is (or is not). Deliberately low-weight
   so they inform without competing with the decision (brief: one primary action per screen). */
.chart-note{margin-top:8px;font:400 11px var(--sans);color:var(--text-faint)}
.sb-note{margin-top:10px;font:400 12px/1.5 var(--sans);color:var(--text-mute)}
.warn-note{color:var(--warn)}
.empty-note{padding:22px;text-align:center;font:400 14px var(--sans);color:var(--text-mute);border:1px dashed var(--line);border-radius:12px}
/* loading / unreachable-simulator states */
.state-box{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:26px;border:1px solid var(--line);border-radius:14px;background:var(--surf)}
.state-box h3{margin:0;font:500 17px var(--sans);color:var(--text)}
.state-box p{margin:0;font:400 14px/1.55 var(--sans);color:var(--text-mute);max-width:52ch}
.state-actions{display:flex;gap:8px;margin-top:4px}
.spin{width:14px;height:14px;border-radius:999px;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-row{display:flex;align-items:center;gap:10px;font:400 14px var(--sans);color:var(--text-mute);padding:26px}
.mono-err{font:400 11px var(--mono);color:var(--text-faint);word-break:break-word}
/* real constraint results (live) + drawer notes */
.cons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cons li{display:flex;justify-content:space-between;gap:12px;font:400 13px var(--sans);padding:7px 10px;border-radius:8px;background:var(--surf)}
.cons li.ok{color:var(--text-dim)}
.cons li.ok span:last-child{color:var(--ok);font-weight:600}
.cons li.bad{color:var(--text)}
.cons li.bad span:last-child{color:var(--danger);font-weight:600}
.dr-note{font:400 12px/1.55 var(--sans);color:var(--text-mute);padding:10px 12px;border:1px dashed var(--line);border-radius:9px;margin-bottom:12px}
/* today */
.greet{display:flex;flex-direction:column;gap:8px}
.greet h1{margin:0;font:500 30px/1.2 var(--sans);letter-spacing:-.03em;color:var(--text)}
.greet h1 em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent-hi)}
.greet p{margin:0;font:400 17px/1.5 var(--sans);color:var(--text-dim)}
.attn{display:flex;flex-wrap:wrap;gap:28px;padding:6px 2px}
.attn-i{display:flex;flex-direction:column;gap:3px}
.attn-v{font:500 26px var(--sans);letter-spacing:-.03em;color:var(--text);line-height:1}
.attn-v.warn{color:var(--warn)}.attn-v.ok{color:var(--ok)}
.attn-l{font:400 13px var(--sans);color:var(--text-mute)}
.case-card{display:flex;flex-direction:column;gap:14px;padding:26px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 8%,var(--bg-1)),var(--bg-1) 62%);border:1px solid var(--line-2);border-radius:20px}
.case-card h2{margin:0;font:500 22px/1.25 var(--sans);letter-spacing:-.02em;color:var(--text)}
.case-card p{margin:0;font:400 16px/1.55 var(--sans);color:var(--text-dim)}
.case-meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font:500 14px var(--sans);color:var(--text-dim)}
.chipmeta{display:inline-flex;align-items:center;gap:7px}
.mdot{width:5px;height:5px;border-radius:999px;background:var(--text-faint)}
/* recommendation deck (Today) -- verbatim from the design */
.recodeck{display:flex;flex-direction:column;gap:14px}
.cc-inner{display:flex;flex-direction:column;gap:14px}
.mainflag{align-self:flex-start;display:inline-flex;align-items:center;font:600 10.5px var(--sans);letter-spacing:.02em;color:var(--accent-hi);background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);border-radius:999px;padding:3px 11px}
.upnext{display:flex;flex-direction:column;gap:8px}
.upnext-h{display:flex;align-items:center;gap:9px;font:500 12.5px var(--sans);color:var(--text-mute);letter-spacing:.02em;padding-left:2px;margin-top:4px}
.upnext-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--surf-2);border:1px solid var(--line);color:var(--text-dim);font:600 11px var(--sans)}
.mini{display:flex;align-items:center;gap:13px;text-align:left;width:100%;background:var(--bg-1);border:1px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;transition:opacity .45s var(--ease),transform .45s var(--ease),border-color .18s var(--ease),background .18s var(--ease)}
.mini:hover{border-color:var(--line-2);background:var(--surf-2)}
.mini-num{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--surf-2);border:1px solid var(--line);color:var(--text-mute);font:600 12px var(--sans)}
.mini-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.mini-t{font:500 15px var(--sans);color:var(--text)}
.mini-m{font:400 13px var(--sans);color:var(--text-mute)}
/* live deck animation: a newly-arrived recommendation slides up in; a resolved one fades out. The
   .mini transition (above) already carries the hooks. Motion is gated on prefers-reduced-motion so
   it degrades to an instant swap. */
@keyframes slideup{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion: no-preference){
  .mini.enter,.case-card.enter{animation:slideup .42s var(--ease) both}
  .mini.leaving{opacity:0;transform:translateY(-6px);transition:opacity .3s var(--ease),transform .3s var(--ease);pointer-events:none}
}
/* buttons */
.btn-primary{align-self:flex-start;background:linear-gradient(180deg,var(--accent-hi),var(--accent));border:1px solid var(--accent-lo);border-radius:12px;color:#fff;font:500 15px var(--sans);padding:13px 24px;cursor:pointer;box-shadow:0 8px 22px -10px var(--glow);transition:all .2s var(--ease)}
.btn-primary:hover{box-shadow:0 10px 26px -10px var(--glow),inset 0 1px rgba(255,255,255,.4)}
.btn-soft{background:var(--surf-2);border:1px solid var(--line-2);border-radius:11px;color:var(--text);font:500 14px var(--sans);padding:11px 18px;cursor:pointer;transition:all .18s var(--ease)}
.btn-soft:hover{border-color:var(--accent);color:var(--accent-hi)}
.btn-quiet{background:none;border:none;color:var(--text-mute);font:500 14px var(--sans);padding:8px 4px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn-quiet:hover{color:var(--text-dim)}
.linkq{display:inline-flex;align-items:center;gap:8px;font:500 14px var(--sans);color:var(--accent-hi);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);border-radius:11px;cursor:pointer;padding:11px 16px;align-self:flex-start;transition:all .18s var(--ease)}
.linkq:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent)}
/* decision */
.eyebrow{font:500 13px var(--sans);color:var(--text-mute)}
.situation{font:500 24px/1.3 var(--sans);letter-spacing:-.02em;color:var(--text);margin:0}
.metrics3{display:flex;flex-wrap:wrap;gap:30px}
.m3{display:flex;flex-direction:column;gap:3px}
.m3-v{font:500 27px var(--sans);letter-spacing:-.03em;line-height:1;color:var(--text)}
.m3-v.warn{color:var(--warn)}.m3-v.danger{color:var(--danger)}.m3-v.ok{color:var(--ok)}.m3-v.accent{color:var(--accent-hi)}
.m3-l{font:400 13px var(--sans);color:var(--text-mute)}
.chartwrap{background:var(--bg-1);border:1px solid var(--line);border-radius:16px;padding:18px 18px 12px}
.chart-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.chart-t{font:500 14px var(--sans);color:var(--text-dim)}
.chart-leg{display:flex;gap:14px;font:400 12px var(--sans);color:var(--text-mute)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg-s{width:15px;height:3px;border-radius:2px}
.lg-s.dash{background:repeating-linear-gradient(90deg,var(--text-mute) 0 4px,transparent 4px 7px)}
.reco{display:flex;flex-direction:column;gap:14px;padding:24px;background:var(--bg-1);border:1px solid var(--line-2);border-radius:18px}
.reco-lab{font:500 13px var(--sans);color:var(--accent-hi);display:flex;align-items:center;gap:8px}
.reco h2{margin:0;font:500 26px/1.2 var(--sans);letter-spacing:-.03em;color:var(--text)}
.reco h2 em{font-family:var(--serif);font-style:italic;font-weight:400;background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.reco p{margin:0;font:400 16px/1.55 var(--sans);color:var(--text-dim)}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:2px}
/* how (level 2) */
.how{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);margin-top:2px}
.how-h{font:500 16px var(--sans);color:var(--text);padding:16px 0 6px}
.qa{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.qa:first-of-type{border-top:none}
.qa-q{font:500 15px var(--sans);color:var(--text);display:flex;align-items:center;gap:9px}
.qa-n{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-hi);font:600 11px var(--mono)}
.qa-a{font:400 15px/1.6 var(--sans);color:var(--text-dim);padding-left:31px}
.qa-tag{display:inline-block;font:500 11px var(--sans);color:var(--text-mute);background:var(--surf);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.opts{padding-left:31px;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.opt{display:flex;align-items:center;gap:10px;font:400 14px var(--sans);color:var(--text-dim);padding:8px 12px;background:var(--surf);border-radius:10px}
.opt b{color:var(--text);font-weight:500}
.opt .rec{margin-left:auto;font:500 13px var(--mono);color:var(--accent-hi)}
.opt[data-blocked="1"] .rec{color:var(--danger)}
.opt-tag{font:500 11px var(--mono);color:var(--text-mute)}
.opt[data-blocked="1"] .opt-tag{color:var(--danger)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(2,2,6,.55);backdrop-filter:blur(2px);z-index:50}
.drawer{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:94vw;background:var(--bg-1);border-left:1px solid var(--line-2);z-index:51;display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.7);animation:slide .28s var(--ease)}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:translateX(0);opacity:1}}
.dr-h{display:flex;align-items:center;gap:10px;padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.dr-h h3{margin:0;font:500 17px var(--sans);color:var(--text)}
.dr-close{margin-left:auto;background:var(--surf);border:1px solid var(--line);border-radius:8px;color:var(--text-mute);width:30px;height:30px;cursor:pointer;font-size:15px}
.dr-close:hover{color:var(--text);border-color:var(--line-2)}
.dr-body{flex:1;overflow-y:auto;padding:20px 22px}
.dr-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.dr-sec{padding:14px 0;border-top:1px solid var(--line)}
.dr-sec:first-child{border-top:none;padding-top:0}
.dr-sec-l{font:500 12px var(--sans);color:var(--text-mute);margin-bottom:5px}
.dr-sec-v{font:400 15px/1.5 var(--sans);color:var(--text)}
.dr-sec-v b{font-weight:500}
.dr-sec-v.ok{color:var(--ok)}
.sec-actions{display:flex;flex-wrap:wrap;gap:8px}
.mini-a{background:none;border:1px solid var(--line);border-radius:9px;color:var(--text-mute);font:500 13px var(--sans);padding:8px 13px;cursor:pointer}
.mini-a:hover{color:var(--text-dim);border-color:var(--line-2)}
.mini-a.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.mini-a.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
.foot-note{font:400 12px var(--sans);color:var(--text-faint);text-align:center}
/* evidence (level 3) */
.ev-item{padding:13px 0;border-top:1px solid var(--line)}
.ev-item:first-child{border-top:none}
.ev-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ev-name{font:500 14px var(--sans);color:var(--text)}
.ev-val{font:500 14px var(--mono);color:var(--text)}
.ev-src{font:400 12px var(--sans);color:var(--text-mute);margin-top:3px}
.ev-src .ev-id{font-family:var(--mono);color:var(--text-faint)}
.ev-conflict{font:400 12px var(--sans);color:var(--danger);margin-top:4px}
.disc{margin-top:16px}
.disc summary{font:500 13px var(--sans);color:var(--text-mute);cursor:pointer;padding:8px 0;list-style:none}
.disc summary::-webkit-details-marker{display:none}
.disc summary:hover{color:var(--text-dim)}
.disc[open] summary{color:var(--text)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:6px 0;font-size:13px}
.kv-k{font:500 11px var(--sans);color:var(--text-mute)}
.kv-v{font:400 12px var(--mono);color:var(--text-dim);word-break:break-word}
.jsonbox{margin:8px 0 0;font:500 11px/1.5 var(--mono);color:var(--accent-hi);background:var(--bg-0);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:280px;white-space:pre}
/* execution + validation */
.statusblock{display:flex;flex-direction:column;gap:16px;padding:26px;background:var(--bg-1);border:1px solid var(--line-2);border-radius:18px}
.sb-head{display:flex;align-items:center;gap:12px}
.sb-ic{width:38px;height:38px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px}
.sb-ic.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.sb-ic.run{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-hi)}
.sb-ic.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.sb-title{font:500 20px var(--sans);letter-spacing:-.02em;color:var(--text)}
.sb-lines{display:flex;flex-direction:column;gap:9px}
.sb-line{font:400 15px/1.5 var(--sans);color:var(--text-dim)}
.sb-line b{color:var(--text);font-weight:500}
.val-compare{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.vc-row{display:grid;grid-template-columns:96px 1fr 56px;gap:12px;align-items:center}
.vc-l{font:400 14px var(--sans);color:var(--text-dim)}
.vc-track{height:12px;background:var(--surf-2);border-radius:4px;overflow:hidden}
.vc-fill{height:100%;border-radius:4px}
.vc-n{font:500 14px var(--mono);text-align:right;color:var(--text)}
.verdict{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font:500 14px var(--sans);color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 32%,transparent);border-radius:999px;padding:7px 15px}
/* performance / history */
.section-lead{font:400 16px/1.55 var(--sans);color:var(--text-dim);margin:0;max-width:60ch}
.perf-kpis{display:flex;flex-wrap:wrap;gap:30px}
.hist{display:flex;flex-direction:column}
.hist-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-bottom:none;width:100%;text-align:left;font:inherit;transition:opacity .15s var(--ease)}
.hist-row:first-child{border-top:none}
.hist-row:hover{opacity:.72}
.hist-t{font:500 15px var(--sans);color:var(--text)}
.hist-s{font:400 13px var(--sans);color:var(--text-mute);margin-top:3px}
.hist-st{font:500 13px var(--sans)}
.subnav{display:flex;gap:6px;flex-wrap:wrap}
.subnav-b{background:none;border:1px solid var(--line);border-radius:999px;color:var(--text-mute);font:500 13px var(--sans);padding:6px 14px;cursor:pointer}
.subnav-b[data-on="1"]{background:var(--surf-2);border-color:var(--line-2);color:var(--text)}
.imp-list{display:flex;flex-direction:column;gap:10px}
.imp-c{padding:16px 18px;background:var(--surf);border:1px solid var(--line);border-radius:12px}
.imp-c h4{margin:0 0 5px;font:500 15px var(--sans);color:var(--text)}
.imp-c p{margin:0;font:400 13.5px/1.5 var(--sans);color:var(--text-mute)}
.dot{display:inline-block;width:7px;height:7px;border-radius:999px}
.livedot{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(max-width:640px){.nav-t{padding:8px 11px;font-size:13px}.greet h1{font-size:25px}.stage{padding:20px 16px 60px}}
/* Topbar condensing. NOT in the prototype's CSS: its .topbar is a single non-wrapping
   flex row (brand + 4 nav + who + clock), which needs ~658px and overflows a 360px
   viewport. The brief (section 8) requires "responsive down to ~360px (nav condenses,
   single column)", so this honours the brief where the prototype's CSS falls short.
   Scoped to <=640px only - desktop layout is untouched. */
@media(max-width:640px){
  .topbar{flex-wrap:wrap;gap:10px 12px;padding:12px 16px}
  .nav{order:3;width:100%;margin-left:0;flex-wrap:wrap}
  .top-r{margin-left:auto;gap:10px}
  .clock{min-width:auto}
}

  var _shownSeeded = false;
  function seedShown(items) {

  function reconcileDeck() {
    var root = document.getElementById('deck-root');
    if (!root) { render(); return; }               // deck not mounted -> full render
    var items = deckItems();

    // Head (greeting + attn + counts): tiny, replace in place -- topbar/scroll untouched.
    var head = document.getElementById('deck-head');
    if (head) head.innerHTML = deckHeadHtml(items);

    // Empty queue -> ensure the all-clear card is shown (fall back to a full deck render of Today).
    if (!items.length) {
      var rd = root.querySelector('.recodeck');
      if (rd) { render(); }  // structure differs (all-clear card) -> simplest correct path
      return;
    }
    // If we were empty and now have items, the recodeck container may be missing -> full render.
    if (!root.querySelector('.recodeck')) { render(); return; }

    var newIds = {};
    items.forEach(function (it) { newIds[itemId(it)] = true; });

    // Hero: swap only if the top recommendation changed (else leave it undisturbed).
    var heroItem = items[0], heroId = itemId(heroItem);
    var heroSlot = document.getElementById('hero-slot');
    var curHero = heroSlot && heroSlot.querySelector('.case-card');
    if (heroSlot && (!curHero || curHero.getAttribute('data-rec') !== heroId)) {
      heroSlot.innerHTML = heroHtml(items);
      var hc = heroSlot.querySelector('.case-card');
      if (hc && !state.shownRecoIds[heroId]) hc.classList.add('enter');
    }

    // Up-next list: reconcile by data-rec. Existing nodes stay (identity preserved); new ones enter;
    // gone ones leave. Then renumber the badges.
    var listWrap = root.querySelector('.upnext');
    var list = document.getElementById('upnext-list');
    if (!list) { render(); return; }
    var rest = items.slice(1);
    var wantIds = {};
    rest.forEach(function (it) { wantIds[itemId(it)] = true; });

    // remove nodes no longer wanted (fade out, then drop)
    Array.prototype.slice.call(list.children).forEach(function (node) {
      var id = node.getAttribute('data-rec');
      if (id && !wantIds[id] && !node.classList.contains('leaving')) {
        node.classList.add('leaving');
        setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 320);
      }
    });
    // add/order wanted nodes
    rest.forEach(function (it, k) {
      var id = itemId(it);
      var existing = list.querySelector('[data-rec="' + cssEsc(id) + '"]:not(.leaving)');
      if (!existing) {
        var tmp = document.createElement('div');
        tmp.innerHTML = miniCard(it, k + 2);
        var node = tmp.firstChild;
        if (!state.shownRecoIds[id]) node.classList.add('enter');
        list.appendChild(node);
      }
    });
    // renumber the visible (non-leaving) minis in order
    var num = 2;
    Array.prototype.slice.call(list.children).forEach(function (node) {
      if (node.classList.contains('leaving')) return;
      var b = node.querySelector('.mini-num'); if (b) b.textContent = num++;
    });
    if (listWrap) listWrap.style.display = rest.length ? '' : 'none';

    // everything now on screen is "shown" -> future arrivals animate, current ones won't
    items.forEach(function (it) { state.shownRecoIds[itemId(it)] = true; });
  }

  // Choose the completed-screen verdict from the measured result. Exposed on window for tests
  // because it is a semantic honesty rule ("it worked" only when it did), not a layout detail --
  // the kind of thing a structural DOM check would happily pass over a false headline.
  //   worked   : measured landed within 25% of the expectation (or beat an unset expectation)
  //   partial  : it recovered something, but short of expected
  //   noeffect : the measured window showed no recovery -- must NOT say "it worked"
  function outcomeVerdict(expected, measured) {
    var e = Number(expected) || 0, m = Number(measured) || 0;
    var within = e > 0 && Math.abs(m - e) <= e * 0.25;
    if (within || (e <= 0 && m > 0)) return { key: 'done_worked', icon: 'ok">✓' };
    if (m > 0) return { key: 'done_partial', icon: 'run">•' };
    return { key: 'done_noeffect', icon: 'warn">!' };
  }
  window.__optimizeVerdict = outcomeVerdict;
  // Test seam (like __optimizeVerdict): lets the reconcile test drive a poll without an 8s wait.
  // No effect on production behaviour.
  window.__guidedTest = { refreshLive: function (s) { return refreshLive(s); }, reconcileDeck: function () { return reconcileDeck(); } };

    return '<div class="state-box">'
      + '<h3>' + escText(isSend ? t('send_failed_t') : t('sim_down_t')) + '</h3>'
      + '<p>' + escText(isSend ? t('send_failed_b') : t('sim_down_b')) + '</p>'
      + (state.error && state.error.msg ? '<p class="mono-err">' + escText(state.error.msg) + '</p>' : '')
      + '<div class="state-actions">'
      + '<button class="btn-primary" data-act="retry">' + escText(t('retry')) + '</button>'
      + (isSend ? '' : '<button class="linkq" data-act="mode" data-mode="demo">' + escText(t('switch_demo')) + '</button>')
      + '</div></div>';
  }
  function noDecisionBody() {
    return '<div class="state-box"><h3>' + escText(t('no_decision_t')) + '</h3>'
      + '<p>' + escText(t('no_decision_b')) + '</p></div>';
  }

  function render() {
    var body = '';
    // Live must never borrow DEMO's numbers to fill a gap: a failed or pending load renders an
    // explicit state instead. This is the whole difference between a real console and a mock.
    if (state.dataMode === 'sim' && state.error) body = errorBody();
    else if (state.dataMode === 'sim' && !state.live) body = loadingBody();
    else if (state.view === 'today') body = todayView();
    else if (state.view === 'decision') {
      // The queue may have emptied under an open decision (e.g. after resolving the last reco);
      // fall back to Today rather than dereferencing a null active reco.
      if (!S()) { state.view = 'today'; body = todayView(); }
      else if (state.status === 'awaiting') body = S().decision ? decisionAwaiting() : noDecisionBody();
      else if (state.status === 'executing') body = decisionExecuting();
      else body = decisionCompleted();
    } else if (state.view === 'performance') body = performanceView();
    else if (state.view === 'history') body = historyView();

    var html = '<div class="app">' + topbar()
      + '<div class="scroll"><main class="stage ' + (state.view === 'performance' ? 'wide' : '') + '">'
      + simline() + body
      + '</main></div></div>';
    if (state.reviewOpen) html += reviewDrawer();
    if (state.evidenceOpen) html += evidenceDrawer();

    document.getElementById('app').innerHTML = html;
    observeCharts();
    publishEmbinderContext();
  }

  // ── chart width measurement (ResizeObserver -> re-render) ─────────────────
  var ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(function (entries) {
    var changed = false;
    for (var i = 0; i < entries.length; i++) {
      var k = entries[i].target.getAttribute('data-ck');
      var w = Math.round(entries[i].contentRect.width);
      if (k && w && chartW[k] !== w) { chartW[k] = w; changed = true; }
    }
    if (changed) render();   // guarded: only when a width actually changed
  }) : null;
  function observeCharts() {
    if (!ro) return;
    var els = document.querySelectorAll('[data-ck]');
    for (var i = 0; i < els.length; i++) ro.observe(els[i]);
  }

  // ── Live: the adapter ────────────────────────────────────────────────────
  // The pipeline and the design describe the same decision in different shapes. The pipeline emits
  // {label,value,kind} / {metric,value,kind} and keeps ids under `audit`; the design wants
  // {kind,name,val,src,fresh,id,conflict}, five numbered questions, and a `ui` block of prose.
  // This function is that translation -- the "one seam" the port was written around.
  //
  // Rules it must not break:
  //  - every number here comes from `scn` (the simulator) or the pipeline; none are invented
  //  - `ai.py analyze` supplies prose ONLY; if it fails we fall back to the deterministic prose
  //    the pipeline already wrote, never to demo text
  function bridgeJson(script, args, stdin, timeoutMs) {
    var b = window.AtriaDash;
    if (!b || !b.json) return Promise.reject(new Error('bridge unavailable'));
    return b.json(script, args, { stdin: JSON.stringify(stdin || {}), timeout_ms: timeoutMs || 20000 });
  }

  // The run gateway allows only a few in-flight scripts per session and 429s the rest. A background
  // prose call can hold a slot for tens of seconds, so a foreground action (the approve chain) can
  // lose the race. Retry a rejected call a couple of times with a short backoff; a real failure
  // still surfaces after the retries. Only rate-limit-ish rejections are worth retrying, but
  // retrying any transient rejection here is harmless because these calls are idempotent reads
  // plus the store's own idempotent status writes.
  function bridgeJsonRetry(script, args, stdin, timeoutMs, tries) {
    tries = tries == null ? 3 : tries;
    return bridgeJson(script, args, stdin, timeoutMs).catch(function (e) {
      var msg = String((e && e.message) || e);
      var retriable = /rate-limited|429|non-zero/i.test(msg);
      if (tries <= 1 || !retriable) throw e;
      return new Promise(function (res) { setTimeout(res, 700); })
        .then(function () { return bridgeJsonRetry(script, args, stdin, timeoutMs, tries - 1); });
    });
  }

  function fmtNum(n) { return (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString(state.lang === 'vi' ? 'vi-VN' : 'en-US'); }
  function pct(x) { return Math.round((Number(x) || 0) * 100) + '%'; }

  // The engine already scores risk and confidence per alternative (simulate.build_scn), so we
  // translate its values rather than invent our own. Only the LABEL is ours.
  function riskFor(alt) {
    var r = String((alt && alt.risk) || '').toLowerCase();
    if (r === 'high') return { v: t('risk_high'), cls: 'warn' };
    if (r === 'medium' || r === 'med') return { v: t('risk_med'), cls: 'warn' };
    if (r === 'low') return { v: t('risk_low'), cls: 'ok' };
    return { v: '—', cls: '' };
  }
  function confFor(alt) {
    var s = Number(alt && alt.confidence);
    if (isNaN(s)) return { v: '—', cls: '' };
    if (s >= 0.75) return { v: t('conf_high'), cls: '' };
    if (s >= 0.45) return { v: t('conf_med'), cls: '' };
    return { v: t('conf_low'), cls: 'warn' };
  }
  // An option is refused when the engine marks it infeasible / gives a rejection reason. That is a
  // real constraint check against live machine health -- never a canned flag.
  function isBlocked(a) { return a.feasible === false || !!a.rejection; }

  // Straight-line projection between current and a forecast scalar -- exactly what V2 draws
  // (dashboard.html recForecastChart) and what build_scn's forecast_base means: "continue as-is".
  function projectSeries(current, end, n) {
    var out = [];
    for (var i = 0; i < n; i++) out.push(Math.round(current + (end - current) * (i / (n - 1))));
    return out;
  }

  // Build ONE decision scenario from ONE scn (a queue item). Called once per recommendation in the
  // live queue (status.scns); `analysis` is the model prose for THIS reco (fetched lazily on open).
  function scenarioFrom(status, scn, analysis) {
    if (!scn) return null;
    var alts = (scn.alternatives || []).slice();
    // The recommended option is the top-ranked feasible one; a blocked option can outrank on raw
    // effect and still be refused -- that refusal is the design's key tension and it must come
    // from the live constraint check, never a canned flag.
    var feasible = alts.filter(function (a) { return !isBlocked(a) && a.id !== 'ACT-000'; });
    var rec = feasible[0] || null;
    var gapUnits = Math.max(0, (Number(scn.target) || 0) - (Number(scn.forecastBase) || 0));
    // The engine states the expected recovery outright; only fall back to deriving it.
    var recovery = rec
      ? (rec.recovered != null ? Math.round(Number(rec.recovered))
                               : Math.max(0, Math.round((Number(rec.forecastAfter) || 0) - (Number(scn.forecastBase) || 0))))
      : 0;
    var risk = riskFor(rec);
    var conf = confFor(rec);
    var st = analysis && analysis.stages ? analysis.stages : {};
    // Prose arrives a stage later than the numbers. Where a sentence can be derived from live
    // telemetry we derive it; where it is a genuine INFERENCE ("why is this happening"), we say the
    // explanation is still coming rather than guess a cause. Never invent an inference.
    var prose = function (k, fallback) {
      var v = (analysis && analysis[k]) || (st[k] && st[k].summary);
      return v || fallback || t('prose_pending');
    };

    var subject = scn.line || scn.targetMachine || '—';
    // The engine names each action in human terms (`type`) and even splits a headline around a
    // hinge word (headPre / headEm / headPost) -- which is exactly the design's "Prioritize pallet
    // *P-104* with Forklift F07" shape. Use it; the id is a last resort, not a label.
    var recName = rec ? (rec.type || rec.name || rec.title || rec.id) : '';
    var recHead = rec && rec.headEm
      ? escText(rec.headPre || '') + ' <em>' + escText(rec.headEm) + '</em> ' + escText(rec.headPost || '')
      : escText(recName);
    var mins = Number(scn.minutesRemaining) || 0;

    // Sentences derivable from the telemetry itself, used until the model's prose lands (and if it
    // never lands). These state only what the numbers already say.
    var detMeasure = fmt(t('det_measure'), { subject: subject, cur: fmtNum(scn.current), tgt: fmtNum(scn.target) });
    var detPredict = fmt(t('det_predict'), { end: fmtNum(scn.forecastBase), gap: fmtNum(gapUnits), pct: pct(scn.attainProb) });
    var detEvaluate = fmt(t('det_evaluate'), { n: alts.length });
    var detRecommend = recName ? fmt(t('det_recommend'), { action: recName, n: fmtNum(recovery) }) : '';

    // Evidence: values + source module are real (from the simulator). Event ids/freshness/conflicts
    // need the governed data feed, which is not connected -- so we show what we have and mark the
    // rest, rather than dressing samples up as live provenance.
    var evIds = scn.evidence || [];
    var obs = [
      { kind: 'Observed', name: { en: 'Units produced so far', vi: 'Sản lượng đến hiện tại' }, val: fmtNum(scn.current), src: 'Produce · fleet sim', fresh: '', id: evIds[0] || '', conflict: '' },
      { kind: 'Observed', name: { en: 'Cycle time (actual)', vi: 'Thời gian chu kỳ (thực tế)' }, val: (scn.cycleActual != null ? scn.cycleActual + ' s' : '—'), src: 'Produce · fleet sim', fresh: '', id: evIds[1] || '', conflict: '' },
      { kind: 'Observed', name: { en: 'Machine health index', vi: 'Chỉ số sức khỏe máy' }, val: (scn.machineHealth != null ? String(scn.machineHealth) : '—'), src: 'Monitor · fleet sim', fresh: '', id: evIds[2] || '', conflict: '' },
      { kind: 'Calculated', name: { en: 'Shift target', vi: 'Mục tiêu ca' }, val: fmtNum(scn.target), src: 'Produce · fleet sim', fresh: '', id: '', conflict: '' },
      { kind: 'Predicted', name: { en: 'Projected at current rate', vi: 'Chiếu theo tốc độ hiện tại' }, val: fmtNum(scn.forecastBase), src: 'Optimize · projection', fresh: '', id: '', conflict: '' }
    ];

    var opts = alts.map(function (a) {
      // The rejection text is the engine's own reason (e.g. machine health below the safe limit) --
      // the design's "blocked · machine health" chip, sourced from a real check.
      var note = isBlocked(a)
        ? t('opt_blocked') + ' · ' + (a.rejection || a.approval || '')
        : (a.id === 'ACT-000' ? 'opt_baseline'
           : (rec && a.id === rec.id ? 'opt_recommended' : (a.approval || a.cost || '')));
      var delta = a.recovered != null
        ? Math.round(Number(a.recovered))
        : Math.round((Number(a.forecastAfter) || 0) - (Number(scn.forecastBase) || 0));
      return {
        name: a.type || a.name || a.id,
        note: note,
        rec: (delta > 0 ? '+' : '') + delta,
        blocked: isBlocked(a) ? '1' : '0'
      };
    });

    return {
      skill: 'recommend_operational_action',
      status: scn.status || 'awaiting_approval',
      execution_id: (status.audit && status.audit.execution_id) || scn.recId || '',
      correlation_id: scn.recId || '',
      decision_id: scn.recId || '',
      rec_id: scn.recId || '',
      rec_action: rec,
      problem: scn.problem || '',
      // Deck teaser (Today view): what the mini/hero card shows without opening the decision. All
      // derived from this reco's real numbers. Title is problem-specific so a down machine reads as
      // down, not merely "behind".
      teaser: {
        title: fmt(t('title_' + (scn.problem || 'oee')), { subject: subject }),
        recovery: fmt(t('live_meta_recovery'), { n: fmtNum(recovery) }),
        risk: risk.v,
        within: fmt(t('live_meta_time'), { n: mins })
      },
      scope: { plant_id: status.plant || '', line_id: subject, work_order: scn.wo || '', timezone: '' },
      _analysis: analysis || null,
      summary: prose('measure', detMeasure),

      ui: {
        subject: subject,
        today_sub: fmt(t('live_today_sub'), { gap: fmtNum(gapUnits) }),
        case_title: fmt(t('live_case_title'), { subject: subject }),
        // "Why" is an inference -- if the model has not spoken yet, say so; do not guess a cause.
        case_body: prose('explain', ''),
        case_meta: [
          { text: fmt(t('live_meta_recovery'), { n: fmtNum(recovery) }), cls: '' },
          { text: fmt(t('live_meta_risk'), { r: risk.v }), cls: '' },
          { text: fmt(t('live_meta_time'), { n: mins }), cls: 'warn' }
        ],
        eyebrow: fmt(t('live_eyebrow'), { subject: subject, wo: scn.wo || '' }),
        eyebrow_sent: fmt(t('live_eyebrow_sent'), { subject: subject }),
        eyebrow_done: fmt(t('live_eyebrow_done'), { subject: subject }),
        situation: fmt(t('live_situation'), { cur: '<b>' + escText(fmtNum(scn.forecastBase)) + '</b>', tgt: '<b>' + escText(fmtNum(scn.target)) + '</b>' }),
        chart_title: t('live_chart_title'),
        reco_title: rec ? recHead : escText(t('no_decision_t')),
        // The engine explains each option in `why`; the model's prose is a nicer read, so prefer it
        // and fall back to the engine's own reasoning rather than to a template.
        reco_body: prose('recommend', (rec && (rec.why || rec.detail)) || detRecommend),
        perf_title: fmt(t('live_perf_title'), { subject: subject }),
        perf_chart: t('live_perf_chart')
      },

      observations: obs,
      questions: [
        { n: '1', kind: 'Observed', q: 'q1', a: prose('measure', detMeasure) },
        { n: '2', kind: 'Inferred', q: 'q2', a: prose('explain', '') },   // inference: never derived
        { n: '3', kind: 'Predicted', q: 'q3', a: prose('predict', detPredict) },
        { n: '4', kind: null, q: 'q4', a: 'q4_lead', opts: opts },
        // "Why is this recommended" -> the model's evaluation, else the engine's own `why`.
        { n: '5', kind: 'Recommended', q: 'q5', a: prose('evaluate', (rec && rec.why) || detEvaluate) }
      ],

      decision: rec ? {
        metrics: [
          { v: fmtNum(gapUnits), l: 'units_short', cls: 'warn' },
          // The chance of reaching target -- the PROBABILITY from simulate.attain_probability,
          // never scn.attainBefore (a ratio). See that function's docstring.
          { v: pct(scn.attainProb), l: 'chance_target', cls: (Number(scn.attainProb) < 0.5 ? 'warn' : '') },
          { v: mins + ' ' + t('minutes'), l: 'to_decide', cls: '' }
        ],
        reco_metrics: [
          { v: '+' + fmtNum(recovery), l: 'exp_recovery', cls: 'accent' },
          { v: risk.v, l: 'risk', cls: risk.cls },
          { v: conf.v, l: 'confidence', cls: conf.cls }
        ],
        forecast: {
          no_action: projectSeries(scn.current, scn.forecastBase, 6),
          with_action: projectSeries(scn.current, rec ? rec.forecastAfter : scn.forecastBase, 6),
          target: scn.target
        }
      } : null,

      review: {
        // `detail` is the engine's concrete description of the action ("Release 9 product batch(es)
        // into the intake queue -- urgent") -- exactly what a manager needs before approving.
        will_happen: fmt(t('live_will_happen'), { action: escText((rec && (rec.detail || rec.type)) || recName), machine: escText(subject) }),
        expected: fmt(t('live_expected_res'), { n: '<b>' + escText(fmtNum(recovery)) + '</b>', after: '<b>' + escText(fmtNum(rec ? rec.forecastAfter : scn.forecastBase)) + '</b>' }),
        safety: '',
        owner: t('live_owner'),
        stop: t('live_stop')
      },

      constraints: scn.constraints || [],
      attain_note: scn.attainProbNote || '',
      // Raw numbers kept for the outcome measurement: to say what an action actually recovered we
      // need where we started and how fast we were going before we touched anything.
      raw: {
        machine: scn.targetMachine,
        current: Number(scn.current) || 0,
        rate: (function () {
          var tm = (status.machines || []).filter(function (m) { return m.id === scn.targetMachine; })[0];
          return tm ? (Number(tm.thru) || 0) : 0;
        })(),
        minute: Number(status.simulation_minute) || 0,
        minutesRemaining: mins,
        forecastBase: Number(scn.forecastBase) || 0,
        expected: recovery
      },
      execution: null,
      validation: null,
      data_quality: null,
      confidence: { level: conf.v, score: (rec && rec.score) || 0, explanation: '' },
      provenance: { source_event_ids: evIds, module_reads: ['Produce', 'Monitor'] },
      versions: scn.versions || {},
      audit: { principal: status.principal || t('live_operator'), required_role: '', model_versions: [] },

      attn: [
        { v: '1', l: 'attn_decision', cls: 'warn' },
        { v: String((scn.constraints || []).filter(function (c) { return c.r !== 'passed'; }).length), l: 'attn_blocked', cls: '' },
        { v: fmtNum(scn.current), l: 'attn_units_today', cls: 'ok' }
      ],
      perf_kpis: [
        { v: fmtNum(scn.forecastBase), l: 'perf_on_pace', cls: 'warn' },
        { v: pct(scn.attainProb), l: 'chance_target', cls: (Number(scn.attainProb) < 0.5 ? 'warn' : '') },
        { v: fmtNum(scn.target), l: { en: 'shift target', vi: 'mục tiêu ca' }, cls: '' },
        { v: String(scn.machineHealth != null ? scn.machineHealth : '—'), l: { en: 'machine health', vi: 'sức khỏe máy' }, cls: '' }
      ],
      perf_series: (status.trends && status.trends.thru) ? status.trends.thru.slice(-12) : [],
      perf_target: scn.target,
      history: [],
      improvements: []
    };
  }

  // ── Live: fetch ──────────────────────────────────────────────────────────
  // TWO STAGES, deliberately. The telemetry (every number on the screen) comes back from
  // simulate.py in well under a second; the prose comes from a real model call that can take tens
  // of seconds. Waiting for the model before showing anything left the console sitting on
  // "Reading the line..." long after the facts were already in hand. So: paint the numbers as soon
  // as they land, then fill the prose in when it arrives. The prose is an explanation of the
  // numbers -- never their source -- so this ordering is also the honest one.
  var proseSeq = 0;
  function refreshLive(showLoading) {
    if (state.dataMode !== 'sim') return Promise.resolve();
    if (showLoading) { state.loading = true; state.error = null; render(); }
    var seq = ++proseSeq;
    return bridgeJsonRetry('simulate.py', ['status'], { lang: state.lang }, 20000)
      .then(function (status) {
        if (!status || status.connected === false) {
          throw new Error((status && status.error) || 'simulator not reachable');
        }
        var scns = status.scns || (status.scn ? [status.scn] : []);
        // Build the whole queue from real numbers (prose pending). Each scn -> one full scenario.
        var recos = scns.map(function (scn) { return scenarioFrom(status, scn, null); }).filter(Boolean);

        var prev = state.live;
        // Preserve fetched prose across the poll (don't re-hit the model for a reco already explained),
        // matched by rec_id. The poll only runs while status is 'awaiting' (see startLivePoll), so we
        // never rebuild the queue under an executing/completed decision.
        var activeId = (state.view === 'decision' && S()) ? S().rec_id : null;
        recos = recos.map(function (r) {
          var old = prev && prev.recos ? prev.recos.filter(function (o) { return o.rec_id === r.rec_id; })[0] : null;
          if (old && old._analysis) return scenarioFrom(status, findScn(status, r.rec_id), old._analysis) || r;
          return r;
        });
        // Clear cooldown flags for problems the (cooldown-suppressed) backend no longer lists, so a
        // genuinely recurring problem can surface again once its cooldown lapses.
        var liveIds = {};
        recos.forEach(function (r) { liveIds[r.rec_id] = true; });
        Object.keys(state.resolvedIds).forEach(function (id) { if (!liveIds[id]) delete state.resolvedIds[id]; });

        state.live = { recos: recos, history: (prev && prev.history) || [], _status: status };
        // Keep the active reco selected across the poll (indices may shift as the queue re-ranks).
        if (activeId) {
          var ni = recos.map(function (r) { return r.rec_id; }).indexOf(activeId);
          state.recoIndex = ni >= 0 ? ni : 0;
        }
        if (state.recoIndex >= recos.length) state.recoIndex = Math.max(0, recos.length - 1);
        state.loading = false; state.error = null;
        // On Today with the deck already mounted, update it IN PLACE (no full-page repaint) so it stays
        // smooth and new recommendations can slide up. Everything else uses full render().
        if (state.view === 'today' && document.getElementById('deck-root')) reconcileDeck();
        else render();
        loadHistory();

        // Stage 2 -- prose for the ACTIVE reco only (lazy, targeted): explain the machine the user is
        // looking at, not the whole fleet. Only while a decision is open.
        if (state.view === 'decision') fetchProseForActive();
      })
      .catch(function (e) {
        state.loading = false;
        state.error = { msg: String((e && e.message) || e) };
        state.live = null;   // never leave stale numbers on screen behind an error
        render();
      });
  }

  // Find the raw scn (from a status payload) matching a reco's id -- needed to re-run analyze/mapping.
  function findScn(status, recId) {
    var scns = status.scns || (status.scn ? [status.scn] : []);
    return scns.filter(function (s) { return (s.recId || '') === recId; })[0] || scns[0] || null;
  }

  // Open a recommendation from the deck: make it active and go to its decision. Prose is fetched here
  // (lazily, for THIS reco only) so the deck itself stays instant.
  function openReco(i) {
    var recos = activeRecos();
    if (i < 0 || i >= recos.length) i = 0;
    state.recoIndex = i;
    state.view = 'decision'; state.status = 'awaiting';
    state.howOpen = state.reviewOpen = state.evidenceOpen = false;
    render();
    if (state.dataMode === 'sim') fetchProseForActive();
  }

  // Fetch model prose for the active reco's machine and splice it back into the queue. The pipeline
  // explains the scn we pass verbatim (ai._snapshot_from), so it names the opened machine.
  function fetchProseForActive() {
    var live = state.live, act = S();
    if (!live || !act || act._analysis || state.dataMode !== 'sim') return;
    var status = live._status || {};
    var scn = findScn(status, act.rec_id);
    if (!scn) return;
    var seq = ++proseSeq;
    bridgeJsonRetry('ai.py', ['analyze'], { machines: status.machines, scn: scn, lang: state.lang }, 60000)
      .then(function (analysis) {
        if (seq !== proseSeq || state.dataMode !== 'sim' || !analysis || !state.live) return;
        var merged = scenarioFrom(status, scn, analysis);
        if (!merged) return;
        merged._analysis = analysis;
        // carry any in-flight execution/validation on the active reco
        if (act.execution) merged.execution = act.execution;
        if (act.validation) merged.validation = act.validation;
        state.live.recos = state.live.recos.map(function (r) { return r.rec_id === merged.rec_id ? merged : r; });
        render();
      })
      .catch(function () { /* deterministic prose already reads fine */ });
  }

  function loadHistory() {
    bridgeJsonRetry('optimize.py', ['list'], { limit: 8 }, 20000)
      .then(function (r) {
        var rows = (r && (r.decisions || r.items || r.rows)) || [];
        if (!state.live) return;
        state.live.history = rows.map(function (d) {
          var st = d.status === 'completed' ? 'Worked'
                 : d.status === 'rejected' ? 'Rejected'
                 : d.status === 'dispatched' ? 'Executing' : 'Inconclusive';
          return {
            title: (d.recommended_action && (d.recommended_action.name || d.recommended_action.action)) || d.recommendation_id || d.id || '—',
            when: String(d.updated_at || d.created_at || '').slice(11, 16),
            actor: (d.approval && d.approval.actor && d.approval.actor.id) || '—',
            status: st, rec_id: d.recommendation_id || d.id || ''
          };
        });
        if (state.view === 'history') render();
      })
      .catch(function () { /* history is supplementary; its absence must not break the console */ });
  }

  // Poll whenever the deck is on screen (so new recommendations keep arriving live), or while a
  // decision is still awaiting. NEVER while a decision is executing/completed (its numbers are frozen
  // for the audit trail) or a drawer is open. This is VIEW-based, not status-based: the old
  // status-only guard froze the deck after any decision left `status` non-awaiting, so returning to
  // Today via the top nav stopped updating until a manual page refresh.
  function shouldPoll() {
    if (state.dataMode !== 'sim' || state.reviewOpen || state.evidenceOpen) return false;
    if (state.view === 'today') return true;
    if (state.view === 'decision') return state.status === 'awaiting';
    return false;
  }
  function startLivePoll() {
    stopLivePoll();
    simTimer = setInterval(function () { if (shouldPoll()) refreshLive(false); }, 8000);
  }
  function stopLivePoll() { if (simTimer) { clearInterval(simTimer); simTimer = null; } }

  // ── actions (data-act delegation) ────────────────────────────────────────
  function approve() {
    state.reviewOpen = false;
    if (state.dataMode === 'demo') {
      // Demo keeps the prototype's timed illusion -- and says so on the result screen.
      state.status = 'executing'; render();
      clearTimeout(execTimer);
      execTimer = setTimeout(function () { state.status = 'completed'; render(); }, 1800);
      return;
    }
    approveLive();
  }

  // ── Live: approve -> the real gate -> real actuation -> measured outcome ──
  // The approval gate already exists and we ride it rather than inventing one (SKILL.md:51-55):
  //   recommend  -> persists a packet with status `awaiting_approval` (never actuates)
  //   approve    -> a human says yes
  //   replan     -> REFUSES an unapproved decision; only then does it actuate the simulator
  // So "Approve and send" is literally those three calls. If the gate ever regresses, replan comes
  // back status=awaiting_approval and we surface that instead of pretending it worked.
  function approveLive() {
    var act = S();
    if (!state.live || !act || !act.decision) return;
    var baseline = act.raw;
    // Quiesce ALL background traffic before dispatching. The run gateway caps in-flight scripts per
    // session (4), and the approve chain issues several calls back-to-back; a stray poll or a
    // still-pending prose call can occupy a slot and 429 the recommend. Stop the poll and
    // invalidate any prose response in flight (proseSeq bump) so approve owns the channel.
    stopLivePoll();
    proseSeq++;
    state.status = 'executing';
    act.execution = { task_id: '…', resource: t('sending'), command: '', idempotency_key: '', correlation_id: act.correlation_id || '', owning_module: 'Move · fleet simulator' };
    render();

    var recId = act.rec_id;
    // 1) persist the packet (awaiting_approval) and learn its real id. Retry the chain's calls: a
    // background slot may still be draining when we start.
    bridgeJsonRetry('ai.py', ['recommend'], { lang: state.lang }, 60000)
      .then(function (r) {
        recId = (r && (r.recommendation_id || (r.decision && r.decision.recommendation_id))) || recId;
        if (!recId) throw new Error('no recommendation id to approve');
        // 2) the human's approval
        return bridgeJsonRetry('optimize.py', ['approve'], { recommendation_id: recId }, 20000);
      })
      .then(function (a) {
        if (!a || a.ok === false) throw new Error('approve rejected by the store');
        // 3) dispatch + actuate -- refuses unless step 2 really landed
        return bridgeJsonRetry('ai.py', ['replan'], { recommendation_id: recId, lang: state.lang }, 60000);
      })
      .then(function (rp) {
        if (rp && rp.status === 'awaiting_approval') {
          throw new Error('the gate refused: decision is not approved');
        }
        var f = (rp && rp.findings && rp.findings[0]) || {};
        act.execution = {
          task_id: (rp && rp.audit && rp.audit.execution_id) || recId,
          resource: f.machine || (baseline && baseline.machine) || '',
          eta: '', check_at: '',
          command: (f.action ? f.action + ' → ' + (f.machine || '') : ''),
          idempotency_key: recId,
          correlation_id: (rp && rp.audit && rp.audit.execution_id) || '',
          owning_module: f.endpoint ? ('Move · ' + f.endpoint) : 'Move · fleet simulator'
        };
        render();
        return measureOutcome(recId, baseline, act);
      })
      .catch(function (e) {
        // The action did NOT go through. Say that plainly -- and do not leave the screen implying
        // an approval landed when it did not.
        state.status = 'awaiting';
        state.error = { kind: 'send', msg: String((e && e.message) || e) };
        render();
      });
  }

  // Measure what the action actually did, instead of echoing back what we expected.
  //
  // The store's own `recovered_units` is the EXPECTED value written back at dispatch
  // (pipeline.stage_replan: `recovered = decision.expected_effect.recovered_units`), so reading it
  // back and calling it "measured" would be circular.
  //
  // What we measure is the line's THROUGHPUT RATE, before and after. That is a genuinely observed
  // signal. We deliberately do NOT difference `scn.current`: that field is a modelled projection
  // (`rate_now * elapsed`), not a cumulative counter, so it moves when the rate moves and
  // differencing it produces nonsense (an idle line resuming made it read -8).
  //
  // Honest labelling:
  //   rate before / rate after            -> Observed (real telemetry)
  //   remaining shift hours at approval   -> Predicted horizon
  //   recovered = (rate gain) x horizon   -> Calculated, and directly comparable to `expected`,
  //                                          which the engine defines the same way
  var MEASURE_MS = 9000;
  function measureOutcome(recId, baseline, act) {
    act = act || S();
    var finish = function () {
      state.status = 'completed';
      // Drop the resolved reco from the deck immediately; the backend cooldown keeps it out on
      // the next poll so it does not re-nag before the sim reflects the action.
      if (act && act.rec_id) state.resolvedIds[act.rec_id] = true;
      render();
    };
    return new Promise(function (resolve) {
      setTimeout(function () {
        bridgeJsonRetry('simulate.py', ['status'], { lang: state.lang }, 20000)
          .then(function (after) {
            var scn2 = after && after.scn;
            if (!scn2 || !baseline) throw new Error('no post-window snapshot');
            var minutes = Math.max(0, (Number(after.simulation_minute) || 0) - baseline.minute);
            var tm = (after.machines || []).filter(function (m) { return m.id === baseline.machine; })[0];
            var rateAfter = tm ? (Number(tm.thru) || 0) : 0;                       // Observed
            var horizon = Math.max(0, (Number(baseline.minutesRemaining) || 0) / 60);
            var recovered = Math.round((rateAfter - baseline.rate) * horizon);     // Calculated
            var expected = Math.round(baseline.expected || 0);
            // Write the measured value back over the expected one the pipeline stored.
            return bridgeJsonRetry('optimize.py', ['outcome'], {
              recommendation_id: recId, recovered_units: recovered, status: 'successful'
            }, 20000).catch(function () { return null; }).then(function () {
              act.validation = {
                expected: expected,
                measured: recovered,
                baseline: fmt(t('meas_baseline'), { rate: fmtNum(Math.round(baseline.rate)), h: horizon.toFixed(1) }),
                comparison: fmt(t('meas_window'), { mins: Math.round(minutes), rate: fmtNum(Math.round(rateAfter)) }),
                method: t('meas_method'),
                write_back: recId,
                simulated: false
              };
              finish();
              resolve();
            });
          })
          .catch(function () {
            // Could not measure -> say the outcome is not measured rather than invent one.
            act.validation = {
              expected: Math.round((baseline && baseline.expected) || 0),
              measured: 0, baseline: '—', comparison: '—',
              method: t('meas_failed'), write_back: recId, simulated: true
            };
            finish(); resolve();
          });
      }, MEASURE_MS);
    });
  }
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el) {
      // Click-away closes the settings popover.
      if (state.settingsOpen && !(ev.target.closest && ev.target.closest('[data-stop]'))) { state.settingsOpen = false; render(); }
      return;
    }
    var a = el.getAttribute('data-act');
    if (a === 'view') {
      var v = el.getAttribute('data-view');
      navigateSection(v);
    }
    else if (a === 'go-review') { state.view = 'decision'; state.status = 'awaiting'; render(); }
    else if (a === 'open-reco') { openReco(parseInt(el.getAttribute('data-i'), 10) || 0); }
    else if (a === 'go-today') {
      state.view = 'today'; state.recoIndex = 0; state.status = 'awaiting';
      state.howOpen = state.reviewOpen = state.evidenceOpen = false;
      render();
      if (state.dataMode === 'sim') { refreshLive(false); startLivePoll(); }  // resume the live deck
    }
    else if (a === 'toggle-how') { state.howOpen = !state.howOpen; render(); }
    else if (a === 'open-review') { state.reviewOpen = true; state.evidenceOpen = false; render(); }
    else if (a === 'close-review') { state.reviewOpen = false; render(); }
    else if (a === 'open-evidence') { state.evidenceOpen = true; state.reviewOpen = false; render(); }  // only one drawer at a time
    else if (a === 'close-evidence') { state.evidenceOpen = false; render(); }
    else if (a === 'approve') approve();
    else if (a === 'hist-tab') { state.histTab = el.getAttribute('data-tab'); render(); }
    else if (a === 'open-case') { state.view = 'decision'; state.status = 'completed'; state.howOpen = false; state.reviewOpen = false; render(); }
    else if (a === 'settings') { state.settingsOpen = !state.settingsOpen; render(); }
    else if (a === 'lang') { setLang(el.getAttribute('data-lang')); }
    else if (a === 'theme') { setTheme(el.getAttribute('data-theme')); }
    else if (a === 'mode') { state.settingsOpen = false; setDataMode(el.getAttribute('data-mode')); }
    else if (a === 'retry') {
      var wasSend = state.error && state.error.kind === 'send';
      state.error = null;
      // A failed send leaves the live case intact, so retrying just returns to the decision; a
      // dead simulator needs an actual refetch.
      if (wasSend && state.live) { state.status = 'awaiting'; render(); } else { refreshLive(true); }
    }
    else if (a === 'reject-dec') { rejectDecision(); }
  });

  // Reject is a real, recorded decision too -- it goes through the same store + audit trail as an
  // approval, so History shows why nothing happened.
  function rejectDecision() {
    state.reviewOpen = false;
    var act = S();
    if (state.dataMode === 'demo' || !act || !act.rec_id) { state.view = 'today'; state.recoIndex = 0; render(); return; }
    var recId = act.rec_id;
    // Rejecting resolves it from the deck too (recorded, not acted). Cooldown keeps it out on re-poll.
    state.resolvedIds[recId] = true;
    state.view = 'today'; state.recoIndex = 0;
    render();
    bridgeJson('optimize.py', ['reject'], { recommendation_id: recId }, 20000)
      .then(function () { loadHistory(); })
      .catch(function () { /* the console must not break because the log write failed */ });
  }

  // ── init ─────────────────────────────────────────────────────────────────
  applyTheme(state.theme);
  applyLang(state.lang);
  render();
  // The clock must NOT trigger a structural render: render() replaces #app.innerHTML, which
  // destroys element identity and silently collapses any <details> the user opened (the L3
  // "Full decision object" / "Technical details" disclosures), loses drawer scroll position,
  // and re-fires the drawer slide-in. The DC original got away with a full re-render because
  // React reconciled and preserved that uncontrolled state; innerHTML does not. So patch the
  // one node that changes. render() still paints the right clock on every real state change.
  setInterval(function () {
    state.clock = fmtClock(new Date());
    var c = document.querySelector('.clock');
    if (c) c.textContent = state.clock;
  }, 30000);

  var bridge = window.AtriaDash;
  if (bridge && bridge.onEmbinderCall) {
    try {
      bridge.onEmbinderCall(function (request) {
        var args = request && request.args ? request.args : {};
        var action = request && request.action;
        try {
          var result;
          if (action === 'inspect') result = embinderSnapshot();
          else if (action === 'navigate_section') result = navigateSection(args.section);
          else if (action === 'set_language') { setLang(args.language); result = embinderSnapshot(); }
          else if (action === 'set_theme') { setTheme(args.theme); result = embinderSnapshot(); }
          else if (action === 'set_data_mode') { setDataMode(args.mode); result = embinderSnapshot(); }
          else if (action === 'open_recommendation') {
            openReco(Number(args.index) || 0);
            result = embinderSnapshot();
          }
          else if (action === 'open_evidence') {
            if (!S()) throw new Error('no active recommendation is available');
            state.view = 'decision'; state.evidenceOpen = true; state.reviewOpen = false; render();
            result = embinderSnapshot();
          }
          else if (action === 'open_review') {
            if (!S()) throw new Error('no active recommendation is available');
            state.view = 'decision'; state.reviewOpen = true; state.evidenceOpen = false; render();
            result = embinderSnapshot();
          }
          else if (action === 'approve_recommendation') {
            if (!S()) throw new Error('no active recommendation is available');
            approve();
            result = { status: 'submitted_for_execution', recommendation_id: (S() || {}).rec_id || null };
          }
          else if (action === 'reject_recommendation') {
            if (!S()) throw new Error('no active recommendation is available');
            rejectDecision();
            result = { status: 'recording_rejection' };
          }
          else throw new Error('unsupported Optimize agent action: ' + action);
          bridge.embinderResult(request.requestId, result);
        } catch (e) {
          bridge.embinderError(request && request.requestId, String((e && e.message) || e));
        }
      });
    } catch (e) {}
  }
  if (bridge && bridge.onTheme) {
    try { bridge.onTheme(function (mode) { if ((mode === 'light' || mode === 'dark') && !readManualTheme()) { applyTheme(mode); render(); } }); } catch (e) {}
  }
  if (bridge && bridge.ready) { try { bridge.ready(); } catch (e) {} }
  publishEmbinderContext();
  if (bridge && bridge.resize) { try { bridge.resize(960); } catch (e) {} }
  // Don't burn the simulator (or the LLM) while the tab is hidden.
  if (bridge && bridge.onVisibility) {
    try {
      bridge.onVisibility(function (vis) {
        if (vis && state.dataMode === 'sim') { refreshLive(!state.live); startLivePoll(); }
        else stopLivePoll();
      });
    } catch (e) {}
  }

  // Live is the default face of the console: without the bridge (standalone preview) there is no
  // way to reach the simulator, so fall back to Demo rather than sit on a permanent error.
  if (state.dataMode === 'sim') {
    if (bridge && bridge.json) { refreshLive(true); startLivePoll(); }
    else { state.dataMode = 'demo'; render(); }
  }
})();
</script>
</body>
</html>
