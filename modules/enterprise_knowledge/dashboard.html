<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Enterprise Knowledge · Secure AI Search</title>
<!-- Runs inside Atria: the AtriaDash bridge (__bridge.js) executes
     scripts/knowledge.py <args> in the platform venv and returns its JSON
     stdout. Every query is permission-scoped to the selected user_id — the
     same RBAC/ACL the CLI enforces (pre-retrieval Qdrant filter + citation
     re-check). No document a user may not see ever reaches this panel. -->
<style>
  :root {
    --bg:#F6F8FC; --panel:#FFFFFF; --ink:#17203A; --muted:#5A6685;
    --line:#E4E9F5; --brand:#2455D6; --brand-ink:#1B3EA6; --soft:#EEF2FD;
    --green:#1E9E64; --green-bg:#E7F6EE; --blue:#2455D6; --blue-bg:#E7EEFD;
    --amber:#B7791F; --amber-bg:#FBF1DC; --red:#CB2E4A; --red-bg:#FCE8EC;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; font-size:14px; line-height:1.5; }
  header { padding:18px 22px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0 0 3px; font-size:19px; color:var(--brand-ink); }
  header .sub { font-size:12.5px; color:var(--muted); }
  .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  label { font-size:12.5px; color:var(--muted); }
  select, input, button { font:inherit; padding:8px 11px; border-radius:9px;
    border:1px solid var(--line); background:#fff; color:var(--ink); }
  input:focus, select:focus { outline:2px solid var(--soft); border-color:var(--brand); }
  button { background:var(--brand); color:#fff; border:none; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  .checkbox { display:inline-flex; align-items:center; gap:6px; color:var(--ink); font-size:13px; }
  .scope { margin-top:10px; font-size:12.5px; color:var(--muted); min-height:20px; }
  .scope b { color:var(--ink); }
  main { padding:18px 22px 40px; display:grid; gap:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:15px 17px; }
  .answer-card { border-left:5px solid var(--brand); }
  .answer-card h2 { margin:0 0 8px; font-size:14px; color:var(--brand-ink); }
  .answer-text { font-size:15px; line-height:1.6; white-space:pre-wrap; }
  .meta-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
  .chip { display:inline-block; border-radius:999px; padding:2px 10px; font-size:11.5px; font-weight:600; }
  .chip.cite { background:var(--soft); color:var(--brand-ink); font-family:ui-monospace,Menlo,Consolas,monospace; }
  .chip.conf { background:var(--green-bg); color:var(--green); }
  .chip.review { background:var(--amber-bg); color:var(--amber); }
  .disclaimer { margin-top:10px; font-size:11.5px; color:var(--muted); font-style:italic; }
  .sources h2 { margin:0 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .hit { border:1px solid var(--line); border-radius:11px; padding:11px 13px; margin-bottom:9px; }
  .hit:last-child { margin-bottom:0; }
  .hit-head { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:6px; }
  .hit-title { font-weight:700; font-size:13.5px; }
  .badge { display:inline-block; border-radius:6px; padding:1px 8px; font-size:11px; font-weight:600; }
  .badge.Public { background:var(--green-bg); color:var(--green); }
  .badge.Internal { background:var(--blue-bg); color:var(--blue); }
  .badge.Restricted { background:var(--red-bg); color:var(--red); }
  .badge.Confidential { background:var(--amber-bg); color:var(--amber); }
  .badge.dept { background:#EEF0F6; color:var(--muted); }
  .badge.score { background:#F0F3FA; color:var(--muted); font-family:ui-monospace,Menlo,Consolas,monospace; }
  .hit-cite { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted); margin-bottom:6px; }
  .hit-text { font-size:12.5px; color:#2C3552; white-space:pre-wrap; max-height:8.4em; overflow:auto; }
  .empty { color:var(--muted); font-size:13px; }
  .error { color:var(--red); font-size:13px; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--soft);
    border-top-color:var(--brand); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .legend { font-size:11.5px; color:var(--muted); }
  .legend .badge { margin-right:2px; }
</style>
</head>
<body>
<header>
  <h1>Enterprise Knowledge</h1>
  <div class="sub">Tìm kiếm tri thức nội bộ có kiểm soát quyền truy cập (RBAC/ACL) — trả lời có trích dẫn, tiếng Việt.</div>
  <div class="controls">
    <label for="user">Người dùng:</label>
    <select id="user"></select>
    <input id="q" placeholder="Nhập câu hỏi bằng tiếng Việt…" style="flex:1; min-width:220px" />
    <label for="k">Số đoạn:</label>
    <select id="k">
      <option value="3">3</option>
      <option value="5" selected>5</option>
      <option value="8">8</option>
    </select>
    <label class="checkbox"><input type="checkbox" id="synth" checked /> Tổng hợp câu trả lời</label>
    <button id="go">Tìm kiếm</button>
  </div>
  <div id="scope" class="scope"></div>
</header>
<main>
  <div id="results">
    <div class="card"><div class="empty">Chọn người dùng, nhập câu hỏi và nhấn <b>Tìm kiếm</b>.
      Kết quả chỉ gồm tài liệu mà người dùng được phép xem.</div></div>
  </div>
  <div class="legend card" style="padding:10px 14px">
    Phân loại:
    <span class="badge Public">Public</span>
    <span class="badge Internal">Internal</span>
    <span class="badge Restricted">Restricted</span>
    <span class="badge Confidential">Confidential</span>
  </div>
</main>

<script src="__bridge.js"></script>
<script>
(function () {
  var D = window.AtriaDash;
  var USERS = [
    ["U001", "Nguyễn Văn An", "HR", "Employee"],
    ["U004", "Phạm Quốc Dũng", "ENG", "Employee"],
    ["U002", "Trần Thị Bình", "FIN", "Manager"],
    ["U005", "Hoàng Thu Hà", "OPS", "Manager"],
    ["U003", "Lê Minh Châu", "PROD", "Director"],
    ["U006", "Đỗ Anh Khoa", "LEGAL", "Director"],
    ["U008", "Bùi Đức Minh", "COMP", "Employee"],
    ["U007", "Vũ Thị Lan", "EXEC", "Executive"]
  ];

  var userSel = document.getElementById('user');
  var qInput = document.getElementById('q');
  var kSel = document.getElementById('k');
  var synthChk = document.getElementById('synth');
  var goBtn = document.getElementById('go');
  var scopeEl = document.getElementById('scope');
  var resultsEl = document.getElementById('results');

  USERS.forEach(function (u) {
    var o = document.createElement('option');
    o.value = u[0];
    o.textContent = u[0] + ' — ' + u[1] + ' (' + u[2] + ' · ' + u[3] + ')';
    userSel.appendChild(o);
  });

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function noBridge() {
    return !(D && D.json);
  }

  function loadScope() {
    if (noBridge()) { scopeEl.textContent = ''; return; }
    scopeEl.innerHTML = '<span class="spinner"></span> Đang tải phạm vi truy cập…';
    D.json('knowledge.py', ['whoami', userSel.value], { timeout_ms: 15000 })
      .then(function (w) {
        var cls = (w.accessible_classifications || []).join(', ') || '—';
        scopeEl.innerHTML = 'Quyền truy cập của <b>' + esc(w.full_name) + '</b> (' +
          esc(w.role) + ' · ' + esc(w.department) + '): phân loại được phép — <b>' + esc(cls) + '</b>.';
      })
      .catch(function (e) { scopeEl.innerHTML = '<span class="error">Không tải được phạm vi truy cập.</span>'; });
  }

  function hitCard(h) {
    var cls = h.classification || '';
    return '<div class="hit">' +
      '<div class="hit-head">' +
        '<span class="hit-title">' + esc(h.title || h.doc_id) + '</span>' +
        '<span class="badge ' + esc(cls) + '">' + esc(cls) + '</span>' +
        '<span class="badge dept">' + esc(h.department || '') + '</span>' +
        '<span class="badge score">score ' + (typeof h.score === 'number' ? h.score.toFixed(3) : '—') + '</span>' +
      '</div>' +
      '<div class="hit-cite">' + esc(h.citation || (h.doc_id + ' · ' + h.chunk_id)) + '</div>' +
      '<div class="hit-text">' + esc(h.text || '') + '</div>' +
    '</div>';
  }

  function renderAnswer(ans) {
    if (!ans) return '';
    var chips = '';
    (ans.citations || []).forEach(function (c) {
      chips += '<span class="chip cite">[' + esc(c) + ']</span>';
    });
    if (typeof ans.confidence === 'number') {
      chips += '<span class="chip conf">độ tin cậy ' + Math.round(ans.confidence * 100) + '%</span>';
    }
    if (ans.needs_review) {
      chips += '<span class="chip review">⚠ cần người kiểm tra</span>';
    }
    return '<div class="card answer-card">' +
      '<h2>Câu trả lời (có trích dẫn)</h2>' +
      '<div class="answer-text">' + esc(ans.answer || '') + '</div>' +
      '<div class="meta-row">' + chips + '</div>' +
      (ans.disclaimer ? '<div class="disclaimer">' + esc(ans.disclaimer) + '</div>' : '') +
    '</div>';
  }

  function render(payload) {
    var html = '';
    if (payload.answer) html += renderAnswer(payload.answer);

    var hits = payload.hits || [];
    if (!hits.length) {
      html += '<div class="card"><div class="empty">' +
        esc(payload.message || 'Không tìm thấy tài liệu phù hợp trong phạm vi truy cập của bạn.') +
        '</div></div>';
    } else {
      html += '<div class="card sources"><h2>Nguồn trích dẫn (' + hits.length + ')</h2>' +
        hits.map(hitCard).join('') + '</div>';
    }
    resultsEl.innerHTML = html;
  }

  function search() {
    var q = qInput.value.trim();
    if (!q) { qInput.focus(); return; }
    if (noBridge()) {
      resultsEl.innerHTML = '<div class="card"><div class="error">Bảng điều khiển này cần chạy bên trong Atria ' +
        '(cầu nối __bridge.js không khả dụng).</div></div>';
      return;
    }
    goBtn.disabled = true;
    resultsEl.innerHTML = '<div class="card"><div class="empty"><span class="spinner"></span> ' +
      (synthChk.checked ? 'Đang truy hồi và tổng hợp câu trả lời…' : 'Đang truy hồi tài liệu…') + '</div></div>';

    var args = ['query', q, '--user', userSel.value, '--k', kSel.value];
    if (synthChk.checked) args.push('--synthesize');

    D.json('knowledge.py', args, { timeout_ms: 90000 })
      .then(render)
      .catch(function (e) {
        var detail = (e && e.result && e.result.stderr) ? e.result.stderr : (e && e.message) || 'lỗi không xác định';
        resultsEl.innerHTML = '<div class="card"><div class="error">Lỗi khi truy vấn: ' + esc(detail) + '</div></div>';
      })
      .then(function () { goBtn.disabled = false; });
  }

  goBtn.addEventListener('click', search);
  qInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });
  userSel.addEventListener('change', function () {
    loadScope();
    resultsEl.innerHTML = '<div class="card"><div class="empty">Đã đổi người dùng. Nhập câu hỏi và nhấn Tìm kiếm.</div></div>';
  });

  if (D && D.ready) D.ready();
  loadScope();
})();
</script>
</body>
</html>
