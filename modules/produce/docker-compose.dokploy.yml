# Produce module for Dokploy — hosted SEPARATELY from minder-core, in the same
# Dokploy project. Unlike the local module compose, it does NOT join minder_net;
# it reaches everything over the server IP: the minder-core app (:8090), remote
# Postgres/Redis, and the remote Keycloak. produce-web publishes :9310 so the
# browser can load its microfrontend and minder-core can reach its connector.
#   Dokploy: docker compose -f modules/produce/docker-compose.dokploy.yml up -d --build
services:
  produce-web:
    build:
      context: ../..
      dockerfile: modules/produce/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "9310:9310"
    environment:
      - PR_DATABASE_URL=${PR_DATABASE_URL}
      - PR_REDIS_URL=${PR_REDIS_URL}
      - PR_PUBLIC_BASE=http://14.225.206.18:9310
      - PR_S3_ENDPOINT=${PR_S3_ENDPOINT:-http://14.225.206.18:9000}
      - PR_S3_BUCKET=produce
      - PR_S3_ACCESS_KEY=${MT_S3_ACCESS_KEY:-minioadmin}
      - PR_S3_SECRET_KEY=${MT_S3_SECRET_KEY:-minioadmin}
      - PR_AGENT_ENABLED=1
      # Reach the minder-core app + advertise this connector over the server IP.
      - MINDER_URL=http://14.225.206.18:8090
      - MINDER_MODULE_CONNECTOR_URL=http://14.225.206.18:9310
      - MINDER_MODULE_REMOTE_ENTRY=http://14.225.206.18:9310/dashboard/remoteEntry.js
      - MINDER_DEFAULT_AUTONOMY=medium
      - KEYCLOAK_TOKEN_URL=https://iam-keycloak-2bc632-14-225-206-18.sslip.io/realms/minder/protocol/openid-connect/token
      - MINDER_MODULE_CLIENT_ID=minder-module
      - MINDER_MODULE_CLIENT_SECRET=${MINDER_MODULE_CLIENT_SECRET}
      - MINDER_MODULE_HEARTBEAT_SEC=10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9310/connector/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  produce-worker:
    build:
      context: ../..
      dockerfile: modules/produce/worker/Dockerfile
    restart: unless-stopped
    environment:
      - PR_DATABASE_URL=${PR_DATABASE_URL}
      - PR_REDIS_URL=${PR_REDIS_URL}
