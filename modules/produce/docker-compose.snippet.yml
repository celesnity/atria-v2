# Paste into docker-compose.yml (same network as `minder`). Build context = repo root.
# Track A is standalone software (no Keycloak, no Minder connector). It DOES use the
# shared MinIO service for defect photos (P-SCRAP-03) — if module_template already
# declares `minio`, reuse it and DO NOT declare it twice.

  # Shared MinIO — declare ONCE across all modules. Skip if already present.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["produce_media:/data"]   # or the existing module_template_media volume

  produce-web:
    build: { context: ., dockerfile: modules/produce/backend/Dockerfile }
    ports: ["9310:9310"]
    depends_on: [db, redis, minio]
    environment:
      PR_DATABASE_URL: "postgresql://minder:minder@db:5432/minder"
      PR_REDIS_URL: "redis://redis:6379/3"
      PR_PUBLIC_BASE: "http://localhost:9310"
      PR_S3_ENDPOINT: "http://minio:9000"
      PR_S3_BUCKET: "produce"
      PR_S3_ACCESS_KEY: "minioadmin"
      PR_S3_SECRET_KEY: "minioadmin"

  produce-worker:
    build: { context: ., dockerfile: modules/produce/worker/Dockerfile }
    depends_on: [db, redis]
    environment:
      PR_DATABASE_URL: "postgresql://minder:minder@db:5432/minder"
      PR_REDIS_URL: "redis://redis:6379/3"

# Also add `produce_media:` under the top-level `volumes:` key (unless reusing
# an existing MinIO volume).
