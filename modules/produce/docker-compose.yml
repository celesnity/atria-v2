# Produce — INDEPENDENT module compose (runtime registration).
#
# Runs on its own, separate from the core Minder stack. It joins the core's
# shared `minder_net` network so it can reach `minder`, `db`, `redis`, `minio`,
# `keycloak` by name. When it starts it announces to a running Minder and its
# tools/dashboard appear live; when it stops they disappear. Core does NOT need
# to know about this module.
#
# Prereqs: the core stack is already up (it creates `minder_net`):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Run this module:
#   docker compose -f modules/produce/docker-compose.yml up -d --build
# Stop it (module vanishes from Minder):
#   docker compose -f modules/produce/docker-compose.yml down

name: produce

networks:
  default:
    external: true
    name: minder_net

services:
  produce-web:
    build:
      context: ../..
      dockerfile: modules/produce/backend/Dockerfile
    ports:
      - "9310:9310"
    environment:
      - PR_DATABASE_URL=postgresql://minder:minder@db:5432/minder
      - PR_REDIS_URL=redis://redis:6379/3
      - PR_PUBLIC_BASE=http://localhost:9310
      - PR_S3_ENDPOINT=http://minio:9000
      - PR_S3_BUCKET=produce
      - PR_S3_ACCESS_KEY=${MT_S3_ACCESS_KEY:-minioadmin}
      - PR_S3_SECRET_KEY=${MT_S3_SECRET_KEY:-minioadmin}
      # Track B (Minder co-work). Set PR_AGENT_ENABLED=0 to run Track A only.
      - PR_AGENT_ENABLED=1
      - MINDER_URL=http://minder:8080
      - MINDER_MODULE_CONNECTOR_URL=http://produce-web:9310
      - MINDER_MODULE_REMOTE_ENTRY=http://localhost:9310/dashboard/remoteEntry.js
      - MINDER_DEFAULT_AUTONOMY=medium
      - KEYCLOAK_TOKEN_URL=http://keycloak:8080/realms/minder/protocol/openid-connect/token
      - MINDER_MODULE_CLIENT_ID=minder-module
      - MINDER_MODULE_CLIENT_SECRET=${MINDER_MODULE_CLIENT_SECRET:-CHANGE-ME-IN-ENV}
      - MINDER_MODULE_HEARTBEAT_SEC=10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9310/connector/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  produce-worker:
    build:
      context: ../..
      dockerfile: modules/produce/worker/Dockerfile
    environment:
      - PR_DATABASE_URL=postgresql://minder:minder@db:5432/minder
      - PR_REDIS_URL=redis://redis:6379/3
    restart: unless-stopped
