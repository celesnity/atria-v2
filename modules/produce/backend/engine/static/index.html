<!doctype html>
<html>
<head><meta charset="utf-8"><title>Produce Engine — Slice</title>
<style>body{font-family:sans-serif;margin:2rem;max-width:760px}
button{margin:.2rem}pre{background:#f4f4f4;padding:1rem}</style></head>
<body>
<h1>Produce Workflow Engine — Slice</h1>
<label>Scope <input id="scope" value="site/lineA/res1"></label>
<button onclick="createItem()">New work item</button>
<button onclick="refresh()">Refresh dashboard</button>
<div id="queue"></div>
<h3>Dashboard</h3><pre id="dash">—</pre>
<script>
const H = {'content-type':'application/json','X-Minder-Principal':'dev'};
const scope = () => document.getElementById('scope').value;
async function createItem(){
  await fetch('/work-items',{method:'POST',headers:H,
    body:JSON.stringify({workflow_version_id:1,scope_path:scope()})});
  loadQueue();
}
async function loadQueue(){
  const items = await (await fetch('/queue?scope_path='+encodeURIComponent(scope()))).json();
  document.getElementById('queue').innerHTML = items.map(i =>
    `<div>#${i.id} [${i.status}] ${i.current_step_key||''}
      <button onclick="drive(${i.id})">claim+run</button></div>`).join('');
}
async function drive(id){
  await fetch(`/work-items/${id}/claim`,{method:'POST',headers:H});
  for (const [k,d] of [['prepare',{}],['measure',{value:5}],['finish',{}]]){
    const r = await (await fetch(`/work-items/${id}/steps/${k}/start`,{method:'POST',headers:H})).json();
    await fetch(`/step-runs/${r.step_run_id}/output`,{method:'POST',headers:H,
      body:JSON.stringify({data:d})});
  }
  loadQueue(); refresh();
}
async function refresh(){
  const d = await (await fetch('/dashboard?scope_path='+encodeURIComponent(scope())+'&target=1')).json();
  document.getElementById('dash').textContent = JSON.stringify(d,null,2);
}
loadQueue(); refresh();
</script>
</body></html>
