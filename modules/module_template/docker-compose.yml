# UI-only Module Federation remote. Core owns chat, agent execution and the
# WebSocket; this container only publishes the dashboard bundle on port 9300.
name: module_template

networks:
  default:
    external: true
    name: minder_net

services:
  module-template-embinder-relay:
    build:
      context: ../..
      dockerfile: modules/module_template/relay/Dockerfile
    environment:
      EMBINDER_ENABLE_MCP: "false"
      EMBINDER_ENABLE_CHAT: "false"
      EMBINDER_HOST: "0.0.0.0"
      EMBINDER_DIRECT_TOKEN: ${MODULE_TEMPLATE_EMBINDER_DIRECT_TOKEN:-module-template-direct}
    volumes:
      - ./embinder.policy.json:/module/embinder.policy.json:ro
      - embinder-audit:/data
    ports:
      - "7331:7331"
    restart: unless-stopped

  module-template-web:
    build:
      context: ../..
      dockerfile: modules/module_template/backend/Dockerfile
    ports:
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9300/connector/health | grep -q ui-only"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  embinder-audit:
