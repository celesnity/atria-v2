<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor · Fleet</title>
<!--
  Monitor — a self-contained, READ-ONLY manufacturing fleet console (Fleet / Machines / Ask AI).
  Split out of Optimize Console V2 (the decision engine stayed in the Optimize module), restyled
  to the shared Celesnity / Minder AI "two-skies" design system (light-first; Cosmos dark /
  Daybreak light) with the Guided settings-popover chrome and language-conditional fonts
  (Inter for EN, Be Vietnam Pro for VI). Vanilla JS: all fleet math + inline-SVG charts run
  client-side (no React, no CDN — works offline in Docker). Three views. Runs standalone AND
  inside Minder via the OPTIONAL MinderDash/AtriaDash bridge, which supplies the live fleet
  (scripts/simulate.py status) and the Ask-AI answers (scripts/ai.py ask). Monitor never
  actuates — it only reads. With the bridge absent the demo view still runs fully in-memory.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,400..700&display=swap');

/* ---- Celesnity "Gradient — two skies" tokens (matches the Guided/Optimize console):
     :root = Cosmos (dark), [data-theme="light"] = Daybreak (light). One cobalt->violet->magenta
     accent spine. ---- */
:root{
  --bg-0:#05060F; --bg-1:#0B0A1E; --bg-2:#121030; --bg-3:#1A0E4D;
  --surf:rgba(255,255,255,.04); --surf-2:rgba(255,255,255,.07);
  --line:rgba(201,206,232,.12); --line-2:rgba(201,206,232,.20);
  --text:#F8F9FE; --text-dim:#C9CEE8; --text-mute:rgba(201,206,232,.62); --text-faint:rgba(201,206,232,.34);
  --accent:#2D44E0; --accent-hi:#9E7BEA; --accent-lo:#2436B8; --accent-2:#6E1FC6; --accent-3:#B14FD0;
  --danger:#F87171; --ok:#4ADE80; --warn:#FBBF24;
  --glow:rgba(45,68,224,.42); --glow-soft:rgba(45,68,224,.18); --grid-line:rgba(201,206,232,.08);
  --ease:cubic-bezier(.2,.7,.2,1);
}
:root[data-theme="light"]{
  --bg-0:#F8F9FE; --bg-1:#FFFFFF; --bg-2:#EEECF8; --bg-3:#E6E3F4;
  --surf:rgba(28,34,64,.03); --surf-2:rgba(28,34,64,.06);
  --line:rgba(28,34,64,.10); --line-2:rgba(28,34,64,.16);
  --text:#1C2240; --text-dim:rgba(28,34,64,.72); --text-mute:rgba(28,34,64,.52); --text-faint:rgba(28,34,64,.32);
  --accent:#2D44E0; --accent-hi:#8739E0; --accent-lo:#2436B8; --accent-2:#8739E0; --accent-3:#BC67D5;
  --danger:#DC2626; --ok:#16A34A; --warn:#D97706;
  --glow:rgba(45,68,224,.28); --glow-soft:rgba(45,68,224,.15); --grid-line:rgba(28,34,64,.06);
}
/* Language-conditional fonts (matches Guided): Inter for EN, Be Vietnam Pro/Newsreader/JetBrains
   for VI (diacritics). Driven by data-lang on <html>. */
:root, :root[data-lang="vi"]{
  --serif:"Newsreader","Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro","Inter","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"Cascadia Code",Menlo,Consolas,monospace;
}
:root[data-lang="en"]{
  --sans:"Inter",system-ui,"Segoe UI",sans-serif;
  --serif:"Inter",system-ui,sans-serif;
  --mono:"Inter",ui-monospace,SFMono-Regular,monospace;
}

/* ---- Scoped dashboard styles (verbatim from the design's inline <style>) ---- */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg-0);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hi)}
/* ---- Sidebar shell (redesign) ---- */
.oc-shell{display:flex;min-height:100vh}
.oc-side{position:sticky;top:0;align-self:flex-start;height:100vh;flex:none;width:212px;display:flex;flex-direction:column;background:color-mix(in srgb,var(--text) 5%,var(--bg-0));border-right:1px solid var(--line);z-index:20}
.side-brand{display:flex;align-items:center;gap:9px;font:600 15px var(--mono);letter-spacing:.14em;color:var(--text);padding:16px 18px;border-bottom:1px solid var(--line)}
.side-brand .ver{font:500 10px var(--mono);color:var(--text-mute);letter-spacing:.12em}
.side-nav{display:flex;flex-direction:column;gap:2px;padding:12px 10px;flex:1;overflow-y:auto}
.side-lab{font:500 9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);padding:8px 10px 6px}
.side-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute)}
.oc-body{flex:1;min-width:0;display:flex;flex-direction:column}
.oc-head{position:sticky;top:0;z-index:19;display:flex;align-items:center;gap:14px;padding:13px 22px;background:color-mix(in srgb,var(--text) 5%,var(--bg-0));border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;font:600 15px var(--mono);letter-spacing:.14em;color:var(--text)}
.sq{width:15px;height:15px;background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo));border-radius:4px;box-shadow:0 0 12px var(--glow-soft)}
.ver{font:500 10px var(--mono);color:var(--text-mute);letter-spacing:.12em}
.ctx{font:500 12px var(--sans);color:var(--text-dim)}
.head-r{position:relative;margin-left:auto;display:flex;align-items:center;gap:14px}
.opdot{display:flex;align-items:center;gap:7px;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute)}
.clock{font:500 13px var(--mono);color:var(--text-dim);min-width:74px;text-align:right}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;background:var(--surf);border:1px solid var(--line);border-radius:8px;color:var(--text-dim);font-size:14px;line-height:1;cursor:pointer;transition:all .18s var(--ease)}
.theme-btn:hover{color:var(--text);border-color:var(--line-2);background:var(--surf-2)}
.modeseg{display:inline-flex;flex:none;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:2px}
.mseg{background:none;border:none;border-radius:999px;color:var(--text-mute);font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;cursor:pointer;transition:all .18s var(--ease)}
.mseg:hover{color:var(--text)}
.mseg[data-on="1"]{background:var(--accent);color:#fff}
/* Settings gear + popover (Language / Appearance) — matches the Optimize/Guided chrome. */
.mseg-w{display:inline-flex;flex:none;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:2px}
.gear{appearance:none;border:0;background:transparent;cursor:pointer;color:var(--text-mute);padding:5px;border-radius:8px;display:inline-flex;align-items:center;transition:color .15s,background .15s}
.gear:hover{color:var(--text);background:var(--surf)}
.pop{position:absolute;top:calc(100% + 10px);right:0;z-index:40;min-width:172px;display:flex;flex-direction:column;gap:7px;padding:13px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 38px rgba(0,0,0,.28)}
.pop-s{font:600 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}
.pop-s:not(:first-child){margin-top:5px}
.simbanner{display:flex;align-items:center;gap:10px;padding:11px 14px;background:color-mix(in srgb,var(--danger) 8%,var(--bg-1));border:1px solid color-mix(in srgb,var(--danger) 30%,transparent);border-radius:12px}
.simbanner.load{background:color-mix(in srgb,var(--warn) 8%,var(--bg-1));border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.simbanner-t{font:500 12.5px var(--sans);color:var(--text-dim)}
.simretry{margin-left:auto;padding:6px 12px;flex:none}
.oc-tab{display:flex;align-items:center;gap:11px;background:none;border:none;border-radius:10px;color:var(--text-mute);font:500 13px var(--sans);letter-spacing:.01em;padding:10px 12px;cursor:pointer;white-space:nowrap;text-align:left;width:100%;transition:all .16s var(--ease)}
.oc-tab svg{width:17px;height:17px;flex:none;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.oc-tab:hover{color:var(--text-dim);background:var(--surf)}
.oc-tab[data-on="1"]{color:var(--text);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.oc-tab[data-on="1"] svg{stroke:var(--accent-hi)}
.oc-main{max-width:1320px;width:100%;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;border:1px solid var(--line);background:var(--line);border-radius:14px;overflow:hidden}
.kpi{background:var(--bg-1);padding:15px 18px;display:flex;flex-direction:column;gap:5px}
.kl{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-mute)}
.kv{font:500 29px var(--sans);letter-spacing:-.045em;color:var(--text);line-height:1}
.kv.red{color:var(--danger)}
.ks{font:400 11px var(--sans);color:var(--text-dim)}
.stack{display:grid;gap:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g21{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media(max-width:940px){.g2,.g21{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);background:var(--bg-1);border-radius:16px;padding:18px 18px 16px}
.panel-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-bottom:14px}
.pnum{font:500 10px var(--mono);color:var(--accent);letter-spacing:.14em}
.ptitle{font:500 15px var(--sans);letter-spacing:-.01em;color:var(--text)}
.psub{margin-left:auto;font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute)}
.hfilter{margin-left:auto;display:flex;flex-wrap:nowrap;gap:2px;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:2px}
.hf{white-space:nowrap}
.hf{display:inline-flex;align-items:center;gap:7px;background:none;border:none;border-radius:999px;color:var(--text-mute);font:500 11px var(--sans);letter-spacing:.01em;padding:6px 12px;cursor:pointer;transition:all .18s var(--ease)}
.hf:hover{color:var(--text)}
.hf[data-on="1"]{background:var(--bg-3);color:var(--text)}
.hfn{font:600 9.5px var(--mono);color:var(--text-mute)}
.hf[data-on="1"] .hfn{color:var(--accent-hi)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:999px;color:var(--text-dim);font:500 12px var(--sans);padding:7px 14px;cursor:pointer;transition:all .18s var(--ease)}
.chip:hover{border-color:var(--line-2);color:var(--text)}
.chip[data-on="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-bottom:16px}
.mlab{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-mute)}
.msel{background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;color:var(--text);font:500 13px var(--sans);padding:9px 12px;min-width:230px;cursor:pointer}
.gen{display:flex;align-items:center;gap:12px;color:var(--text-dim);font:500 13px var(--sans);justify-content:center;padding:48px}
.spin{width:16px;height:16px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:999px}
.empty{padding:40px;text-align:center;color:var(--text-mute);font:400 14px var(--sans)}
.why{display:flex;flex-direction:column;gap:14px}
.why-eyebrow{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.why-body{font:400 14px var(--sans);line-height:1.55;color:var(--text-dim);margin:0}
.why-ctx{font:500 11px var(--mono);color:var(--text-mute);letter-spacing:.04em}
.fu-lab{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-mute);margin-bottom:9px}
.guide{display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:150px 200px 1fr;gap:16px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.gintent{font:500 12.5px var(--sans);color:var(--text)}
.gchart{font:500 11px var(--mono);color:var(--accent-hi);letter-spacing:.02em}
.gwhy{font:400 12.5px var(--sans);color:var(--text-dim);line-height:1.5}
@media(max-width:720px){.grow{grid-template-columns:1fr;gap:3px}}
.dot{display:inline-block;width:7px;height:7px;border-radius:999px}
.livedot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
/* ---- Recommendation view ---- */
.scn{display:flex;flex-direction:column;gap:18px}
.scn-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.scn-id{display:flex;flex-direction:column;gap:3px}
.scn-live{display:inline-flex;align-items:center;gap:7px;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.scn-rec{font:500 10px var(--mono);letter-spacing:.08em;color:var(--text-mute)}
.scn-head{font:500 17px var(--sans);letter-spacing:-.01em;color:var(--text)}
.scn-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.risk-pill{white-space:nowrap;font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);border-radius:999px;padding:5px 12px}
.scn-clock{font:500 13px var(--mono);color:var(--text-dim)}
.scn-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.scn-m{background:var(--bg-2);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.scn-ml{font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-mute)}
.scn-mv{font:500 27px var(--sans);letter-spacing:-.045em;color:var(--text);line-height:1}
.scn-mv.red{color:var(--danger)}
.scn-mt{font:400 10.5px var(--sans);color:var(--text-dim)}
.loop{display:flex;flex-wrap:wrap;gap:6px}
.loop-step{flex:1;min-width:96px;display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg-2)}
.loop-step[data-s="done"]{border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.loop-step[data-s="active"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg-2))}
.loop-n{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:999px;font:600 10px var(--mono);color:var(--text-mute);border:1px solid var(--line-2)}
.loop-step[data-s="done"] .loop-n{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent-hi);border-color:transparent}
.loop-step[data-s="active"] .loop-n{background:var(--accent);color:#fff;border-color:transparent}
.loop-name{font:500 12px var(--sans);color:var(--text-dim)}
.loop-step[data-s="active"] .loop-name{color:var(--text)}
.loop-step{cursor:pointer;transition:border-color .15s var(--ease),background .15s var(--ease)}
.loop-step:hover{border-color:var(--line-2)}
.loop-step[data-open="1"]{border-color:var(--accent-hi);background:color-mix(in srgb,var(--accent) 14%,var(--bg-2))}
.stage-d{display:flex;flex-direction:column;gap:12px;border-color:var(--line-2)}
.stg-ai{display:block;font:400 13.5px var(--sans);color:var(--text-dim);line-height:1.5;background:color-mix(in srgb,var(--accent) 6%,var(--bg-2));border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);border-radius:10px;padding:11px 13px}
.stg-ai-tag{display:inline-block;margin-right:8px;font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-hi);vertical-align:middle}
.stg-rows{display:flex;flex-direction:column}
.stg-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.stg-k{font:500 12px var(--sans);color:var(--text-mute)}
.stg-v{font:600 13px var(--mono);color:var(--text)}
.stg-v.red{color:var(--danger)}
.stg-ev{font:500 11px var(--mono);letter-spacing:.04em;color:var(--text-mute)}
.stg-formula{font:500 11px var(--mono);color:var(--accent-hi);background:rgba(74,108,247,.07);border:1px solid rgba(74,108,247,.16);border-radius:8px;padding:8px 10px}
.stg-losstable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stg-lr{display:grid;grid-template-columns:1fr 60px 70px;gap:8px;padding:8px 12px;font:500 12px var(--sans);color:var(--text-dim);border-bottom:1px solid var(--line)}
.stg-lr:last-child{border-bottom:none}
.stg-lr[data-h="1"]{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute)}
.stg-lr[data-primary="1"]{color:var(--danger);background:color-mix(in srgb,var(--danger) 6%,transparent)}
.stg-lr[data-total="1"]{color:var(--text);border-top:1px solid var(--line-2);font-weight:600}
.stg-lr span:nth-child(2),.stg-lr span:nth-child(3){text-align:right;font-family:var(--mono)}
.stg-life{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stg-lp{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.stg-lp[data-on="1"]{color:#fff;background:var(--accent);border-color:transparent}
.stg-arrow{color:var(--text-faint);font-size:11px}
.mdet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mdet-c{background:var(--bg-2);padding:10px 12px}
.mdet-l{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute)}
.mdet-v{font:600 15px var(--sans);color:var(--text);margin-top:3px}
.mdet-cmp{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mdet-cr{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 20px;gap:8px;padding:8px 12px;font:500 12px var(--sans);color:var(--text-dim);border-bottom:1px solid var(--line);align-items:center}
.mdet-cr:last-child{border-bottom:none}
.mdet-cr[data-h="1"]{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute)}
.mdet-cr span:nth-child(n+2){font-family:var(--mono);font-size:12px}
.mdet-warn{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mdet-wc{font:600 9.5px var(--mono);letter-spacing:.06em;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:999px;padding:3px 9px}
.rec-hero{display:flex;flex-direction:column;gap:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 7%,var(--bg-1)),var(--bg-1) 60%);border-color:var(--line-2)}
.rec-hero[data-blocked="true"]{background:linear-gradient(160deg,color-mix(in srgb,var(--danger) 8%,var(--bg-1)),var(--bg-1) 60%);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.rh-top{display:flex;align-items:center;gap:12px}
.rh-eyebrow{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.rh-status{margin-left:auto;font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;border:1px solid;border-radius:999px;padding:4px 11px}
.rh-head{margin:0;font-family:var(--sans);font-weight:500;font-size:clamp(26px,3vw,36px);line-height:1.05;letter-spacing:-.035em;color:var(--text)}
.rh-head em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;background:linear-gradient(180deg,var(--accent-hi),var(--accent) 60%,var(--accent-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.rec-hero[data-blocked="true"] .rh-head em{background:none;-webkit-text-fill-color:var(--danger);color:var(--danger)}
.rh-detail{font:400 13px var(--sans);color:var(--text-dim);margin-top:-6px}
.rh-metrics{display:flex;flex-wrap:wrap;gap:10px}

        + '<div class="why-ctx">' + escText(m.type + ' · ' + m.cell + ' · ' + m.state) + '</div></div></div>';
    } else body = '<div class="empty" style="padding:24px">' + L({ en: 'Pick a machine + intent — Minder draws the best-fit chart.', vi: 'Chọn máy + mục đích — Minder vẽ biểu đồ phù hợp.' }) + '</div>';
    return '<div class="panel"><div class="panel-h"><span class="pnum">d</span><span class="ptitle">' + t('mach_analysis') + '</span><span class="psub">' + t('mach_analysis_sub') + '</span></div>' + control + body + '</div>';
  }
  // Per-machine live detail: current telemetry + a baseline-vs-live comparison (from the sim's
  // baseline/diff) + a live vibration/temperature chart for the picked machine.
  function machineDetail() {
    var selId = state.machSel || (M.slice().sort(function (a, b) { return a.oee - b.oee; })[0] || {}).id;
    var m = M.find(function (x) { return x.id === selId; }) || M[0];
    if (!m) return '';
    var p = function (x) { return Math.round((x || 0) * 100) + '%'; };
    var sel = '<select class="msel" data-act="mach-sel">' + M.map(function (x) { return '<option value="' + x.id + '"' + (x.id === m.id ? ' selected' : '') + '>' + x.id + '  ·  ' + x.cell + '  ·  ' + x.type + '</option>'; }).join('') + '</select>';
    var tel = [['State', m.state], ['OEE', p(m.oee)], ['Availability', p(m.avail)], ['Performance', p(m.perf)], ['Quality', p(m.qual)], ['Health', p(m.health)], ['Temp', (Math.round(m.temp * 10) / 10) + '°C'], ['Vibration', (Math.round(m.vib * 100) / 100) + ' mm/s'], ['Throughput', m.thru + ' / ' + m.target + '/h'], ['Downtime', m.downMin + ' min'], ['Defect', (Math.round((m.defect || 0) * 100) / 100) + '%'], ['Since service', m.since + ' h']];
    var telHtml = '<div class="mdet-grid">' + tel.map(function (t) { return '<div class="mdet-c"><div class="mdet-l">' + t[0] + '</div><div class="mdet-v">' + escText(String(t[1])) + '</div></div>'; }).join('') + '</div>';
    var cmp;
    if (m.baseline && m.diff) {
      var b = m.baseline, d = m.diff;
      var arrow = function (x) { return x > 0.001 ? '<span style="color:var(--danger)">▲</span>' : x < -0.001 ? '<span style="color:var(--ok)">▼</span>' : '<span style="color:var(--text-mute)">–</span>'; };
      var comp = [
        ['Temperature', b.normal_temperature_c + '°C', (Math.round(m.temp * 10) / 10) + '°C', (d.temperature_c > 0 ? '+' : '') + d.temperature_c + '°C', d.temperature_c],
        ['Vibration', b.normal_vibration_mms + ' mm/s', (Math.round(m.vib * 100) / 100) + ' mm/s', (d.vibration_mms > 0 ? '+' : '') + d.vibration_mms + ' mm/s', d.vibration_mms],
        ['Performance', p(b.performance), p(m.perf), (d.performance_pp > 0 ? '+' : '') + d.performance_pp + ' pp', -d.performance_pp],
        ['Health', p(b.health), p(m.health), (d.health_pp > 0 ? '+' : '') + d.health_pp + ' pp', -d.health_pp],
        ['OEE', b.oee_pct + '%', p(m.oee), (d.oee_pp > 0 ? '+' : '') + d.oee_pp + ' pp', -d.oee_pp]
      ];
      cmp = '<div class="mdet-cmp"><div class="mdet-cr" data-h="1"><span>Metric</span><span>Baseline</span><span>Current</span><span>Δ</span><span></span></div>'
        + comp.map(function (r) { return '<div class="mdet-cr"><span>' + r[0] + '</span><span>' + escText(String(r[1])) + '</span><span>' + escText(String(r[2])) + '</span><span>' + escText(String(r[3])) + '</span><span>' + arrow(r[4]) + '</span></div>'; }).join('') + '</div>';
    } else {
      cmp = '<div class="body-sm" style="color:var(--text-mute)">Baseline-vs-live comparison is available in Live (simulator) mode.</div>';
    }
    var warn = (m.warnings && m.warnings.length) ? '<div class="mdet-warn">' + m.warnings.map(function (w) { return '<span class="mdet-wc">' + escText(w) + '</span>'; }).join('') + '</div>' : '';
    return '<div class="panel"><div class="panel-h"><span class="pnum">d</span><span class="ptitle">Machine detail · live vs baseline</span><span style="margin-left:auto">' + sel + '</span></div>'
      + warn + telHtml
      + '<div class="g2" style="margin-top:12px"><div>' + cmp + '</div>' + chartDiv('mdetChart', buildAskChart(m, 'vibtemp')) + '</div></div>';
  }
  // One chat message bubble; assistant messages with a chart intent embed the best-fit chart.
  function chatBubble(mm, i) {
    if (mm.who === 'u') return '<div class="cmsg" data-who="u"><div class="cbubble" data-who="u">' + escText(mm.text) + '</div></div>';
    var chartMachine = mm.mId ? M.find(function (x) { return x.id === mm.mId; }) : null;
    var it = mm.intent ? INTENTS.find(function (x) { return x.id === mm.intent; }) : null;
    var hasChart = chartMachine && it;
    var inner = '';
    if (hasChart) inner += '<div class="ctag">' + chartMachine.id + ' · ' + it.chart + '</div>';
    inner += '<div class="ctext">' + escText(mm.text) + '</div>';
    if (hasChart) inner += chartDiv('chatchart' + i, buildAskChart(chartMachine, mm.intent));
    return '<div class="cmsg" data-who="a"><div class="cbubble" data-who="a"' + (hasChart ? ' data-chart="1"' : '') + '>' + inner + '</div></div>';
  }
  function viewAsk() {
    var suggestions = [
      L({ en: 'Why is M-04 down?', vi: 'Vì sao M-04 dừng?' }),
      L({ en: 'Compare M-12 to the fleet', vi: 'So sánh M-12 với cả đội' }),
      L({ en: 'Is M-17 overheating?', vi: 'M-17 có quá nhiệt không?' }),
      L({ en: 'OEE breakdown for M-13', vi: 'Phân rã OEE cho M-13' })
    ];
    var log = state.chatMsgs.length
      ? state.chatMsgs.map(function (mm, i) { return chatBubble(mm, i); }).join('')
      : '<div class="cmsg" data-who="a"><div class="cbubble" data-who="a">' + escText(t('chat_greet')) + '</div></div>';
    if (state.chatTyping) log += '<div class="cmsg" data-who="a"><div class="cbubble" data-who="a"><span class="tdots"><span></span><span></span><span></span></span></div></div>';
    var chat = '<div class="panel"><div class="panel-h"><span class="pnum">✦</span><span class="ptitle">' + t('chat_title') + '</span><span class="psub">' + t('chat_sub') + '</span></div>'
      + '<div class="chatlog">' + log + '</div>'
      + '<div class="chips" style="margin-bottom:10px">' + suggestions.map(function (q) { return '<button class="chip" data-act="chat-suggest" data-q="' + escAttr(q) + '">' + escText(q) + '</button>'; }).join('') + '</div>'
      + '<div class="chat-in"><input id="chatq" class="cinput" placeholder="' + escAttr(t('chat_placeholder')) + '" value="' + escAttr(state.chatDraft || '') + '"><button class="btn-1" data-act="chat-send">' + t('chat_send') + '</button></div></div>';

    var guide = '';
    if (guideOn()) guide = '<div class="panel"><div class="panel-h"><span class="pnum">◇</span><span class="ptitle">' + t('guide_title') + '</span><span class="psub">' + L({ en: 'the research behind the picks', vi: 'cơ sở lựa chọn biểu đồ' }) + '</span></div>'
      + '<div class="guide">' + INTENTS.map(function (g) { return '<div class="grow"><span class="gintent">' + g.label + '</span><span class="gchart">' + g.chart + '</span><span class="gwhy">' + g.why + '</span></div>'; }).join('') + '</div></div>';

    return '<div class="stack">' + chat + guide + '</div>';
  }


  function screen() {
    var v = state.view;
    if (v === 'fleet') return viewFleet();
    if (v === 'machines') return viewMachines();
    if (v === 'ask') return viewAsk();
    return viewFleet();
  }

  // ── render + chart measure ────────────────────────────────────────────────
  var app = document.getElementById('app');
  function tSimBanner() {
    if (state.dataMode !== 'sim' || state.simConnected) return '';
    var loading = state.simLoading;
    var msg = loading ? 'Connecting to the fleet simulator…' : ('Simulator not connected — ' + (state.simError || 'no response') + '. Showing last data.');
    return '<div class="simbanner' + (loading ? ' load' : '') + '"><span class="dot" style="background:' + (loading ? 'var(--warn)' : 'var(--danger)') + '"></span>'
      + '<span class="simbanner-t">' + escText(msg) + '</span>'
      + '<button class="btn-ghost simretry" data-act="sim-retry">Retry</button></div>';
  }
  function render() {
    var v = state.view;
    var showKpis = v === 'fleet' || v === 'machines';
    app.innerHTML = '<div class="oc-shell">' + tSide()
      + '<div class="oc-body">' + tHead()
      + '<main class="oc-main">' + tSimBanner() + (showKpis ? tKpis(v) : '') + screen() + '</main>'
      + '</div></div>';
    measureCharts();
  }
  function measureCharts() {
    if (_measuring) return;
    var changed = false;
    var nodes = app.querySelectorAll('[data-chartw]');
    for (var i = 0; i < nodes.length; i++) {
      var key = nodes[i].getAttribute('data-chartw');
      var w = Math.round(nodes[i].clientWidth);
      if (w > 0 && chartW[key] !== w) { chartW[key] = w; changed = true; }
    }
    if (changed) { _measuring = true; render(); _measuring = false; }
  }

  // ── events (delegation on #app) ───────────────────────────────────────────
  function onClick(e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    // Click-away closes the settings popover (anything outside the popover / the gear that opened it).
    if (state.settingsOpen && !(el && (el.getAttribute('data-act') === 'settings'))
        && !(e.target.closest && e.target.closest('[data-stop]'))) {
      state.settingsOpen = false; render();
    }
    if (!el) return;
    var a = el.getAttribute('data-act');
    if (a === 'view') { state.view = el.getAttribute('data-view'); render(); }
    else if (a === 'chat-send') { var ci = document.getElementById('chatq'); chatSend(ci ? ci.value : ''); }
    else if (a === 'chat-suggest') chatSend(el.getAttribute('data-q'));
    else if (a === 'heatfilter') { state.heatFilter = el.getAttribute('data-id'); render(); }
    else if (a === 'settings') { state.settingsOpen = !state.settingsOpen; render(); }
    else if (a === 'theme') { state.settingsOpen = false; setThemeManual(el.getAttribute('data-theme')); }
    else if (a === 'lang') { state.settingsOpen = false; setLang(el.getAttribute('data-lang')); }
    else if (a === 'mode') { state.settingsOpen = false; setDataMode(el.getAttribute('data-mode')); }
    else if (a === 'sim-retry') refreshSim(true);
    else if (a === 'intent') generate(state.askMachine, el.getAttribute('data-id'));
    else if (a === 'mach-metric') { state.machMetric = el.getAttribute('data-id'); render(); }
    else if (a === 'mach-chart') { state.machChart = el.getAttribute('data-id'); render(); }
    else if (a === 'ask-send') { var qi = document.getElementById('askq'); askAI(qi ? qi.value : ''); }
    else if (a === 'ask-suggest') askAI(el.getAttribute('data-q'));
  }
  function onChange(e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var a = el.getAttribute('data-act');
    if (a === 'machine') { var id = el.value; generate(id, pickIntent(M.find(function (x) { return x.id === id; }))); }
    else if (a === 'mach-sel') { state.machSel = el.value; render(); }
  }
  app.addEventListener('click', onClick);
  app.addEventListener('change', onChange);
  app.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !e.target) return;
    if (e.target.id === 'askq') { e.preventDefault(); askAI(e.target.value); }
    else if (e.target.id === 'chatq') { e.preventDefault(); chatSend(e.target.value); }
  });

  var _rz = null;
  window.addEventListener('resize', function () {
    clearTimeout(_rz);
    _rz = setTimeout(function () { for (var k in chartW) delete chartW[k]; render(); }, 120);
  });

  // ── bridge init (optional persistence) ────────────────────────────────────
  var bridge = window.AtriaDash || null;

  // light build: static clock (set once at mount, no per-second timer)

  // ── mount ─────────────────────────────────────────────────────────────────
  applyTheme(state.theme); // apply saved/default theme before first paint
  applyLang(state.lang);   // language-conditional fonts (Inter for EN, Be Vietnam Pro for VI)
  if (bridge) {
    try { bridge.ready(); } catch (e) {}
    // follow Minder's theme ONLY until the user makes a manual choice (then the toggle wins)
    if (bridge.onTheme) { try { bridge.onTheme(function (mode) { if ((mode === 'light' || mode === 'dark') && !readManualTheme()) { applyTheme(mode); render(); } }); } catch (e) {} }
    if (bridge.resize) { try { bridge.resize(960); } catch (e) {} }
  }
  render();
  // Monitor is read-only: it only ever reads the live fleet (no decision history to seed in demo).
  if (state.dataMode === 'sim') { refreshSim(true); startSimPoll(); } // read live fleet + poll every 4s
})();
</script>
</body>
</html>
