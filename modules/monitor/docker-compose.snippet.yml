# Add to docker-compose.yml (same network as `minder`) and run:
#   docker compose up -d --build monitor
# The image contains both the SDK connector and its Module-Federation dashboard.
  monitor:
    build:
      context: .
      dockerfile: modules/monitor/backend/Dockerfile
    ports:
      - "9310:9310"
    environment:
      - MONITOR_PUBLIC_BASE=http://localhost:9310
      - MONITOR_DASHBOARD_DIST=/app/frontend_dist
      - MONITOR_EVENT_POLL_SEC=4
      - MINDER_URL=http://minder:8080
      - MINDER_MODULE_CONNECTOR_URL=http://monitor:9310
      - KEYCLOAK_TOKEN_URL=http://keycloak:8080/realms/minder/protocol/openid-connect/token
      - MINDER_MODULE_CLIENT_ID=minder-module
      - MINDER_MODULE_CLIENT_SECRET=${MINDER_MODULE_CLIENT_SECRET:-CHANGE-ME-IN-ENV}
      - MINDER_MODULE_EMIT_EVENTS=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MINDER_MODEL=${MINDER_MODEL:-gpt-5.4-mini}
      - IIOT_FLEET_URL=${IIOT_FLEET_URL:-http://host.docker.internal:5250}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9310/connector/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
