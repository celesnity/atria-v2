<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tasco · Jarvis Map</title>
  <link rel="stylesheet" href="__base.css" />
  <link rel="preconnect" href="https://rsms.me" crossorigin />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    /* ── Token bridge (same convention as the warehouse dashboard) with the
         Jarvis violet accent from the 1e Copilot Split wireframe. ── */
    :root {
      --ink: 0 0% 0%;
      --canvas: 0 0% 100%;
      --surface-soft: 40 22% 96%;
      --hairline: 0 0% 12%;
      --hairline-soft: 0 0% 88%;
      --muted-ink: 0 0% 38%;
      --motion-fast: 160ms;
      --motion-base: 240ms;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      /* Jarvis identity accent (violet, per design) */
      --acc-hi: #9b82e8;
      --acc: #7a5fd0;
      --acc-lo: #5f47ab;
      --acc-soft: 258 47% 96%;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: 0 0% 96%;
        --canvas: 222 18% 11%;
        --surface-soft: 222 14% 16%;
        --hairline: 0 0% 70%;
        --hairline-soft: 222 10% 26%;
        --muted-ink: 220 8% 62%;
        --acc-hi: #ab94f0;
        --acc: #8a70dd;
        --acc-lo: #6a52bd;
        --acc-soft: 258 25% 20%;
      }
    }
    html[data-theme="light"] {
      --ink: 0 0% 0%; --canvas: 0 0% 100%; --surface-soft: 40 22% 96%;
      --hairline: 0 0% 12%; --hairline-soft: 0 0% 88%; --muted-ink: 0 0% 38%;
      --acc-hi: #9b82e8; --acc: #7a5fd0; --acc-lo: #5f47ab; --acc-soft: 258 47% 96%;
    }
    html[data-theme="dark"] {
      --ink: 0 0% 96%; --canvas: 222 18% 11%; --surface-soft: 222 14% 16%;
      --hairline: 0 0% 70%; --hairline-soft: 222 10% 26%; --muted-ink: 220 8% 62%;
      --acc-hi: #ab94f0; --acc: #8a70dd; --acc-lo: #6a52bd; --acc-soft: 258 25% 20%;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: 'Inter Variable', 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: hsl(var(--ink));
      background: hsl(var(--canvas));
    }

    .app { display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
    @media (max-width: 760px) { .app { grid-template-columns: 1fr; } .copilot { display: none; } }

    /* ── Map pane ─────────────────────────────────────────────────────── */
    .map-pane { position: relative; min-width: 0; }
    #map { position: absolute; inset: 0; background: #dfe7ea; }

    .overlay {
      position: absolute; z-index: 900; top: 12px; left: 12px;
      display: flex; flex-direction: column; gap: 8px; width: 280px; max-width: calc(100% - 70px);
    }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: hsl(var(--canvas)); border: 1.5px solid hsl(var(--hairline));
      border-radius: 999px; padding: 8px 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }
    .search-box input {
      flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
      font: inherit; font-size: 13.5px; color: hsl(var(--ink));
    }
    .search-box .clear-btn {
      border: 0; background: transparent; color: hsl(var(--muted-ink));
      font-size: 15px; cursor: pointer; padding: 0 2px; display: none;
    }
    .legend {
      display: flex; flex-wrap: wrap; gap: 4px; max-height: 132px; overflow-y: auto;
      background: hsl(var(--canvas) / .92); border: 1px solid hsl(var(--hairline-soft));
      border-radius: 12px; padding: 6px;
    }
    .cat-chip {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1.2px solid hsl(var(--hairline-soft)); border-radius: 999px;
      padding: 1px 8px; font-size: 11.5px; cursor: pointer; user-select: none;
      background: hsl(var(--canvas)); color: hsl(var(--ink));
      transition: opacity var(--motion-fast);
    }
    .cat-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .cat-chip.off { opacity: .38; }
    .count-line {
      font-size: 11.5px; color: hsl(var(--muted-ink));
      background: hsl(var(--canvas) / .92); border-radius: 8px; padding: 3px 9px;
      align-self: flex-start;
    }

    /* POI pin (ported from the MapMinder Leaflet app) */
    .poi-divicon { background: transparent; border: 0; }
    .poi-pin {
      width: 26px; height: 26px; border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg); border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
      display: flex; align-items: center; justify-content: center;
    }
    .poi-emoji { transform: rotate(45deg); font-size: 12px; line-height: 1; }

    /* Numbered violet AI pin (design: violet pins = AI's picks) */
    .ai-divicon { background: transparent; border: 0; }
    .ai-pin {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--acc); border: 2px solid #fff; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12.5px; font-weight: 600;
      box-shadow: 0 2px 8px rgba(122, 95, 208, .5);
    }
    .ai-pin-ring {
      position: absolute; inset: -7px; border: 2px solid var(--acc);
      border-radius: 50%; animation: jping 1.8s ease-out infinite; pointer-events: none;
    }
    @keyframes jping { from { transform: scale(.55); opacity: .8; } to { transform: scale(1.5); opacity: 0; } }

    .poi-popup b { font-size: 13px; }
    .poi-popup { font-size: 12px; line-height: 1.45; }
    .poi-popup .rating { color: #b98f2e; }

    /* ── Copilot panel (1e: permanent right chat panel) ───────────────── */
    .copilot {
      display: flex; flex-direction: column; min-height: 0;
      border-left: 1.5px solid var(--acc);
      background: hsl(var(--canvas));
    }
    .copilot-head {
      flex: none; display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; border-bottom: 1px solid hsl(var(--hairline-soft));
      color: var(--acc); font-weight: 600; font-size: 15px;
    }
    .copilot-head .status {
      margin-left: auto; font-size: 10.5px; font-weight: 400;
      color: hsl(var(--muted-ink));
    }
    .msgs {
      flex: 1; min-height: 0; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { max-width: 88%; border-radius: 12px; padding: 8px 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user {
      align-self: flex-end; background: hsl(var(--ink)); color: hsl(var(--canvas));
      border-bottom-right-radius: 3px;
    }
    .msg.ai {
      align-self: flex-start; background: hsl(var(--acc-soft)); color: hsl(var(--ink));
      border-bottom-left-radius: 3px;
    }
    .msg.ai.offline { opacity: .75; }
    .msg .src-tag { display: block; margin-top: 5px; font-size: 10px; color: hsl(var(--muted-ink)); }
    .pin-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .pin-chip {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1.2px solid var(--acc); color: var(--acc); background: hsl(var(--canvas));
      border-radius: 999px; padding: 2px 9px; font-size: 11.5px; cursor: pointer;
      transition: background var(--motion-fast), color var(--motion-fast);
    }
    .pin-chip:hover { background: var(--acc); color: #fff; }
    .pin-chip .n {
      width: 15px; height: 15px; border-radius: 50%; background: var(--acc); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 9.5px; font-weight: 700; flex: none;
    }
    .pin-chip:hover .n { background: #fff; color: var(--acc); }

    .typing { display: flex; gap: 4px; padding: 4px 8px; align-self: flex-start; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--acc);
      animation: jdots 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes jdots { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

    .composer {
      flex: none; display: flex; gap: 8px; padding: 10px 12px;
      border-top: 1px solid hsl(var(--hairline-soft));
    }
    .composer input {
      flex: 1; min-width: 0; border: 1.5px solid hsl(var(--hairline));
      border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px;
      background: hsl(var(--canvas)); color: hsl(var(--ink)); outline: none;
    }
    .composer input:focus { border-color: var(--acc); }
    .composer button {
      flex: none; width: 38px; height: 38px; border-radius: 50%;
      border: 1.6px solid var(--acc); background: var(--acc); color: #fff;
      font-size: 16px; cursor: pointer; transition: background var(--motion-fast);
    }
    .composer button:disabled { opacity: .5; cursor: default; }

    /* Leaflet chrome in dark mode: dim the tiles slightly */
    html[data-theme="dark"] .leaflet-tile, body.theme-dark-auto .leaflet-tile { filter: brightness(.82) contrast(1.05); }
  </style>
</head>
<body>
  <div class="app">
    <div class="map-pane">
      <div id="map"></div>
      <div class="overlay">
        <div class="search-box">
          <span style="color:hsl(var(--muted-ink));font-size:13px">&#128269;</span>
          <input id="search" type="text" placeholder="Search a place… (vd: cafe q1)" autocomplete="off" />
          <button id="clearSearch" class="clear-btn" title="Clear">&#10005;</button>
        </div>
        <div id="legend" class="legend"></div>
        <div id="count" class="count-line">Loading map data…</div>
      </div>
    </div>

    <div class="copilot">
      <div class="copilot-head">&#10022; Jarvis <span class="status" id="jarvisStatus"></span></div>
      <div id="msgs" class="msgs">
        <div class="msg ai">Xin ch&#224;o! T&#244;i l&#224; Jarvis &#8212; h&#7887;i t&#244;i v&#7873; &#273;&#7883;a &#273;i&#7875;m &#7903; TP.HCM, H&#224; N&#7897;i hay &#272;&#224; N&#7861;ng. / Ask me about places in Vietnam.</div>
      </div>
      <div class="composer">
        <input id="chatInput" type="text" placeholder="Ask or type a place…" autocomplete="off" />
        <button id="chatSend" title="Send">&#10022;</button>
      </div>
    </div>
  </div>

  <script src="__bridge.js"></script>
  <script src="vendor/leaflet/leaflet-global.js"></script>
  <script>
  (function () {
    'use strict';

    /* ── Normalization: JS mirror of scripts/_data.py (fold + longest-ngram
         abbreviation expansion). Python is normative; this only powers the
         live keystroke filter — Enter always asks search.py. ── */
    function fold(s) {
      if (!s) return '';
      s = String(s).toLowerCase().replace(/đ/g, 'd');
      s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      return s.replace(/\s+/g, ' ').trim();
    }
    var ABBREV = { terms: {}, max_ngram: 1 };
    function expandAbbrev(folded) {
      var tokens = folded.split(' ').filter(Boolean), out = [], i = 0;
      while (i < tokens.length) {
        var matched = false;
        for (var n = Math.min(ABBREV.max_ngram, tokens.length - i); n > 0; n--) {
          var gram = tokens.slice(i, i + n).join(' ');
          if (ABBREV.terms[gram]) { out.push(ABBREV.terms[gram]); i += n; matched = true; break; }
        }
        if (!matched) { out.push(tokens[i]); i += 1; }
      }
      return out.join(' ');
    }

    /* ── State ── */
    var CATS = {};
    var items = [];            // {marker, poi, keyBlob} — every dataset POI
    var enabled = {};          // category -> bool
    var liveFilter = '';       // folded+expanded live search text
    var searchIds = null;      // Set(poi_id) from an authoritative Enter-search, or null
    var aiLayer = null;        // numbered violet AI pins
    var sessionId = null;      // Jarvis chat session
    var busy = false;

    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) {
      var d = document.createElement('div'); d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    };

    /* ── Map (ported from MapMinder app.js, global build) ── */
    var map = new L.LeafletMap('map', {
      center: [16.0, 106.5], zoom: 6, minZoom: 4, maxZoom: 19, zoomControl: false,
    });
    new L.Control.Zoom({ position: 'bottomright' }).addTo(map);
    new L.TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);
    aiLayer = new L.LayerGroup().addTo(map);

    function makeIcon(cat) {
      var c = CATS[cat] || { color: '#555', emoji: '' };
      return new L.DivIcon({
        html: '<div class="poi-pin" style="background:' + c.color + '"><span class="poi-emoji">' + (c.emoji || '') + '</span></div>',
        className: 'poi-divicon', iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24],
      });
    }
    function makeAiIcon(n) {
      return new L.DivIcon({
        html: '<div style="position:relative"><div class="ai-pin-ring"></div><div class="ai-pin">' + n + '</div></div>',
        className: 'ai-divicon', iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -16],
      });
    }
    function popupHtml(p) {
      var c = CATS[p.category] || { label: p.category };
      var stars = p.rating ? '<span class="rating">&#9733; ' + esc(p.rating) + '</span> &middot; ' : '';
      return '<div class="poi-popup"><b>' + esc(p.name) + '</b><br>' +
        '<span>' + (c.emoji || '') + ' ' + esc(c.label || p.category) + '</span><br>' +
        stars + '<small>' + esc(p.address || '') + (p.city ? ' &middot; ' + esc(p.city) : '') + '</small></div>';
    }

    /* ── Visibility: category chips + live filter + authoritative search ── */
    function refresh() {
      var shown = 0;
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var ok = enabled[it.poi.category];
        if (ok && searchIds) ok = searchIds.has(it.poi.poi_id);
        if (ok && liveFilter) ok = it.keyBlob.indexOf(liveFilter) !== -1;
        if (ok) { shown++; if (!map.hasLayer(it.marker)) map.addLayer(it.marker); }
        else if (map.hasLayer(it.marker)) { map.removeLayer(it.marker); }
      }
      $('count').textContent = shown + (shown === 1 ? ' place' : ' places') + ' shown';
    }

    function buildLegend() {
      var legend = $('legend');
      legend.innerHTML = '';
      Object.keys(CATS).forEach(function (key) {
        enabled[key] = true;
        var c = CATS[key];
        var chip = document.createElement('span');
        chip.className = 'cat-chip';
        chip.innerHTML = '<span class="dot" style="background:' + c.color + '"></span>' +
          (c.emoji || '') + ' ' + esc(c.label);
        chip.title = c.label_vi || c.label;
        chip.addEventListener('click', function () {
          enabled[key] = !enabled[key];
          chip.classList.toggle('off', !enabled[key]);
          refresh();
        });
        legend.appendChild(chip);
      });
    }

    /* ── Authoritative search (Enter) ── */
    function runSearch(q) {
      AtriaDash.json('search.py', ['search', q, '--limit', '25']).then(function (res) {
        if (res.error) { AtriaDash.toast({ message: res.error, severity: 'error' }); return; }
        var results = res.results || [];
        searchIds = new Set(results.map(function (r) { return r.poi_id; }));
        liveFilter = '';
        refresh();
        if (results.length) {
          var b = new L.LatLngBounds(results.map(function (r) { return [r.lat, r.lng]; }));
          map.fitBounds(b, { padding: [46, 46], maxZoom: 15 });
        } else {
          AtriaDash.toast({ message: 'No places found for "' + q + '"', severity: 'info' });
        }
        $('clearSearch').style.display = 'inline';
      }).catch(function (e) {
        AtriaDash.toast({ message: 'Search failed: ' + e, severity: 'error' });
      });
    }
    function clearSearch() {
      searchIds = null; liveFilter = '';
      $('search').value = '';
      $('clearSearch').style.display = 'none';
      refresh();
    }
    $('search').addEventListener('input', function (e) {
      searchIds = null;
      $('clearSearch').style.display = e.target.value ? 'inline' : 'none';
      liveFilter = expandAbbrev(fold(e.target.value));
      refresh();
    });
    $('search').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.value.trim()) runSearch(e.target.value.trim());
    });
    $('clearSearch').addEventListener('click', clearSearch);

    /* ── AI pins + map actions ── */
    var activePins = [];       // [{n, poi_id, name}] — echoed back to jarvis_chat
    function clearAiPins() { aiLayer.clearLayers(); activePins = []; }
    var aiMarkerByN = {};
    function applyActions(actions) {
      (actions || []).forEach(function (a) {
        if (a.type === 'pins' && a.items && a.items.length) {
          clearAiPins(); aiMarkerByN = {};
          a.items.forEach(function (it) {
            var m = new L.Marker([it.lat, it.lng], { icon: makeAiIcon(it.n), title: it.name, zIndexOffset: 1000 });
            var detail = it.detail ? '<small>' + esc(it.detail) + '</small>' : '';
            var stars = it.rating ? '<span class="rating">&#9733; ' + esc(it.rating) + '</span><br>' : '';
            m.bindPopup(new L.Popup().setContent(
              '<div class="poi-popup"><b>' + it.n + '. ' + esc(it.name) + '</b><br>' + stars + detail + '</div>'));
            aiLayer.addLayer(m);
            aiMarkerByN[it.n] = m;
            activePins.push({ n: it.n, poi_id: it.poi_id, name: it.name });
          });
          if (a.fit !== false) {
            var b = new L.LatLngBounds(a.items.map(function (it) { return [it.lat, it.lng]; }));
            map.fitBounds(b, { padding: [46, 46], maxZoom: 15 });
          }
        } else if (a.type === 'focus' && a.lat != null) {
          map.flyTo([a.lat, a.lng], a.zoom || 15);
        } else if (a.type === 'clear') {
          if (a.what === 'ai' || a.what === 'all') clearAiPins();
        }
      });
    }

    /* ── Chat panel ── */
    function addMsg(kind, text, extra) {
      var div = document.createElement('div');
      div.className = 'msg ' + kind + (extra && extra.offline ? ' offline' : '');
      div.textContent = text;
      if (extra && extra.pins && extra.pins.length) {
        var chips = document.createElement('div');
        chips.className = 'pin-chips';
        extra.pins.forEach(function (p) {
          var chip = document.createElement('span');
          chip.className = 'pin-chip';
          chip.innerHTML = '<span class="n">' + p.n + '</span>' + esc(p.name);
          chip.addEventListener('click', function () {
            var m = aiMarkerByN[p.n];
            if (m) { map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 14)); m.openPopup(); }
          });
          chips.appendChild(chip);
        });
        div.appendChild(chips);
      }
      if (extra && extra.srcTag) {
        var tag = document.createElement('span');
        tag.className = 'src-tag';
        tag.textContent = extra.srcTag;
        div.appendChild(tag);
      }
      $('msgs').appendChild(div);
      $('msgs').scrollTop = $('msgs').scrollHeight;
      return div;
    }
    function showTyping() {
      var t = document.createElement('div');
      t.className = 'typing'; t.id = 'typing';
      t.innerHTML = '<span></span><span></span><span></span>';
      $('msgs').appendChild(t);
      $('msgs').scrollTop = $('msgs').scrollHeight;
    }
    function hideTyping() { var t = $('typing'); if (t) t.remove(); }

    function askJarvis(text) {
      if (busy) return;
      busy = true;
      $('chatSend').disabled = true;
      addMsg('user', text);
      showTyping();
      var c = map.getCenter();
      var payload = {
        message: text,
        chat_session_id: sessionId,
        viewport: { lat: c.lat, lng: c.lng, zoom: map.getZoom() },
        pins: activePins,
      };
      AtriaDash.json('jarvis_chat.py', [], {
        stdin: JSON.stringify(payload), timeout_ms: 110000,
      }).then(function (res) {
        hideTyping();
        if (res.session_id) sessionId = res.session_id;
        var pins = [];
        (res.map_actions || []).forEach(function (a) {
          if (a.type === 'pins') pins = pins.concat(a.items || []);
        });
        if (res.error && !res.reply) {
          addMsg('ai', 'Jarvis is unreachable: ' + res.error, { offline: true });
        } else {
          applyActions(res.map_actions);
          addMsg('ai', res.reply || '(no reply)', {
            pins: pins,
            srcTag: res.source === 'fast' ? 'instant · local search' : null,
          });
        }
      }).catch(function (e) {
        hideTyping();
        addMsg('ai', 'Jarvis error: ' + e, { offline: true });
      }).then(function () {
        busy = false;
        $('chatSend').disabled = false;
        $('chatInput').focus();
      });
    }
    $('chatSend').addEventListener('click', function () {
      var v = $('chatInput').value.trim();
      if (v) { $('chatInput').value = ''; askJarvis(v); }
    });
    $('chatInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var v = e.target.value.trim();
        if (v) { e.target.value = ''; askJarvis(v); }
      }
    });

    /* ── Boot: bridge context + dataset ── */
    AtriaDash.onTheme(function (theme) {
      document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
    });
    AtriaDash.onContext(function (ctx) {
      // dashboard context session — chat keeps its own dedicated session id
      $('jarvisStatus').textContent = '';
    });
    AtriaDash.onChange(function () { /* data files changed -> reload dataset */ loadData(); });

    function loadData() {
      AtriaDash.json('search.py', ['pois']).then(function (data) {
        if (data.error) { $('count').textContent = data.error; return; }
        CATS = data.categories || {};
        if (data.abbreviations) ABBREV = data.abbreviations;
        // rebuild markers
        items.forEach(function (it) { if (map.hasLayer(it.marker)) map.removeLayer(it.marker); });
        items = [];
        (data.pois || []).forEach(function (p) {
          var m = new L.Marker([p.lat, p.lng], { icon: makeIcon(p.category), title: p.name });
          m.bindPopup(new L.Popup().setContent(popupHtml(p)));
          var blob = [p.q.name, p.q.name_en].concat(p.q.aliases || []).join(' | ');
          items.push({ marker: m, poi: p, keyBlob: blob });
        });
        buildLegend();
        refresh();
      }).catch(function (e) {
        $('count').textContent = 'Failed to load map data';
        AtriaDash.toast({ message: 'Data load failed: ' + e, severity: 'error' });
      });
    }

    AtriaDash.ready();
    loadData();
    setTimeout(function () { map.invalidateSize(); }, 250);
    window.addEventListener('resize', function () { map.invalidateSize(); });
  })();
  </script>
</body>
</html>
