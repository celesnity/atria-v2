<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Tasco · Jarvis Map</title>
  <link rel="stylesheet" href="__base.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="blocks/v4.css" />
  <style>
    /* ── Marlow Bay design tokens (claude.ai/design "Modern map application
         design"). Explicit data-theme beats the system preference: the media
         block is guarded with :not([data-theme=light]) and the explicit dark
         block is declared last. ── */
    :root {
      --bg: #f6f1e8; --surface: #fffdf9; --surface2: #f4ecdf;
      --ink: #43382e; --muted: #96897a; --line: #e8dfd0;
      --accent: #e2683f; --accent-ink: #c4512b; --accent-soft: #fbe9e0;
      --ai: #8b6fd8; --ai-ink: #6f54bd; --ai-soft: #f1ecfb;
      --map: #f0e9da; --good: #4f9464; --warn: #c07f2c; --star: #dd9c33;
      --sh: 0 12px 32px rgba(94, 72, 50, .14);
      --sh2: 0 4px 14px rgba(94, 72, 50, .10);
      --pin-border: #fff;
      --tile-filter: sepia(.18) saturate(.82) brightness(1.03);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1f1b16; --surface: #2a241d; --surface2: #332c23;
        --ink: #f2eadf; --muted: #a2937f; --line: #3d352a;
        --accent: #f08159; --accent-ink: #f49a78; --accent-soft: #412e25;
        --ai: #a78ee8; --ai-ink: #c0aef2; --ai-soft: #352c48;
        --map: #252019; --good: #7fbf8e; --warn: #d89a4a; --star: #e5ad4d;
        --sh: 0 12px 32px rgba(0, 0, 0, .45);
        --sh2: 0 4px 14px rgba(0, 0, 0, .35);
        --pin-border: #2a241d;
        --tile-filter: brightness(.75) contrast(1.06) saturate(.7);
      }
    }
    :root[data-theme="dark"] {
      --bg: #1f1b16; --surface: #2a241d; --surface2: #332c23;
      --ink: #f2eadf; --muted: #a2937f; --line: #3d352a;
      --accent: #f08159; --accent-ink: #f49a78; --accent-soft: #412e25;
      --ai: #a78ee8; --ai-ink: #c0aef2; --ai-soft: #352c48;
      --map: #252019; --good: #7fbf8e; --warn: #d89a4a; --star: #e5ad4d;
      --sh: 0 12px 32px rgba(0, 0, 0, .45);
      --sh2: 0 4px 14px rgba(0, 0, 0, .35);
      --pin-border: #2a241d;
      --tile-filter: brightness(.75) contrast(1.06) saturate(.7);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--ink); background: var(--bg);
      font-size: 13.5px;
      transition: background-color .35s;
    }
    a { color: var(--accent); }
    a:hover { color: var(--accent-ink); }
    ::selection { background: var(--accent-soft); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    button { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(.88) translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes ping { from { transform: scale(.5); opacity: .8; } to { transform: scale(2.2); opacity: 0; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes dots { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
    @keyframes pinDrop { from { opacity: 0; transform: translateY(-9px); } to { opacity: 1; transform: none; } }
    @keyframes orbP { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

    .app { position: relative; width: 100vw; height: 100vh; background: var(--bg); overflow: hidden; }

    /* ── Floating agent panel (v3: draggable + collapsible, over a full-bleed map) ── */
    .agent-panel {
      position: absolute; left: 16px; top: 16px; z-index: 1005;
      width: min(400px, calc(100vw - 32px));
      height: min(624px, calc(100vh - 32px));
      display: flex; flex-direction: column; min-height: 0;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 22px; box-shadow: var(--sh); overflow: hidden;
      animation: scaleIn .25s ease both; transition: background-color .35s;
    }
    .agent-panel.collapsed { display: none; }
    .ap-head {
      flex: none; display: flex; align-items: center; gap: 9px;
      padding: 13px 14px 11px; cursor: grab; user-select: none;
      border-bottom: 1px solid var(--line); touch-action: none;
    }
    .ap-head:active { cursor: grabbing; }
    .ap-orb {
      width: 34px; height: 34px; flex: none; border-radius: 50%; color: #fff; font-size: 16px;
      background: radial-gradient(circle at 32% 28%, #b9a5ec, var(--ai) 70%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(122, 95, 208, .4); animation: orbP 3s ease-in-out infinite;
    }
    .ap-titles { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .ap-brand { font: 700 19px 'Baloo 2', ui-rounded, system-ui; color: var(--ink); line-height: 1.15; }
    .ap-brand em { font-style: normal; color: var(--accent); }
    .ap-status { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .locale-pill {
      font-size: 10.5px; font-weight: 700; color: var(--muted); flex: none;
      background: var(--surface2); border: 1px solid var(--line);
      border-radius: 999px; padding: 3px 9px;
    }
    .ap-min {
      flex: none; width: 27px; height: 27px; border-radius: 50%; border: 0;
      background: var(--surface2); color: var(--muted); font-size: 17px; line-height: 1; cursor: pointer;
      transition: color .2s, background-color .2s;
    }
    .ap-min:hover { color: var(--ink); background: var(--line); }
    .ap-tabs { flex: none; display: flex; align-items: center; gap: 6px; padding: 9px 12px 3px; }
    .ap-tab {
      border: 1.4px solid var(--line); background: var(--surface); color: var(--muted);
      border-radius: 999px; padding: 5px 13px; font-size: 12px; font-weight: 700; cursor: pointer;
      transition: color .2s, border-color .2s, background-color .2s;
    }
    .ap-tab:hover { color: var(--ink); }
    .ap-tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .ap-tab-reset {
      margin-left: auto; width: 28px; height: 28px; border-radius: 50%;
      border: 1.4px solid var(--line); background: var(--surface); color: var(--muted);
      font-size: 14px; cursor: pointer; transition: color .2s;
    }
    .ap-tab-reset:hover { color: var(--ink); }
    .ap-mode { display: flex; flex-direction: column; flex: 1; min-height: 0; }

    .omnibox {
      display: flex; align-items: center; gap: 8px; margin: 4px 16px 10px;
      background: var(--surface2); border: 1.5px solid var(--line);
      border-radius: 999px; padding: 9px 14px;
      transition: border-color .2s, background-color .35s;
    }
    .omnibox:focus-within { border-color: var(--ai); }
    .omnibox .glyph { color: var(--ai); font-size: 14px; flex: none; }
    .omnibox input {
      flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
      font: 600 13.5px 'Nunito', sans-serif; color: var(--ink);
    }
    .omnibox input::placeholder { color: var(--muted); font-weight: 400; }
    .omnibox .clear-btn {
      border: 0; background: transparent; color: var(--muted);
      font-size: 14px; cursor: pointer; padding: 0 2px; display: none; line-height: 1;
    }
    .omnibox .clear-btn:hover { color: var(--ink); }

    .chips {
      display: flex; flex-wrap: nowrap; gap: 6px; padding: 0 16px 10px;
      overflow-x: auto; overflow-y: hidden;
    }
    .cat-chip {
      display: inline-flex; align-items: center; gap: 5px; flex: none; white-space: nowrap;
      border: 1.5px solid var(--line); border-radius: 999px;
      padding: 4px 11px; font-size: 11.5px; font-weight: 700;
      cursor: pointer; user-select: none;
      background: var(--surface); color: var(--muted);
      transition: transform .15s, background-color .2s, color .2s;
    }
    .cat-chip:hover { transform: translateY(-1px); }
    .cat-chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .cat-chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

    .divider { border-top: 1px solid var(--line); margin: 0 16px; }

    .side-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
    .list-head {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 12px 16px 6px;
    }
    #listTitle { font: 700 15px 'Baloo 2', ui-rounded, system-ui; color: var(--ink); }
    .count-line { font-size: 11px; color: var(--muted); }

    .poi-card {
      display: flex; gap: 11px; align-items: center;
      padding: 9px 10px; margin: 0 8px; border-radius: 14px; cursor: pointer;
      animation: fadeUp .3s ease both;
      transition: background-color .15s;
    }
    .poi-card:hover { background: var(--surface2); }
    .poi-thumb {
      width: 54px; height: 54px; flex: none; border-radius: 12px;
      border: 1px solid var(--line);
      background: repeating-linear-gradient(45deg, var(--surface2) 0 7px, var(--bg) 7px 14px);
      display: flex; align-items: center; justify-content: center; font-size: 21px;
    }
    .poi-body { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .poi-name-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .poi-name {
      font-weight: 800; font-size: 14.5px; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .poi-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .poi-meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .poi-meta .star { color: var(--star); }
    .poi-open { font-size: 11px; color: var(--good); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .poi-chevron { color: var(--muted); font-size: 15px; flex: none; }

    /* Top-3 / extras divider (mirrors the Jarvis reply grouping) */
    .list-divider {
      display: flex; align-items: center; gap: 8px;
      margin: 11px 16px 5px; font-size: 10px; font-weight: 800;
      letter-spacing: .4px; text-transform: uppercase; color: var(--muted);
      animation: fadeUp .3s ease both;
    }
    .list-divider::before, .list-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--line);
    }

    .empty-card {
      margin: 10px 16px; padding: 18px 14px; text-align: center;
      border: 1.6px dashed var(--line); border-radius: 16px; color: var(--muted);
      font-size: 12.5px; animation: fadeUp .3s ease both;
    }
    .empty-card button {
      margin-top: 10px; border: 1.4px solid var(--ai); background: var(--surface);
      color: var(--ai-ink); border-radius: 999px; padding: 6px 14px;
      font-size: 12px; font-weight: 700; cursor: pointer;
      transition: background-color .2s, color .2s;
    }
    .empty-card button:hover { background: var(--ai); color: #fff; }

    /* Detail view */
    #detailView { padding: 10px 16px 16px; animation: fadeUp .3s ease both; }
    .back-pill {
      border: 1.5px solid var(--line); background: var(--surface); color: var(--muted);
      border-radius: 999px; padding: 4px 12px; font-size: 11.5px; font-weight: 700;
      cursor: pointer; transition: color .2s, transform .15s;
    }
    .back-pill:hover { color: var(--ink); transform: translateY(-1px); }
    .detail-hero {
      height: 148px; border-radius: 18px; border: 1px solid var(--line);
      background: repeating-linear-gradient(45deg, var(--surface2) 0 9px, var(--bg) 9px 18px);
      display: flex; align-items: center; justify-content: center; font-size: 46px;
      margin: 12px 0;
    }
    .detail-name { font: 700 23px 'Baloo 2', ui-rounded, system-ui; color: var(--ink); line-height: 1.2; }
    .detail-name-en { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .detail-meta { font-size: 12.5px; color: var(--muted); margin-top: 7px; }
    .detail-meta .star { color: var(--star); }
    .detail-open { font-size: 12.5px; color: var(--good); margin-top: 5px; }
    .detail-addr { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
    .tag-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 11px; }
    .tag-chip {
      background: var(--surface2); border: 1px solid var(--line); color: var(--muted);
      border-radius: 999px; padding: 3px 10px; font-size: 10.5px; font-weight: 700;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tag-chip.cat { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }
    .detail-actions { display: flex; gap: 8px; margin-top: 14px; }
    .btn-accent {
      flex: 1; border: 0; background: var(--accent); color: #fff;
      border-radius: 999px; padding: 9px 12px; font-size: 12.5px; font-weight: 800;
      cursor: pointer; transition: background-color .2s, transform .15s;
    }
    .btn-accent:hover { background: var(--accent-ink); transform: translateY(-1px); }
    .btn-ai {
      flex: 1; border: 1.4px solid var(--ai); background: var(--ai-soft); color: var(--ai-ink);
      border-radius: 999px; padding: 9px 12px; font-size: 12.5px; font-weight: 800;
      cursor: pointer; transition: background-color .2s, color .2s, transform .15s;
    }
    .btn-ai:hover { background: var(--ai); color: #fff; transform: translateY(-1px); }

    .side-foot {
      flex: none; padding: 9px 16px; border-top: 1px solid var(--line);
      font-size: 10px; color: var(--muted);
    }

    /* ── Map pane (full-bleed; the agent panel floats over it) ─────────── */
    .map-pane { position: absolute; inset: 0; overflow: hidden; }
    #map { position: absolute; inset: 0; background: var(--map); }
    /* Tint the whole tile PANE once (one composited layer) rather than every
       512@2x tile individually — same warm look, far cheaper to repaint on
       pan/zoom. Markers live in a separate pane, so they stay untinted. */
    .leaflet-tile-pane { filter: var(--tile-filter); }
    .leaflet-container { background: var(--map); font-family: 'Nunito', sans-serif; }

    .map-btn {
      width: 36px; height: 36px; border-radius: 12px;
      border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
      box-shadow: var(--sh2); cursor: pointer; font-size: 16px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s, background-color .2s;
    }
    .map-btn:hover { transform: translateY(-1px); background: var(--surface2); }
    .map-ctl-top {
      position: absolute; top: 14px; right: 14px; z-index: 1001;
      display: flex; flex-direction: column; gap: 6px;
    }
    .zoom-ctl {
      position: absolute; right: 14px; bottom: 96px; z-index: 1001;
      display: flex; flex-direction: column; gap: 6px;
    }

    /* Leaflet chrome themed */
    .leaflet-popup-content-wrapper {
      background: var(--surface); color: var(--ink);
      border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--sh);
    }
    .leaflet-popup-tip { background: var(--surface); }
    .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
    .leaflet-control-attribution {
      background: var(--surface); color: var(--muted); font-size: 10px;
      border-radius: 8px 0 0 0;
    }
    .leaflet-control-attribution a { color: var(--accent-ink); }

    .poi-popup { font-size: 12px; line-height: 1.5; font-family: 'Nunito', sans-serif; }
    .poi-popup b { font-size: 13.5px; font-weight: 800; }
    .poi-popup .rating { color: var(--star); font-weight: 700; }
    .poi-popup .detail-link {
      display: inline-block; margin-top: 6px; border: 1.3px solid var(--accent);
      background: transparent; color: var(--accent-ink); border-radius: 999px;
      padding: 2px 10px; font-size: 11px; font-weight: 800; cursor: pointer;
      transition: background-color .2s, color .2s;
    }
    .poi-popup .detail-link:hover { background: var(--accent); color: #fff; }

    /* POI teardrop pin (design: 27px, 50/50/50/4 radius) */
    .poi-divicon { background: transparent; border: 0; }
    .poi-pin {
      width: 27px; height: 27px; border-radius: 50% 50% 50% 4px;
      transform: rotate(-45deg); border: 2.5px solid var(--pin-border);
      box-shadow: 0 2px 4px rgba(0, 0, 0, .3);
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s;
    }
    .poi-pin:hover { transform: rotate(-45deg) scale(1.15); }
    .poi-emoji { transform: rotate(45deg); font-size: 12px; line-height: 1; }

    /* Numbered AI pin (Jarvis picks) */
    .ai-divicon { background: transparent; border: 0; }
    .ai-wrap { position: relative; animation: pinDrop .45s ease both; }
    .ai-pin {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--ai); border: 2px solid var(--pin-border); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12.5px; font-weight: 800;
      box-shadow: 0 2px 8px rgba(139, 111, 216, .5);
    }
    .ai-pin-ring {
      position: absolute; inset: -7px; border: 2px solid var(--ai);
      border-radius: 50%; animation: ping 1.8s ease-out infinite; pointer-events: none;
    }

    /* ── Anchor marker (proximity/navigation reference) — rust, distinct from
          category teardrops and violet AI pins ── */
    .anchor-divicon { background: transparent; border: 0; }
    .anchor-dot {
      position: relative; width: 15px; height: 15px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--pin-border);
      box-shadow: 0 2px 7px rgba(226, 104, 63, .55);
    }
    .anchor-dot::after {
      content: ''; position: absolute; inset: -8px; border: 2px solid var(--accent);
      border-radius: 50%; animation: ping 1.8s ease-out infinite; pointer-events: none;
    }

    /* ── User GPS marker ("you are here") — blue, distinct from every other pin ── */
    .user-divicon { background: transparent; border: 0; }
    .user-dot {
      position: relative; width: 16px; height: 16px; border-radius: 50%;
      background: #2f7fe0; border: 2.5px solid #fff;
      box-shadow: 0 0 0 2px rgba(47, 127, 224, .45), 0 2px 8px rgba(47, 127, 224, .5);
    }
    .user-dot::after {
      content: ''; position: absolute; inset: -9px; border: 2px solid #2f7fe0;
      border-radius: 50%; animation: ping 1.8s ease-out infinite; pointer-events: none;
    }
    .map-btn.locating { color: var(--accent-ink); }
    .map-btn.on { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }

    /* ── Jarvis popover + FAB ───────────────────────────────────────── */
    #jarvisFab {
      position: absolute; right: 16px; bottom: 18px; z-index: 1002;
      width: 56px; height: 56px; border-radius: 50%; border: 0;
      background: var(--ai); color: #fff; font-size: 22px; cursor: pointer;
      box-shadow: 0 10px 26px rgba(122, 95, 208, .45);
      animation: bob 4s ease-in-out infinite;
      transition: background-color .2s;
    }
    #jarvisFab:hover { background: var(--ai-ink); }
    #jarvisFab .unread {
      position: absolute; top: 3px; right: 4px; width: 12px; height: 12px;
      border-radius: 50%; background: var(--accent); border: 2px solid var(--surface);
      display: none;
    }
    #jarvisFab.has-unread .unread { display: block; }

    .msgs {
      flex: 1; min-height: 0; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg {
      max-width: 88%; padding: 9px 12px; font-size: 13px; line-height: 1.5;
      white-space: pre-wrap; word-wrap: break-word; animation: fadeUp .25s ease both;
    }
    .msg.user {
      align-self: flex-end; background: var(--ink); color: var(--bg);
      border-radius: 16px 16px 4px 16px; font-weight: 600;
    }
    .msg.ai {
      align-self: flex-start; background: var(--ai-soft); color: var(--ink);
      border-radius: 16px 16px 16px 4px;
    }
    .msg.ai.offline { opacity: .75; }
    .msg .src-tag { display: block; margin-top: 5px; font-size: 10px; color: var(--muted); }

    .pin-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .pin-chip {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1.3px solid var(--ai); color: var(--ai-ink); background: var(--surface);
      border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; cursor: pointer;
      transition: background-color .15s, color .15s;
    }
    .pin-chip:hover { background: var(--ai); color: #fff; }
    .pin-chip .n {
      width: 15px; height: 15px; border-radius: 50%; background: var(--ai); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 9.5px; font-weight: 800; flex: none;
    }
    .pin-chip:hover .n { background: #fff; color: var(--ai); }

    .typing {
      display: flex; gap: 4px; padding: 10px 12px; align-self: flex-start;
      background: var(--ai-soft); border-radius: 16px 16px 16px 4px;
    }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ai); animation: dots 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }

    .sug-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
    .sug-chip {
      border: 1.3px solid var(--line); background: var(--surface2); color: var(--muted);
      border-radius: 999px; padding: 4px 11px; font-size: 11.5px; font-weight: 700; cursor: pointer;
      transition: color .2s, border-color .2s, transform .15s;
    }
    .sug-chip:hover { color: var(--ai-ink); border-color: var(--ai); transform: translateY(-1px); }

    .composer {
      flex: none; display: flex; gap: 8px; padding: 10px 12px;
      border-top: 1px solid var(--line);
    }
    .composer input {
      flex: 1; min-width: 0; border: 1.5px solid var(--line);
      border-radius: 999px; padding: 8px 14px; font: 600 13px 'Nunito', sans-serif;
      background: var(--surface2); color: var(--ink); outline: none;
      transition: border-color .2s;
    }
    .composer input::placeholder { color: var(--muted); font-weight: 400; }
    .composer input:focus { border-color: var(--ai); }
    .composer button {
      flex: none; width: 38px; height: 38px; border-radius: 50%;
      border: 0; background: var(--ai); color: #fff;
      font-size: 16px; cursor: pointer; transition: background-color .2s;
    }
    .composer button:hover { background: var(--ai-ink); }
    .composer button:disabled { opacity: .5; cursor: default; }

    @media (max-width: 760px) {
      .agent-panel {
        left: 12px; right: 12px; top: 12px; width: auto;
        height: min(72vh, calc(100vh - 24px));
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #jarvisFab, .ap-orb { animation: none; }
      .ai-pin-ring { animation: none; opacity: 0; }
      .ai-wrap, .msg, .poi-card, #detailView, .empty-card, .agent-panel { animation: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="map-pane">

      <div class="map-ctl-top">

      </div>

      <div id="exploreMode" class="ap-mode">
        <div class="omnibox">

      <div id="chatMode" class="ap-mode" style="display:none">

        </div>
        <div id="sugChips" class="sug-chips"></div>
        <div class="composer">
          <input id="chatInput" type="text" placeholder="H&#7887;i v&#7873; &#273;&#7883;a &#273;i&#7875;m, &#273;&#432;&#7901;ng &#273;i&#8230;" autocomplete="off" />

      <div class="side-foot">Tasco &middot; Jarvis Map &mdash; d&#7919; li&#7879;u b&#7843;n &#273;&#7891; &copy; Mapbox / OpenStreetMap</div>

    <button id="jarvisFab" aria-label="M&#7903; Jarvis" aria-expanded="true" style="display:none">&#10022;<span class="unread"></span></button>
  </div>

  <script src="__bridge.js"></script>
  <script src="vendor/leaflet/leaflet-global.js"></script>
  <script src="blocks/v4.js"></script>
  <script>
  (function () {
    'use strict';

    /* ── Normalization: JS mirror of scripts/_data.py (fold + longest-ngram
         abbreviation expansion). Python is normative; this only powers the
         live keystroke filter — Enter always asks search.py. ── */
    function fold(s) {
      if (!s) return '';
      s = String(s).toLowerCase().replace(/đ/g, 'd');
      s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      return s.replace(/\s+/g, ' ').trim();
    }
    var ABBREV = { terms: {}, max_ngram: 1 };
    function expandAbbrev(folded) {
      var tokens = folded.split(' ').filter(Boolean), out = [], i = 0;
      while (i < tokens.length) {
        var matched = false;
        for (var n = Math.min(ABBREV.max_ngram, tokens.length - i); n > 0; n--) {
          var gram = tokens.slice(i, i + n).join(' ');
          if (ABBREV.terms[gram]) { out.push(ABBREV.terms[gram]); i += n; matched = true; break; }
        }
        if (!matched) { out.push(tokens[i]); i += 1; }
      }
      return out.join(' ');
    }

    /* ── State ── */
    var CATS = {};
    var items = [];            // {marker, poi, keyBlob} — every dataset POI
    var enabled = {};          // category -> bool
    var liveFilter = '';       // folded+expanded live search text
    var searchIds = null;      // Set(poi_id) from an authoritative Enter-search, or null
    var searchOrder = null;    // [poi_id] in score order from the last Enter-search
    var aiLayer = null;        // numbered violet AI pins
    var sessionId = null;      // Jarvis chat session
    var busy = false;
    var selectedPoi = null;    // poi shown in the detail view
    var themeMode = null;      // null = follow system; 'light'|'dark' = explicit

    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) {
      var d = document.createElement('div'); d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    };

    /* ── Theme: explicit toggle beats prefers-color-scheme ── */
    var darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
    function effectiveTheme() { return themeMode || (darkQuery.matches ? 'dark' : 'light'); }
    function syncThemeIcon() {
      $('themeToggle').innerHTML = effectiveTheme() === 'dark' ? '&#9788;' : '&#9790;';
    }
    function toggleTheme() {
      themeMode = effectiveTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', themeMode);
      syncThemeIcon();
    }
    $('themeToggle').addEventListener('click', toggleTheme);
    if (darkQuery.addEventListener) {
      darkQuery.addEventListener('change', function () { if (themeMode === null) syncThemeIcon(); });
    }
    syncThemeIcon();

    /* ── Map (Leaflet global build) ── */
    var map = new L.LeafletMap('map', {
      center: [16.0, 106.5], zoom: 6, minZoom: 4, maxZoom: 19, zoomControl: false,
    });
    // Default basemap: CARTO Voyager — clean modern cartography over the same
    // open data, a clear upgrade on raw OSM tiles. Auto-swaps to Google tiles
    // when the Map Tiles API is available (see setBasemap).
    var CARTO_URL = 'https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png';
    var CARTO_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>';
    var baseLayer = new L.TileLayer(CARTO_URL, { maxZoom: 20, attribution: CARTO_ATTR }).addTo(map);
    // Mapbox raster tiles (Styles API) — the PRIMARY basemap when a token is present
    // in .env (fetched at runtime via mapbox.py; see loadMapbox). The CARTO layer
    // above stays as the offline / no-token fallback. The cream --tile-filter warms
    // whatever tiles load toward the Marlow Bay palette.
    var mapboxKey = null;
    var mapboxStyle = 'mapbox/light-v11';
    var MAPBOX_ATTR = '&copy; <a href="https://www.mapbox.com/about/maps/">Mapbox</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
    function mapboxTileUrl() {
      // mapboxStyle is "user/style_id" (e.g. "mapbox/light-v11").
      // Only request @2x (1024px) tiles on hi-DPI screens; on DPR-1 desktops a
      // 512px tile is pixel-perfect, so @2x would be 4x the decode + filter area
      // for no visual gain — a big pan/zoom saving.
      var hi = (window.devicePixelRatio || 1) > 1.25;
      return 'https://api.mapbox.com/styles/v1/' + mapboxStyle
        + '/tiles/512/{z}/{x}/{y}' + (hi ? '@2x' : '')
        + '?access_token=' + encodeURIComponent(mapboxKey);
    }
    aiLayer = new L.LayerGroup().addTo(map);
    var routeLayer = new L.LayerGroup().addTo(map);   // dashed navigation line
    var anchorLayer = new L.LayerGroup().addTo(map);  // proximity/nav reference
    var userLayer = new L.LayerGroup().addTo(map);    // GPS "you are here"
    function accentColor() {
      return (getComputedStyle(document.documentElement)
        .getPropertyValue('--accent') || '#e2683f').trim();
    }
    function clearRoute() { routeLayer.clearLayers(); }
    function clearAnchor() { anchorLayer.clearLayers(); }
    function makeAnchorIcon() {
      return new L.DivIcon({
        html: '<div class="anchor-dot"></div>', className: 'anchor-divicon',
        iconSize: [15, 15], iconAnchor: [8, 8],
      });
    }
    function dropAnchor(lat, lng, label) {
      clearAnchor();
      var m = new L.Marker([lat, lng], { icon: makeAnchorIcon(), title: label || '', zIndexOffset: 600 });
      if (label) {
        m.bindPopup(new L.Popup().setContent(
          '<div class="poi-popup"><b>' + esc(label) + '</b><br><small>'
          + 'Điểm tham chiếu / reference point</small></div>'));
      }
      anchorLayer.addLayer(m);
    }
    $('zoomIn').addEventListener('click', function () { map.zoomIn(); });
    $('zoomOut').addEventListener('click', function () { map.zoomOut(); });

    /* ── GPS current location ──────────────────────────────────────────
       userLoc is the user's real position (distinct from the map viewport,
       which is only where the map is looking). When set it is sent to Jarvis
       as user_location and takes precedence over the viewport for "near me"
       distance ranking. Fully optional: denial/error keeps prior behaviour. */
    var userLoc = null;
    function makeUserIcon() {
      return new L.DivIcon({
        html: '<div class="user-dot"></div>', className: 'user-divicon',
        iconSize: [16, 16], iconAnchor: [8, 8],
      });
    }
    function showUserMarker(lat, lng) {
      userLayer.clearLayers();
      var m = new L.Marker([lat, lng], { icon: makeUserIcon(), zIndexOffset: 700 });
      m.bindPopup(new L.Popup().setContent(
        '<div class="poi-popup"><b>Vị trí của bạn</b><br><small>Your location</small></div>'));
      userLayer.addLayer(m);
    }
    function locateMe() {
      var btn = $('locateMe');
      if (!navigator.geolocation) {
        AtriaDash.toast({ message: 'Trình duyệt không hỗ trợ định vị / Geolocation unavailable', severity: 'info' });
        return;
      }
      btn.classList.add('locating');
      navigator.geolocation.getCurrentPosition(function (pos) {
        btn.classList.remove('locating');
        btn.classList.add('on');
        userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        showUserMarker(userLoc.lat, userLoc.lng);
        map.setView([userLoc.lat, userLoc.lng], Math.max(map.getZoom(), 14));
        AtriaDash.toast({ message: 'Đã xác định vị trí — hỏi "gần tôi" để tìm quanh đây', severity: 'success' });
      }, function (err) {
        btn.classList.remove('locating');
        var msg = err && err.code === 1
          ? 'Bạn đã từ chối chia sẻ vị trí / Location permission denied'
          : 'Không lấy được vị trí / Could not get your location';
        AtriaDash.toast({ message: msg, severity: 'info' });
      }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
    }
    $('locateMe').addEventListener('click', locateMe);

    /* ── Google Maps JS SDK (browser) — OPTIONAL enhancement ───────────────
       The referrer-restricted key is fetched from .env at runtime (never baked
       into the committed HTML) and injected here. It currently powers real
       Directions routes; the OSM basemap and every existing behaviour stay put
       and are the fallback whenever Google is unavailable (no key, billing off,
       or this origin isn't in the key's referrer allow-list). On an auth failure
       the exact Google error (BillingNotEnabled / RefererNotAllowed /
       ApiNotActivated / InvalidKey) is surfaced in a toast so it's diagnosable
       from the real serving origin. */
    var googleReady = false;
    var gmapsError = null;
    var gmapsKey = null;
    var gDirections = null;
    window.gm_authFailure = function () {
      googleReady = false;
      AtriaDash.toast({ message: 'Google Maps: ' + (gmapsError || 'auth failed') + ' — dùng bản đồ OSM', severity: 'error' });
    };
    (function captureGmapsError() {
      var orig = console.error ? console.error.bind(console) : function () {};
      console.error = function () {
        var s = Array.prototype.join.call(arguments, ' ');
        var m = s.match(/([A-Za-z]+MapError|BillingNotEnabled|RefererNotAllowed|ApiNotActivated|InvalidKey)/);
        if (m) gmapsError = m[1];
        orig.apply(null, arguments);
      };
    })();
    window.__gmapsInit = function () {
      googleReady = true;
      // Google powers OPTIONAL Directions/Places only; the Mapbox (or CARTO)
      // basemap stays the default and is never auto-replaced.
    };
    function loadGoogleMaps() {
      AtriaDash.json('gmaps.py', ['config']).then(function (cfg) {
        if (!cfg || !cfg.key_present || !cfg.key) return;   // no key -> stay on OSM
        gmapsKey = cfg.key;
        var s = document.createElement('script');
        s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(cfg.key)
          + '&libraries=' + encodeURIComponent(cfg.libraries || 'places,geometry')
          + '&region=' + encodeURIComponent(cfg.region || 'vn')
          + '&language=' + encodeURIComponent(cfg.language || 'vi')
          + '&loading=async&callback=__gmapsInit';
        s.async = true;
        s.onerror = function () { AtriaDash.toast({ message: 'Không tải được Google Maps SDK', severity: 'error' }); };
        document.head.appendChild(s);
      }).catch(function () { /* offline / bridge error -> stay on OSM */ });
    }

    function drawStraightRoute(from, to) {
      routeLayer.addLayer(new L.Polyline(
        [[from.lat, from.lng], [to.lat, to.lng]],
        { color: accentColor(), weight: 3, opacity: 0.85, dashArray: '8,9', lineCap: 'round' }));
    }
    function drawRoute(from, to) {
      clearRoute();
      if (!googleReady || !window.google || !google.maps) { drawStraightRoute(from, to); return; }
      try {
        if (!gDirections) gDirections = new google.maps.DirectionsService();
        gDirections.route({
          origin: { lat: from.lat, lng: from.lng },
          destination: { lat: to.lat, lng: to.lng },
          travelMode: google.maps.TravelMode.DRIVING,
        }, function (result, status) {
          if (status === 'OK' && result.routes && result.routes[0]) {
            var path = result.routes[0].overview_path.map(function (p) { return [p.lat(), p.lng()]; });
            routeLayer.addLayer(new L.Polyline(path,
              { color: accentColor(), weight: 5, opacity: 0.9, lineCap: 'round', lineJoin: 'round' }));
          } else {
            drawStraightRoute(from, to);   // real route unavailable -> straight fallback
            // Surface a config problem (e.g. Directions API not enabled) so a
            // straight line isn't silently ambiguous. ZERO_RESULTS is a genuine
            // "no road route" and stays quiet.
            if (status && status !== 'ZERO_RESULTS') {
              AtriaDash.toast({ message: 'Google Directions: ' + status + ' — dùng đường thẳng', severity: 'info' });
            }
          }
        });
      } catch (e) { drawStraightRoute(from, to); }
    }

    /* ── Google live Places + Geocoder (browser SDK) ───────────────────────
       Used ONLY as a fallback when the local dataset returns nothing, so the
       curated data stays the primary source and Google augments the long tail.
       External results are clearly labelled. Chains: dataset miss -> Places
       text search -> (if none) Geocoder for a bare address. Any Google error
       (e.g. the Places API itself not enabled) degrades to the plain not-found
       toast, carrying Google's status so it's diagnosable. */
    var gPlaces = null;
    var gGeocoder = null;
    function notFound(q, status) {
      var extra = status && status !== 'ZERO_RESULTS' ? ' (Google: ' + status + ')' : '';
      AtriaDash.toast({ message: 'Không tìm thấy "' + q + '"' + extra, severity: 'info' });
    }
    function googlePlacesFallback(q) {
      if (!googleReady || !window.google || !google.maps || !google.maps.places) {
        notFound(q); return;
      }
      try {
        if (!gPlaces) gPlaces = new google.maps.places.PlacesService(document.createElement('div'));
        var o = userLoc || map.getCenter();
        gPlaces.textSearch({
          query: q, location: new google.maps.LatLng(o.lat, o.lng), radius: 20000,
        }, function (results, status) {
          if (status !== google.maps.places.PlacesServiceStatus.OK || !results || !results.length) {
            googleGeocodeFallback(q, status);   // no places -> try a bare address
            return;
          }
          var items = results.slice(0, 10).map(function (r, i) {
            return {
              n: i + 1, poi_id: 'gpl' + i, name: r.name,
              lat: r.geometry.location.lat(), lng: r.geometry.location.lng(),
              rating: r.rating || '',
              detail: (r.formatted_address || '') + ' · Google Places (external)',
              external: true,
            };
          });
          applyActions([{ type: 'pins', items: items, fit: true }]);
          $('listTitle').textContent = 'Google Places · external';
          AtriaDash.toast({ message: items.length + ' kết quả từ Google Places (external)', severity: 'success' });
        });
      } catch (e) { notFound(q); }
    }
    function googleGeocodeFallback(q, placesStatus) {
      if (!googleReady || !window.google || !google.maps || !google.maps.Geocoder) {
        notFound(q, placesStatus); return;
      }
      try {
        if (!gGeocoder) gGeocoder = new google.maps.Geocoder();
        gGeocoder.geocode({ address: q, region: 'vn' }, function (results, status) {
          if (status === 'OK' && results && results[0]) {
            var loc = results[0].geometry.location;
            clearRoute();
            dropAnchor(loc.lat(), loc.lng(), results[0].formatted_address);
            map.flyTo([loc.lat(), loc.lng()], 15);
            $('listTitle').textContent = 'Google · external';
            AtriaDash.toast({ message: 'Vị trí từ Google: ' + results[0].formatted_address, severity: 'success' });
          } else {
            notFound(q, placesStatus || status);
          }
        });
      } catch (e) { notFound(q, placesStatus); }
    }

    /* ── Basemap switcher — real Google tiles via the Map Tiles API ─────────
       The Map Tiles API is a SEPARATELY-enabled Google API and needs a session
       token, created here from the browser so the referrer key is accepted.
       Only the tiles change — the POI data + overlays are untouched (Leaflet
       keeps markers/routes in higher panes). If the Map Tiles API isn't enabled
       the swap fails and we keep OSM, surfacing Google's status. The ◎ button
       cycles OSM -> Google roadmap -> Google satellite. */
    // Google Maps is an OPTIONAL enhancement layer (Directions/Places/Geocoder +
    // Google basemap tiles). Disabled for now — flip this to true (and ensure
    // GG_MAP_API_KEY is valid with billing on) to restore every Google feature.
    // Nothing else needs changing: all Google code below self-gates on googleReady,
    // which only turns true once loadGoogleMaps() runs.
    var USE_GOOGLE = false;
    var basemapMode = 'standard';
    var gTileSessions = {};              // mapType -> session token (cached)
    // When Google is off the ◎ button just cycles Mapbox <-> CARTO (no dead options).
    var BASE_CYCLE = USE_GOOGLE ? ['mapbox', 'standard', 'roadmap', 'satellite']
                                : ['mapbox', 'standard'];
    var BASE_GLYPH = { mapbox: '🗺', standard: '🧭', roadmap: '🌍', satellite: '🛰' };

    function makeBaseLayer(mode, session) {
      if (mode === 'mapbox') {
        return new L.TileLayer(mapboxTileUrl(),
          { maxZoom: 20, tileSize: 512, zoomOffset: -1, attribution: MAPBOX_ATTR });
      }
      if (mode === 'roadmap' || mode === 'satellite') {
        return new L.TileLayer(
          'https://tile.googleapis.com/v1/2dtiles/{z}/{x}/{y}?session=' + session
          + '&key=' + encodeURIComponent(gmapsKey),
          { maxZoom: 20, attribution: 'Imagery &copy; Google' });
      }
      return new L.TileLayer(CARTO_URL, { maxZoom: 20, attribution: CARTO_ATTR });
    }
    function swapBase(mode, session) {
      var next = makeBaseLayer(mode, session);
      next.addTo(map);
      if (baseLayer) map.removeLayer(baseLayer);
      baseLayer = next;
      basemapMode = mode;
      $('basemapToggle').textContent = BASE_GLYPH[mode] || BASE_GLYPH.standard;
    }
    function setBasemap(mode) {
      if (mode === 'mapbox') {
        if (!mapboxKey) { AtriaDash.toast({ message: 'Mapbox chưa sẵn sàng — dùng bản đồ mặc định', severity: 'info' }); return; }
        swapBase('mapbox'); return;
      }
      if (mode === 'standard') { swapBase('standard'); return; }
      if (!googleReady || !gmapsKey) {
        AtriaDash.toast({ message: 'Google Maps chưa sẵn sàng — dùng bản đồ mặc định', severity: 'info' });
        return;
      }
      var mapType = mode === 'satellite' ? 'satellite' : 'roadmap';
      if (gTileSessions[mapType]) { swapBase(mode, gTileSessions[mapType]); return; }
      fetch('https://tile.googleapis.com/v1/createSession?key=' + encodeURIComponent(gmapsKey), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mapType: mapType, language: 'vi-VN', region: 'VN',
          layerTypes: mapType === 'satellite' ? ['layerRoadmap'] : undefined,
        }),
      }).then(function (r) { return r.json(); }).then(function (s) {
        if (!s || !s.session) {
          var st = (s && s.error && (s.error.status || s.error.message)) || 'no session';
          AtriaDash.toast({ message: 'Google tiles: ' + st + ' — cần bật Map Tiles API', severity: 'info' });
          return;
        }
        gTileSessions[mapType] = s.session;
        swapBase(mode, s.session);
        AtriaDash.toast({ message: mode === 'satellite' ? 'Google vệ tinh / satellite' : 'Google Maps', severity: 'success' });
      }).catch(function () {
        AtriaDash.toast({ message: 'Không tải được Google tiles — dùng OSM', severity: 'info' });
      });
    }
    function cycleBasemap() {
      var i = BASE_CYCLE.indexOf(basemapMode);
      setBasemap(BASE_CYCLE[(i + 1) % BASE_CYCLE.length]);
    }
    $('basemapToggle').addEventListener('click', cycleBasemap);

    /* ── Mapbox basemap (default when a token is in .env) ───────────────────
       Fetched at runtime via the bridge so the token is never baked into the
       served HTML. When present, Mapbox becomes the default basemap (swapping
       out the initial CARTO layer); otherwise we stay on CARTO. Google, if it
       loads, stays a background Directions/Places helper only. */
    function loadMapbox() {
      AtriaDash.json('mapbox.py', ['config']).then(function (cfg) {
        if (!cfg || !cfg.key_present || !cfg.key) return;   // no token -> stay on CARTO
        mapboxKey = cfg.key;
        if (cfg.style) mapboxStyle = cfg.style;
        swapBase('mapbox');   // make Mapbox the default basemap
      }).catch(function () { /* offline / bridge error -> stay on CARTO */ });
    }
    loadMapbox();
    if (USE_GOOGLE) loadGoogleMaps();   // disabled for now; flip USE_GOOGLE to restore

    function makeIcon(cat) {
      var c = CATS[cat] || { color: '#555', emoji: '' };
      return new L.DivIcon({
        html: '<div class="poi-pin" style="background:' + c.color + '"><span class="poi-emoji">' + (c.emoji || '') + '</span></div>',
        className: 'poi-divicon', iconSize: [27, 27], iconAnchor: [14, 27], popupAnchor: [0, -26],
      });
    }
    function makeAiIcon(n) {
      return new L.DivIcon({
        html: '<div class="ai-wrap"><div class="ai-pin-ring"></div><div class="ai-pin">' + n + '</div></div>',
        className: 'ai-divicon', iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -16],
      });
    }
    /* DOM popup so the "Chi tiết" button gets a real listener. */
    function popupNode(p) {
      var c = CATS[p.category] || { label: p.category };
      var el = document.createElement('div');
      el.className = 'poi-popup';
      var stars = p.rating ? '<span class="rating">&#9733; ' + esc(p.rating) + '</span> &middot; ' : '';
      el.innerHTML = '<b>' + esc(p.name) + '</b><br>' +
        '<span>' + (c.emoji || '') + ' ' + esc(c.label || p.category) + '</span><br>' +
        stars + '<small>' + esc(p.address || '') + (p.city ? ' &middot; ' + esc(p.city) : '') + '</small><br>';
      var btn = document.createElement('button');
      btn.className = 'detail-link';
      btn.textContent = 'Chi tiết ›';
      btn.addEventListener('click', function () { openDetail(p); });
      el.appendChild(btn);
      return el;
    }

    /* ── Visibility: category chips + live filter + authoritative search.
         refresh() is the single authority — it also feeds the sidebar list,
         so markers and cards can never disagree. ── */
    var _refreshTimer = null;
    function scheduleRefresh() {          // debounce the heavy rebuild while typing
      if (_refreshTimer) clearTimeout(_refreshTimer);
      _refreshTimer = setTimeout(function () { _refreshTimer = null; refresh(); }, 140);
    }
    function refresh() {
      if (_refreshTimer) { clearTimeout(_refreshTimer); _refreshTimer = null; }
      var visible = [];
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var ok = enabled[it.poi.category];
        if (ok && searchIds) ok = searchIds.has(it.poi.poi_id);
        if (ok && liveFilter) ok = it.keyBlob.indexOf(liveFilter) !== -1;
        if (ok) { visible.push(it.poi); if (!map.hasLayer(it.marker)) map.addLayer(it.marker); }
        else if (map.hasLayer(it.marker)) { map.removeLayer(it.marker); }
      }
      $('count').textContent = visible.length + ' địa điểm / places';
      $('emptyState').style.display =
        (visible.length === 0 && (liveFilter || searchIds)) ? '' : 'none';
      renderList(visible);
    }

    var markerById = {};
    function focusPoi(p) {
      map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 16));
      var m = markerById[p.poi_id];
      if (m && map.hasLayer(m)) m.openPopup();
    }

    function renderList(visible) {
      var rows = visible.slice();
      if (searchOrder) {
        var idx = {};
        searchOrder.forEach(function (id, i) { idx[id] = i; });
        rows.sort(function (a, b) { return (idx[a.poi_id] || 0) - (idx[b.poi_id] || 0); });
      } else {
        rows.sort(function (a, b) {
          var ra = a.rating == null ? -1 : a.rating, rb = b.rating == null ? -1 : b.rating;
          if (rb !== ra) return rb - ra;
          return a.name.localeCompare(b.name);
        });
      }
      var frag = document.createDocumentFragment();
      rows.forEach(function (p, i) {
        // Top-3 best first, then a labeled divider, then extras — mirrors the
        // Jarvis chat reply. Only for an authoritative (score-ordered) search,
        // where "best" is meaningful; the Explore browse list stays ungrouped.
        if (searchOrder && i === 3 && rows.length > 3) {
          var dv = document.createElement('div');
          dv.className = 'list-divider';
          dv.textContent = 'Gợi ý thêm / More suggestions';
          frag.appendChild(dv);
        }
        var c = CATS[p.category] || { color: '#555', emoji: '' };
        var card = document.createElement('div');
        card.className = 'poi-card';
        var meta = (p.rating ? '<span class="star">&#9733;</span> ' + esc(p.rating) + ' &middot; ' : '') + esc(p.district || p.city || '');
        card.innerHTML =
          '<div class="poi-thumb">' + (c.emoji || '') + '</div>' +
          '<div class="poi-body">' +
            '<div class="poi-name-row"><span class="poi-name">' + esc(p.name) + '</span>' +
              '<span class="poi-dot" style="background:' + c.color + '"></span></div>' +
            '<span class="poi-meta">' + meta + '</span>' +
            (p.opening_hours ? '<span class="poi-open">' + esc(p.opening_hours) + '</span>' : '') +
          '</div><span class="poi-chevron">&#8250;</span>';
        card.addEventListener('click', function () { focusPoi(p); });
        frag.appendChild(card);
      });
      var list = $('poiList');
      list.innerHTML = '';
      list.appendChild(frag);
    }

    /* ── Detail view (in the panel's Explore mode) ── */
    function openDetail(p) {
      selectedPoi = p;
      expandPanel();        // a map-popup "Chi tiết" click must reveal the panel...
      setMode('explore');   // ...in Explore mode where the detail view lives
      var c = CATS[p.category] || { label: p.category, emoji: '' };
      var body = $('detailBody');
      body.innerHTML =
        '<div class="detail-hero">' + (c.emoji || '') + '</div>' +
        '<div class="detail-name">' + esc(p.name) + '</div>' +
        (p.name_en && p.name_en !== p.name ? '<div class="detail-name-en">' + esc(p.name_en) + '</div>' : '') +
        '<div class="detail-meta">' +
          (p.rating ? '<span class="star">&#9733;</span> ' + esc(p.rating) + ' &middot; ' : '') +
          esc(p.district || '') + (p.city ? ' &middot; ' + esc(p.city) : '') + '</div>' +
        (p.opening_hours ? '<div class="detail-open">' + esc(p.opening_hours) + '</div>' : '') +
        (p.address ? '<div class="detail-addr">' + esc(p.address) + '</div>' : '') +
        '<div class="tag-chips">' +
          '<span class="tag-chip cat">' + (c.emoji || '') + ' ' + esc(c.label || p.category) + '</span>' +
          (p.aliases || []).slice(0, 6).map(function (a) {
            return '<span class="tag-chip">' + esc(a) + '</span>';
          }).join('') +
        '</div>';
      var actions = document.createElement('div');
      actions.className = 'detail-actions';
      var btnFocus = document.createElement('button');
      btnFocus.className = 'btn-accent';
      btnFocus.textContent = '⌖ Xem trên bản đồ';
      btnFocus.addEventListener('click', function () { focusPoi(p); });
      var btnAsk = document.createElement('button');
      btnAsk.className = 'btn-ai';
      btnAsk.innerHTML = '&#10022; Hỏi Jarvis';
      btnAsk.addEventListener('click', function () {
        togglePopover(true);
        $('chatInput').value = 'Giới thiệu về ' + p.name;
        $('chatInput').focus();
      });
      actions.appendChild(btnFocus);
      actions.appendChild(btnAsk);
      body.appendChild(actions);
      $('exploreView').style.display = 'none';
      $('detailView').style.display = '';
      $('detailView').parentElement.scrollTop = 0;
    }
    function closeDetail() {
      selectedPoi = null;
      $('detailView').style.display = 'none';
      $('exploreView').style.display = '';
    }
    $('detailBack').addEventListener('click', closeDetail);

    /* ── Category chips (multi-toggle, design skin) ── */
    var chipEls = {};
    function syncChips() {
      var allOn = Object.keys(CATS).every(function (k) { return enabled[k]; });
      if (chipEls.__all) chipEls.__all.classList.toggle('on', allOn);
      Object.keys(chipEls).forEach(function (k) {
        if (k !== '__all') chipEls[k].classList.toggle('on', !!enabled[k]);
      });
    }
    function buildChips() {
      var legend = $('legend');
      legend.innerHTML = '';
      chipEls = {};
      var all = document.createElement('button');
      all.className = 'cat-chip';
      all.textContent = 'Tất cả / All';
      all.addEventListener('click', function () {
        Object.keys(CATS).forEach(function (k) { enabled[k] = true; });
        syncChips(); refresh();
      });
      legend.appendChild(all);
      chipEls.__all = all;
      Object.keys(CATS).forEach(function (key) {
        if (!(key in enabled)) enabled[key] = true;
        var c = CATS[key];
        var chip = document.createElement('button');
        chip.className = 'cat-chip';
        chip.innerHTML = '<span class="dot" style="background:' + c.color + '"></span>' +
          (c.emoji || '') + ' ' + esc(c.label);
        chip.title = c.label_vi || c.label;
        chip.addEventListener('click', function () {
          enabled[key] = !enabled[key];
          syncChips(); refresh();
        });
        legend.appendChild(chip);
        chipEls[key] = chip;
      });
      syncChips();
    }

    /* ── Authoritative search (Enter) ── */
    function runSearch(q) {
      AtriaDash.json('search.py', ['search', q, '--limit', '25']).then(function (res) {
        if (res.error) { AtriaDash.toast({ message: res.error, severity: 'error' }); return; }
        var results = res.results || [];
        searchIds = new Set(results.map(function (r) { return r.poi_id; }));
        searchOrder = results.map(function (r) { return r.poi_id; });
        liveFilter = '';
        var label = res.intent && res.intent !== 'POI Search' && res.intent !== 'Category Search'
          ? res.intent : 'Kết quả / Results';
        $('listTitle').textContent = label;
        closeDetail();
        refresh();
        // Anchored / coordinate / navigation searches carry a reference point —
        // drop a temporary rust anchor marker so "near X" is visible on the map.
        clearRoute();
        if (res.anchor && res.anchor.lat != null) dropAnchor(res.anchor.lat, res.anchor.lng, res.anchor.label);
        else clearAnchor();
        if (results.length) {
          var pts = results.map(function (r) { return [r.lat, r.lng]; });
          if (res.anchor && res.anchor.lat != null) pts.push([res.anchor.lat, res.anchor.lng]);
          map.fitBounds(new L.LatLngBounds(pts), { padding: [46, 46], maxZoom: 15 });
        } else {
          // Dataset miss -> augment with Google (live Places, then Geocoder).
          googlePlacesFallback(q);
        }
        $('clearSearch').style.display = 'inline';
      }).catch(function (e) {
        AtriaDash.toast({ message: 'Search failed: ' + e, severity: 'error' });
      });
    }
    function clearSearch() {
      searchIds = null; searchOrder = null; liveFilter = '';
      $('search').value = '';
      $('clearSearch').style.display = 'none';
      $('listTitle').textContent = 'Khám phá / Explore';
      clearRoute(); clearAnchor();
      refresh();
    }
    $('search').addEventListener('input', function (e) {
      searchIds = null; searchOrder = null;
      $('listTitle').textContent = 'Khám phá / Explore';
      $('clearSearch').style.display = e.target.value ? 'inline' : 'none';
      liveFilter = expandAbbrev(fold(e.target.value));
      scheduleRefresh();   // debounced: don't rebuild 301 markers+cards per keystroke
    });
    $('search').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.value.trim()) runSearch(e.target.value.trim());
    });
    $('clearSearch').addEventListener('click', clearSearch);
    $('emptyAsk').addEventListener('click', function () {
      togglePopover(true);
      var q = $('search').value.trim();
      $('chatInput').value = q ? 'Tìm giúp tôi ' + q : '';
      $('chatInput').focus();
    });

    /* ── AI pins + map actions ── */
    var activePins = [];       // [{n, poi_id, name}] — echoed back to jarvis_chat
    function clearAiPins() { aiLayer.clearLayers(); activePins = []; }
    var aiMarkerByN = {};
    function applyActions(actions) {
      (actions || []).forEach(function (a) {
        if (a.type === 'pins' && a.items && a.items.length) {
          clearAiPins(); aiMarkerByN = {};
          a.items.forEach(function (it) {
            var m = new L.Marker([it.lat, it.lng], { icon: makeAiIcon(it.n), title: it.name, zIndexOffset: 1000 });
            var detail = it.detail ? '<small>' + esc(it.detail) + '</small>' : '';
            var stars = it.rating ? '<span class="rating">&#9733; ' + esc(it.rating) + '</span><br>' : '';
            m.bindPopup(new L.Popup().setContent(
              '<div class="poi-popup"><b>' + it.n + '. ' + esc(it.name) + '</b><br>' + stars + detail + '</div>'));
            aiLayer.addLayer(m);
            aiMarkerByN[it.n] = m;
            // External (Google) pins aren't dataset POIs — keep them out of the
            // chat-context pin list so they aren't sent back to jarvis_chat.
            if (!it.external) activePins.push({ n: it.n, poi_id: it.poi_id, name: it.name });
          });
          if (a.fit !== false) {
            var b = new L.LatLngBounds(a.items.map(function (it) { return [it.lat, it.lng]; }));
            map.fitBounds(b, { padding: [46, 46], maxZoom: 15 });
          }
        } else if (a.type === 'focus' && a.lat != null) {
          map.flyTo([a.lat, a.lng], a.zoom || 15);
        } else if (a.type === 'route' && a.from && a.to) {
          drawRoute(a.from, a.to);   // real Google route when connected, else straight line
          dropAnchor(a.to.lat, a.to.lng);
        } else if (a.type === 'clear') {
          if (a.what === 'ai' || a.what === 'all') clearAiPins();
          if (a.what === 'route' || a.what === 'all') { clearRoute(); clearAnchor(); }
        }
      });
    }

    /* ── Floating panel: collapse/expand + Explore⇄Chat mode + drag ──────
       The v3 agent panel is one draggable surface with two modes. "Open Jarvis"
       (from a detail card / empty-state) == expand + switch to chat. Collapsing
       drops to the ✦ FAB. All the old contract IDs are preserved. */
    var panelCollapsed = false;
    var chatMode = false;
    function chatVisible() { return !panelCollapsed && chatMode; }
    function setMode(mode) {
      chatMode = (mode === 'chat');
      $('exploreMode').style.display = chatMode ? 'none' : 'flex';
      $('chatMode').style.display = chatMode ? 'flex' : 'none';
      $('tabExplore').classList.toggle('on', !chatMode);
      $('tabChat').classList.toggle('on', chatMode);
      if (chatMode) {
        $('jarvisFab').classList.remove('has-unread');
        renderSuggestions();
        $('msgs').scrollTop = $('msgs').scrollHeight;
        $('chatInput').focus();
      }
    }
    function expandPanel() {
      panelCollapsed = false;
      $('agentPanel').classList.remove('collapsed');
      $('jarvisFab').style.display = 'none';
      $('jarvisFab').setAttribute('aria-expanded', 'true');
    }
    function collapsePanel() {
      panelCollapsed = true;
      $('agentPanel').classList.add('collapsed');
      $('jarvisFab').style.display = 'flex';
      $('jarvisFab').setAttribute('aria-expanded', 'false');
    }
    // Back-compat shim used by the detail card + empty state: open == chat mode.
    function togglePopover(open) {
      var want = open == null ? !chatVisible() : !!open;
      if (want) { expandPanel(); setMode('chat'); }
      else { setMode('explore'); }
    }
    $('tabExplore').addEventListener('click', function () { setMode('explore'); });
    $('tabChat').addEventListener('click', function () { setMode('chat'); });
    $('panelMin').addEventListener('click', collapsePanel);
    $('jarvisFab').addEventListener('click', function () { expandPanel(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && chatVisible()) setMode('explore');
    });

    /* Drag the panel by its header (pointer events; clamped to the viewport). */
    (function enablePanelDrag() {
      var panel = $('agentPanel'), head = $('apHead');
      var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
      head.addEventListener('pointerdown', function (e) {
        if (e.target.closest('button')) return;   // minimize button isn't a drag handle
        dragging = true;
        var r = panel.getBoundingClientRect();
        ox = r.left; oy = r.top; sx = e.clientX; sy = e.clientY;
        panel.style.right = 'auto'; panel.style.bottom = 'auto';
        try { head.setPointerCapture(e.pointerId); } catch (x) {}
      });
      head.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        var nx = ox + (e.clientX - sx), ny = oy + (e.clientY - sy);
        var maxX = window.innerWidth - panel.offsetWidth - 6;
        var maxY = window.innerHeight - panel.offsetHeight - 6;
        panel.style.left = Math.max(6, Math.min(nx, maxX)) + 'px';
        panel.style.top = Math.max(6, Math.min(ny, maxY)) + 'px';
      });
      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        try { head.releasePointerCapture(e.pointerId); } catch (x) {}
      }
      head.addEventListener('pointerup', endDrag);
      head.addEventListener('pointercancel', endDrag);
    })();

    var SUGGESTIONS = ['cafe gần đây', 'nhà thuốc quận 1', 'chỉ đường đến chợ Bến Thành'];
    function renderSuggestions() {
      var box = $('sugChips');
      var hasUserMsg = $('msgs').querySelector('.msg.user') !== null;
      if (hasUserMsg || busy) { box.innerHTML = ''; return; }
      if (box.childElementCount) return;
      SUGGESTIONS.forEach(function (label) {
        var chip = document.createElement('button');
        chip.className = 'sug-chip';
        chip.textContent = label;
        chip.addEventListener('click', function () {
          box.innerHTML = '';
          askJarvis(label);
        });
        box.appendChild(chip);
      });
    }

    function addMsg(kind, text, extra) {
      var div = document.createElement('div');
      div.className = 'msg ' + kind + (extra && extra.offline ? ' offline' : '');
      div.textContent = text;
      if (extra && extra.pins && extra.pins.length) {
        var chips = document.createElement('div');
        chips.className = 'pin-chips';
        extra.pins.forEach(function (p) {
          var chip = document.createElement('span');
          chip.className = 'pin-chip';
          chip.innerHTML = '<span class="n">' + p.n + '</span>' + esc(p.name);
          chip.addEventListener('click', function () {
            var m = aiMarkerByN[p.n];
            if (m) { map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 14)); m.openPopup(); }
          });
          chips.appendChild(chip);
        });
        div.appendChild(chips);
      }
      if (extra && extra.srcTag) {
        var tag = document.createElement('span');
        tag.className = 'src-tag';
        tag.textContent = extra.srcTag;
        div.appendChild(tag);
      }
      $('msgs').appendChild(div);
      $('msgs').scrollTop = $('msgs').scrollHeight;
      // Unread badge only matters while the chat isn't visible (panel collapsed
      // to the FAB, or sitting in Explore mode).
      if (kind === 'ai' && !chatVisible()) $('jarvisFab').classList.add('has-unread');
      renderSuggestions();
      return div;
    }
    function showTyping() {
      var t = document.createElement('div');
      t.className = 'typing'; t.id = 'typing';
      t.innerHTML = '<span></span><span></span><span></span>';
      $('msgs').appendChild(t);
      $('msgs').scrollTop = $('msgs').scrollHeight;
    }
    function hideTyping() { var t = $('typing'); if (t) t.remove(); }

    function askJarvis(text) {
      if (busy) return;
      busy = true;
      $('chatSend').disabled = true;
      renderSuggestions();
      addMsg('user', text);
      showTyping();
      var c = map.getCenter();
      var payload = {
        message: text,
        chat_session_id: sessionId,
        interactive: true,
        viewport: { lat: c.lat, lng: c.lng, zoom: map.getZoom() },
        pins: activePins,
      };
      if (userLoc) payload.user_location = { lat: userLoc.lat, lng: userLoc.lng };
      AtriaDash.json('jarvis_chat.py', [], {
        stdin: JSON.stringify(payload), timeout_ms: 110000,
      }).then(function (res) {
        hideTyping();
        if (res.session_id) sessionId = res.session_id;
        var pins = [];
        (res.map_actions || []).forEach(function (a) {
          if (a.type === 'pins') pins = pins.concat(a.items || []);
        });
        if (res.error && !res.reply) {
          addMsg('ai', 'Jarvis is unreachable: ' + res.error, { offline: true });
        } else {
          applyActions(res.map_actions);
          addMsg('ai', res.reply || '(no reply)', {
            pins: pins,
            srcTag: res.source === 'fast' ? 'instant · local search' : null,
          });
        }
      }).catch(function (e) {
        hideTyping();
        addMsg('ai', 'Jarvis error: ' + e, { offline: true });
      }).then(function () {
        busy = false;
        $('chatSend').disabled = false;
        $('chatInput').focus();
      });
    }
    $('chatSend').addEventListener('click', function () {
      var v = $('chatInput').value.trim();
      if (v) { $('chatInput').value = ''; askJarvis(v); }
    });
    function resetChat() {
      // Wipe the server-side soft-cache for this session, then start fresh.
      if (sessionId) {
        AtriaDash.json('jarvis_chat.py', [], {
          stdin: JSON.stringify({ reset: true, interactive: true, chat_session_id: sessionId }),
          timeout_ms: 8000,
        }).catch(function () { /* best-effort; TTL clears it anyway */ });
      }
      sessionId = null;
      clearAiPins();
      $('msgs').innerHTML =
        '<div class="msg ai">Cu&#7897;c tr&#242; chuy&#7879;n m&#7899;i &#8212; h&#7887;i t&#244;i v&#7873; &#273;&#7883;a &#273;i&#7875;m nh&#233;.</div>';
      renderSuggestions();
      $('chatInput').focus();
    }
    $('jarvisReset').addEventListener('click', resetChat);
    $('chatInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var v = e.target.value.trim();
        if (v) { e.target.value = ''; askJarvis(v); }
      }
    });

    /* ── Boot: bridge context + dataset ── */
    AtriaDash.onTheme(function (theme) {
      // dormant forward-compat: the host doesn't push theme to module
      // dashboards today; a manual ☾/☀ choice always wins if it ever does.
      if (themeMode === null) {
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
        syncThemeIcon();
      }
    });
    AtriaDash.onContext(function (ctx) {
      // dashboard context session — chat keeps its own dedicated session id
    });
    AtriaDash.onChange(function () { /* data files changed -> reload dataset */ loadData(); });

    function loadData() {
      AtriaDash.json('search.py', ['pois']).then(function (data) {
        if (data.error) { $('count').textContent = data.error; return; }
        CATS = data.categories || {};
        if (data.abbreviations) ABBREV = data.abbreviations;
        // rebuild markers
        items.forEach(function (it) { if (map.hasLayer(it.marker)) map.removeLayer(it.marker); });
        items = [];
        markerById = {};
        closeDetail();
        (data.pois || []).forEach(function (p) {
          var m = new L.Marker([p.lat, p.lng], { icon: makeIcon(p.category), title: p.name });
          m.bindPopup(new L.Popup().setContent(popupNode(p)));
          var blob = [p.q.name, p.q.name_en].concat(p.q.aliases || []).join(' | ');
          items.push({ marker: m, poi: p, keyBlob: blob });
          markerById[p.poi_id] = m;
        });
        buildChips();
        refresh();
      }).catch(function (e) {
        $('count').textContent = 'Failed to load map data';
        AtriaDash.toast({ message: 'Data load failed: ' + e, severity: 'error' });
      });
    }

    AtriaDash.ready();
    loadData();
    renderSuggestions();
    setTimeout(function () { map.invalidateSize(); }, 250);
    window.addEventListener('resize', function () { map.invalidateSize(); });

    /* ── Marlow Bay Agent v4 ("new design", map-first) ─────────────────────
       Everything new lives in blocks/v4.js+css; this is the only hand-off.
       If the block script failed to load, the legacy dashboard runs exactly
       as before. The toggle chip + body.design-v4 class + #legacy hash routing
       + hiding the legacy panel all live inside the block. */
    if (window.V4 && window.V4.loaded) {
      V4.init({
        map: map,
        applyActionsLegacy: applyActions,
        askJarvis: askJarvis,
        esc: esc,
        AtriaDash: AtriaDash,
        userLoc: function () { return userLoc; },   // real device GPS, or null
      });
    }
  })();
  </script>
</body>
</html>
