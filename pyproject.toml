[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atria"
version = "0.1.7"
description = "AI-powered command-line tool for accelerated development workflows"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Atria Team", email = "lnma020504@gmail.com"}
]
maintainers = [
    {name = "Atria Team", email = "lnma020504@gmail.com"}
]
keywords = [
    "ai",
    "coding-assistant",
    "cli",
    "developer-tools",
    "code-generation",
    "llm",
    "automation",
    "software-engineering",
    "mcp",
    "agentic-systems"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Environment :: Console",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.12.3",
    "rich>=14.2.0",
    "httpx>=0.28.1",
    "tiktoken>=0.12.0",
    "fastmcp>=3.0.1",
    "fastapi>=0.119.1",
    "uvicorn>=0.38.0",
    "itsdangerous>=2.2.0",
    # AST-based code search
    "ast-grep-cli>=0.35.0",
    # gitignore matching
    "pathspec>=0.11.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0",
    # Pub/sub bus for cross-process push_block routing
    "redis>=5.0",
    # Distributed task queue for background subagents
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    # PDF extraction for Paper2Code subagent
    "pypdf>=4.0.0",
    # Excel / CSV parsing
    "openpyxl>=3.1.0",
    "markdown>=3.5.0",
    "weasyprint>=60.0",
    # Filesystem watcher for modules
    "watchdog>=4.0",
    # JWT validation for Keycloak auth
    "pyjwt[crypto]>=2.8",
    # Knowledge graph for maintenance_copilot (atria/web/routes/maintenance.py)
    "neo4j>=6.2.0",
    # WS client for proxying streaming speech-to-text to the ASR sidecar
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "aiosqlite>=0.19.0",
    "black>=25.9.0",
    "ruff>=0.14.1",
    "mypy>=1.18.2",
    "fakeredis>=2.0.0",
    # Shared service-module connector SDK (path source below) — needed by the
    # connector tests and `atria-module dev`.
    "atria-module-sdk",
]

[tool.uv.sources]
atria-module-sdk = { path = "atria_module_sdk", editable = true }

[project.urls]
Homepage = "https://github.com/atria-to/atria"
Documentation = "https://github.com/atria-to/atria#readme"
Repository = "https://github.com/atria-to/atria"
"Bug Tracker" = "https://github.com/atria-to/atria/issues"
Changelog = "https://github.com/atria-to/atria/releases"

[project.scripts]
atria = "atria.serve:main"
atria-module = "atria.module_dev:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["atria*"]
exclude = ["tests*", "docs*", "_archived_tests*"]

[tool.setuptools.package-data]
atria = [
    "config/**/*.json",
    "prompts/**/*.txt",
    "prompts/**/*.md",
    "core/agents/prompts/**/*.txt",
    "core/agents/prompts/**/*.md",
    "skills/**/*.md",
    "web/static/**/*",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "atria/skills/builtin/deep_research/tests",
]
asyncio_mode = "auto"
