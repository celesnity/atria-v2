[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minder"
version = "0.1.7"
description = "AI-powered command-line tool for accelerated development workflows"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Minder Team", email = "lnma020504@gmail.com"}
]
maintainers = [
    {name = "Minder Team", email = "lnma020504@gmail.com"}
]
keywords = [
    "ai",
    "coding-assistant",
    "cli",
    "developer-tools",
    "code-generation",
    "llm",
    "automation",
    "software-engineering",
    "mcp",
    "agentic-systems"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Environment :: Console",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.12.3",
    "rich>=14.2.0",
    "httpx>=0.28.1",
    "tiktoken>=0.12.0",
    "fastmcp>=3.0.1",
    "fastapi>=0.119.1",
    "uvicorn>=0.38.0",
    "itsdangerous>=2.2.0",
    # AST-based code search
    "ast-grep-cli>=0.35.0",
    # gitignore matching
    "pathspec>=0.11.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0",
    # Pub/sub bus for cross-process push_block routing
    "redis>=5.0",
    # PDF extraction (read_pdf tool)
    "pypdf>=4.0.0",
    # Excel / CSV parsing
    "openpyxl>=3.1.0",
    "markdown>=3.5.0",
    # Filesystem watcher for modules
    "watchdog>=4.0",
    # JWT validation for Keycloak auth
    "pyjwt[crypto]>=2.8",
    # WS client for proxying streaming speech-to-text to the ASR sidecar
    "websockets>=12",
    # Knowledge base: Qdrant vector store (dense search) + Neo4j knowledge graph
    "qdrant-client>=1.11",
    "neo4j>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "aiosqlite>=0.19.0",
    "black>=25.9.0",
    "ruff>=0.14.1",
    "mypy>=1.18.2",
    "fakeredis>=2.0.0",
]

# NOTE: the shared connector SDK (minder_python_sdk/) is a SEPARATE package, not an
# minder dependency — declaring it here as a path source broke the Docker build
# (`uv run` re-resolves it before the dir is copied). `make install` installs it
# editable for the connector tests / `minder-module`; module containers ship their
# own copy via their Dockerfile.

[project.urls]
Homepage = "https://github.com/minder-to/minder"
Documentation = "https://github.com/minder-to/minder#readme"
Repository = "https://github.com/minder-to/minder"
"Bug Tracker" = "https://github.com/minder-to/minder/issues"
Changelog = "https://github.com/minder-to/minder/releases"

[project.scripts]
minder = "minder.serve:main"
minder-module = "minder.module_dev:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# "minder*" also matched the sibling minder_python_sdk/ and minder_ui_sdk/ dirs, so the
# editable finder claimed them as minder's own top-level packages and shadowed the real
# SDK with an empty namespace package. Match only minder and its subpackages.
include = ["minder", "minder.*"]
exclude = ["tests*", "docs*", "_archived_tests*"]

[tool.setuptools.package-data]
minder = [
    "config/**/*.json",
    "prompts/**/*.txt",
    "prompts/**/*.md",
    "core/agents/prompts/**/*.txt",
    "core/agents/prompts/**/*.md",
    "skills/**/*.md",
    "web/static/**/*",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "minder/skills/builtin/deep_research/tests",
    "minder_python_sdk/tests",
]
asyncio_mode = "auto"
