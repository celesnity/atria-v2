[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atria-module-sdk"
version = "0.1.0"
description = "Build Atria service-module connectors without hand-rolling FastAPI. Implements the Atria connector contract v2."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    # httpx: used by announce.py (self-registration) and client.py (AtriaClient
    # reverse-push / push_artifact). Required at import time via the package __init__.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Convenience for running the connector standalone (uvicorn app:app).
serve = ["uvicorn>=0.29"]

[tool.hatch.build.targets.wheel]
packages = ["atria_module_sdk"]
